  var CSS="\nd3s-site{display:block;\n  --bg:#F6F5F9; --surface:#FFFFFF; --text:#1E1C24; --muted:#595663; --line:#DCD8E4;\n  --brand:#865CA3; --brand-deep:#5E3A7A; --on-brand:#FFFFFF; --teal:#0F7F6D; --amber:#A35D00;\n  --ink:#1C1626; --ink-2:#261E33; --ink-line:rgba(255,255,255,.14); --ink-text:#F1EEF6; --ink-muted:#B9B2C8;\n  --ph-a:#EEE8F4; --ph-b:#DACCE9;\n  --c-teal:#3FD6B6; --c-violet:#C9A3E6; --c-amber:#FFB347;\n  --font-display:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --font-body:\"IBM Plex Sans\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,Menlo,Consolas,monospace;\n  box-sizing:border-box;\n}\n*,*::before,*::after{box-sizing:inherit}\n.d3s-root{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}\nsvg{max-width:100%}\na{color:inherit}\nbutton{font-family:inherit}\n:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:2px}\n.ink :focus-visible{outline-color:var(--c-violet)}\n.wrap{width:min(1180px,100% - 48px);margin-inline:auto}\nh1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.02em;line-height:1.1}\nh1{font-size:clamp(2.4rem,5vw,3.9rem);font-weight:700}\nh2{font-size:clamp(1.8rem,3.2vw,2.6rem);font-weight:650}\nh3{font-size:1.4rem;font-weight:650;letter-spacing:-.01em}\np{margin:0}\n.lede{color:var(--muted);max-width:62ch}\n.fig{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);display:block;margin-bottom:10px}\n.ink .fig{color:var(--ink-muted)}\n.view{display:none}\n.view.active{display:block}\n\n/* header */\n.site-header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}\n.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}\n.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--font-display);font-size:1.3rem;letter-spacing:-.01em}\n.brand img{width:44px;height:44px;display:block}\n.brand b{font-weight:800}\n.brand span{font-weight:500;color:var(--muted)}\n.nav-links{display:flex;gap:26px;align-items:center}\n.nav-links a{text-decoration:none;font-size:.95rem;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent;cursor:pointer}\n.nav-links a:hover,.nav-links a.on{color:var(--text);border-bottom-color:var(--brand)}\n.nav-links .nav-cta{background:var(--brand);color:var(--on-brand);padding:10px 18px;border-radius:4px;font-weight:600;border-bottom:0}\n.nav-links .nav-cta:hover{filter:brightness(1.08);color:var(--on-brand)}\n.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:4px;font-size:.9rem;cursor:pointer}\n\n/* buttons */\n.btn{display:inline-block;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:4px;font-size:1rem;border:1px solid transparent;cursor:pointer}\n.btn-brand{background:var(--brand);color:var(--on-brand)}\n.btn-brand:hover{filter:brightness(1.08)}\n.btn-light{background:var(--ink-text);color:var(--ink)}\n.btn-ghost{border-color:var(--ink-line);color:var(--ink-text)}\n.btn-ghost:hover{border-color:var(--ink-text)}\n.btn-line{border-color:var(--line);color:var(--text)}\n.btn-line:hover{border-color:var(--text)}\n\n/* hero */\n.ink{background:var(--ink);color:var(--ink-text)}\n.hero{padding:64px 0 80px}\n.hero-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px;align-items:end}\n.hero h1{font-size:clamp(2.2rem,4.2vw,3.5rem);max-width:18ch}\n.hero .lede{color:var(--ink-muted);font-size:1.08rem;max-width:46ch}\n.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}\n.hero-meta{margin-top:44px}\n@media (max-width:1020px){.hero-top{grid-template-columns:1fr;gap:24px}}\n\n/* workspace mock */\n.ws{--t:#1E1C24;--m:#625E6C;--l:#E3DFEA;--b:#F6F5F9;--p:#865CA3;--pd:#5E3A7A;\n  background:#fff;color:var(--t);border-radius:8px;overflow   var HTML={"en": "<header class=\"site-header\"><div class=\"wrap nav\"><a class=\"brand\" href=\"#/\" aria-label=\"D3S Intelligence, home\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><div><b>D3S</b> <span>Intelligence</span></div></a><button class=\"menu-btn\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"navLinks\">Menu</button><nav class=\"nav-links\" id=\"navLinks\" aria-label=\"Main\"><a href=\"#/products\" data-route=\"products\">Products</a><a href=\"#/expertise\" data-route=\"expertise\">Expertise</a><a href=\"#/network\" data-route=\"network\">Network</a><a href=\"#/about\" data-route=\"about\">About</a><a class=\"lang\" id=\"langSwitch\" href=\"#\" aria-label=\"Vers\u00e3o em portugu\u00eas\">PT</a><a href=\"#contact\" data-scroll=\"contact\" class=\"nav-cta\">Partner with us</a></nav></div></header><main><div class=\"view\" data-view=\"home\"><section class=\"ink hero hero-vision\"><div class=\"wrap\"><h1>Building the future of social technology.</h1><p class=\"lede\">A social enterprise that builds technology for social impact, from grassroots knowledge to high-level technical expertise.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/products\">See our products</a><a href=\"#contact\" class=\"btn btn-ghost\" data-scroll=\"contact\">Partner with us</a></div></div></section><section class=\"sec\" id=\"vision\"><div class=\"wrap\"><div class=\"s-head\"><h2>One ecosystem, from the ground to the world</h2><p class=\"lede\">D3S Intelligence is a social enterprise that works with the NGO D3S Consultoria and the GSW-STEM network. Together, they form an international institutional design for social impact entrepreneurship, able to build technology for social impact, from grassroots knowledge to high-level technical expertise.</p></div><span class=\"fig\">Fig 0.1. How the ecosystem works</span><div class=\"flow4\" role=\"group\" aria-label=\"How the ecosystem works\"><div class=\"fnode ground\"><span class=\"fig\">The ground</span><h3>Grassroots initiatives and social problems</h3><p>Where the work starts</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">The bridge</span><h3>D3S Consultoria</h3><p>NGO, since 2024</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode key\"><span class=\"fig\">The solutions</span><h3>D3S Intelligence</h3><p>Social enterprise</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">The scale</span><h3>GSW-STEM</h3><p>International network</p></div></div><div class=\"three explain\"><div><span class=\"fig\">The bridge</span><h3>D3S Consultoria, the link to the ground</h3><p>An NGO active since 2024 that works hand in hand with grassroots organizations and public institutions in Brazil. It turns problems on the ground into diagnostics, research and training.</p><a class=\"inl\" href=\"#/expertise\">See the expertise</a></div><div><span class=\"fig\">The enterprise</span><h3>D3S Intelligence, smart solutions</h3><p>A social enterprise that offers smart technology solutions to those problems. It builds on what the field and the network teach, and reinvests its profit in the mission.</p><a class=\"inl\" href=\"#/products\">See the products</a></div><div><span class=\"fig\">The landscape</span><h3>GSW-STEM, the international scale</h3><p>A network of women in technology in seven countries: Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia. It is the international landscape where solutions can scale.</p><a class=\"inl\" href=\"#/network\">See the network</a></div></div></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>35,000+</b><span>people reached through partner organizations</span></div><div class=\"stat\"><b>40+</b><span>professionals trained in data for social impact</span></div><div class=\"stat\"><b>2</b><span>international recognitions: Systers Pass It On and BRICS Young Innovators</span></div><div class=\"stat\"><b>7</b><span>countries in the GSW-STEM network</span></div></div><p class=\"names\"><b>Worked with, in Brazil:</b> Abra\u00e7o Campe\u00e3o (youth education, Rio de Janeiro), ELO (youth inclusion, Curitiba), Engajamundo (climate justice), Reprograma (women in tech), and others.</p></div></section><section class=\"sec alt\" id=\"home-products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Products built on field expertise</h2><p class=\"lede\">Each starts from a problem we worked on by hand in the field, and turns that practice into something repeatable.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Product 1</span><div class=\"status pilot\"><i></i>Pilot program, partners wanted</div><h3>Impact Intelligence</h3><p class=\"one\">A mixed-methods evidence engine for third-sector organizations.</p><div class=\"prod-viz mock\"><img class=\"mock-img\" src=\"images/mock-workspace-en.png\" alt=\"Impact Intelligence workspace, illustrative data\" loading=\"lazy\"></div><ul class=\"facts\"><li><span>For</span><b>NGOs, institutes, foundations</b></li><li><span>Input</span><b>Spreadsheets, PDFs, reports, transcripts</b></li><li><span>Pilot</span><b>Up to three organizations</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/pilot\">Join the pilot</a><a class=\"btn btn-line\" href=\"#/method\">How it works</a></div></article><article class=\"prod\"><span class=\"fig\">Product 2</span><div class=\"status\"><i></i>Live in beta on Android and iOS</div><h3>NeuroAnchor</h3><p class=\"one\">To bring you back when hyperfocus takes over.</p><div class=\"prod-viz\"><div class=\"phone\" data-slot=\"NA\" aria-label=\"NeuroAnchor screens, illustrative\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, now</small>It has been a while. Have you had some water?</div></div><div class=\"chk\">How are you doing?</div><div class=\"chk-grid\"><span>Had water</span><span>Ate</span><span>Stretched</span><span>Talked to someone</span></div><div class=\"chk-note\">No pressure. Not now is always fine.</div></div></div><ul class=\"facts\"><li><span>For</span><b>Neurodivergent and anxious people</b></li><li><span>Privacy</span><b>On-device by default, no ads</b></li><li><span>Plans</span><b>Free, Premium, Pro, Business</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta\">Join the beta</a><a class=\"btn btn-line\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20for%20Business\">For companies</a></div></article></div><div class=\"pipe\"><h3>In research</h3><div class=\"pipe-grid\"><div><span class=\"when\">Pipeline</span><b>Accountability layer</b><p>Tamper-evident feedback tracking, so funders and NGOs can show they listened.</p></div><div><span class=\"when\">Pipeline</span><b>Field narrative analysis</b><p>Qualitative analysis that starts from real fieldwork, not from a cold upload.</p></div><div><span class=\"when\">Pipeline</span><b>Low-connectivity data tools</b><p>Data capture and sync that never assume a live internet connection.</p></div></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>What stands behind the products</h2><p class=\"lede\">Expertise built in the field, a reputation recognized abroad, and a network that already crosses borders.</p></div><div class=\"trio\"><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Fieldwork in a Rio de Janeiro favela community\"><span class=\"slot\">F1</span><figcaption>Fieldwork in a Rio de Janeiro favela community</figcaption></figure><span class=\"fig\">Expertise</span><h3>Built in the field</h3><ul class=\"plain\"><li>Community-level diagnostics with NGOs in Brazil, including in Rio de Janeiro's favelas</li><li>Qualitative research directed by a social anthropologist</li><li>Team experience inside the governments of S\u00e3o Paulo, Brazil's largest city and state</li></ul><a class=\"inl\" href=\"#/expertise\">See the expertise</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Award event, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Award event, Systers Pass It On</figcaption></figure><span class=\"fig\">Reputation</span><h3>Recognized abroad</h3><ul class=\"plain\"><li>Systers Pass It On Award 2024, from AnitaB.org, the global community for women in computing</li><li>BRICS Young Innovators recognition</li><li>Founder holds a seat on the Interministerial Working Group on Indicators of S\u00e3o Paulo, Brazil's largest city</li></ul><a class=\"inl\" href=\"#/about\">See our story</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delegation to China\"><span class=\"slot\">F5</span><figcaption>Delegation to China</figcaption></figure><span class=\"fig\">Reach</span><h3>A network that crosses borders</h3><ul class=\"plain\"><li>GSW-STEM: Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia</li><li>Meetings convened across regions</li><li>Now building new links in China</li></ul><a class=\"inl\" href=\"#/network\">See the network</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Profit goes back to the mission</h2><p class=\"lede\" style=\"margin-top:16px\">D3S Intelligence reinvests its profit in the research and training of D3S Consultoria and in the GSW-STEM network, so the expertise behind the products keeps growing.</p></div><div class=\"links\" style=\"margin-top:0\"><a class=\"btn btn-line\" href=\"#/about\">See how it is funded</a></div></div></section><section class=\"ink contact\" id=\"contact\"><div class=\"wrap\"><h2>Partner with us</h2><div class=\"paths\"><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Funders%20and%20foundations\"><b>Funders and foundations</b><span>Fund research, or sponsor access to our tools for the organizations you support.</span><em>Start a conversation</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Government%20and%20municipalities\"><b>Governments and municipalities</b><span>Evidence, indicators and risk-mapping tools for public policy.</span><em>Talk to us</em></a><a href=\"#/pilot\"><b>NGOs and institutes</b><span>Join the Impact Intelligence pilot with your own data.</span><em>Apply to the pilot</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Companies%20and%20partners\"><b>Companies and partners</b><span>Wellbeing, ESG and impact measurement, and partnerships in the Global South.</span><em>Partner with us</em></a></div></div></section></div><div class=\"view\" data-view=\"about\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Two years of work, and what comes next.</h1><p class=\"lede\">D3S Consultoria began in 2024 as a volunteer-led NGO helping organizations use data well. Today D3S Intelligence, a social enterprise and think tank, brings that expertise together with the GSW-STEM network and a set of products.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Award event, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Award event, Systers Pass It On</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Our story</h2><p class=\"lede\" style=\"margin-top:16px\">Most data scientists do not work on social causes, because investment flows elsewhere. We started D3S Consultoria to change that, led and run entirely by women, trans and non-binary people.</p><p class=\"note-draft draft\">Dates marked \"to confirm\" need checking against your records.</p></div><ol class=\"tl2\"><li><small class=\"when\">2024</small><b>D3S Consultoria begins as a volunteer-led NGO</b><span>Qualified data for NGOs, and space for women, trans and non-binary people in data and technology.</span></li><li><small class=\"when\">2024</small><b>First consulting cycle</b><span>Five organizations selected, with more than 40 days of work to produce a complex analytical product.</span></li><li><small class=\"when\">August 2024</small><b>First analytical product delivered</b><span>Presented in person to Abra\u00e7o Campe\u00e3o, a youth organization in the Complexo do Alem\u00e3o, one of Rio de Janeiro's largest favela complexes.</span></li><li><small class=\"when\">August 2024</small><b>Systers Pass It On Award</b><span>One of the winners, recognized by AnitaB.org, the global community for women in computing, for building community for women in STEM.</span></li><li><b>BRICS Young Innovators</b><span>Recognized as an innovation led from the Global South.</span></li><li><b>Training cycles and volunteer program</b><span>Four training cycles for NGO professionals, and a volunteer program with calls twice a year.</span></li><li><small class=\"when\">2026</small><b>GSW-STEM launched</b><span>A network of women in technology across Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia, launched by the founder of D3S Consultoria.</span></li><li><b>Building links in China</b><span>Delegation to build a network that fosters technology cooperation.</span></li><li><small class=\"when\">2026</small><b>D3S Intelligence launches</b><span>A social enterprise and think tank. Its products build on the NGO's expertise, and its profit funds the mission.</span></li></ol></div></section><section class=\"sec alt\" id=\"people\"><div class=\"wrap\"><div class=\"s-head\"><h2>Our people</h2><p class=\"lede\">A small leadership team, a volunteer community, and an international network. All led and run by women, trans and non-binary people.</p></div><span class=\"fig\">Fig 5.1. People across the ecosystem</span><svg class=\"org\" viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"Organization chart: CEO, two directors, volunteer program, international network and women-led companies\"><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M380 52 V69 M230 69 H530 M230 69 V86 M530 69 V86\"/><path d=\"M230 130 V147 H530 V130 M380 147 V164\"/></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\" fill=\"none\"><path d=\"M200 186 H280 M480 186 H560\"/></g><g class=\"obox\"><rect x=\"280\" y=\"8\" width=\"200\" height=\"44\" rx=\"6\" class=\"key\"/><rect x=\"130\" y=\"86\" width=\"200\" height=\"44\" rx=\"6\"/><rect x=\"430\" y=\"86\" width=\"200\" height=\"44\" rx=\"6\"/><rect x=\"280\" y=\"164\" width=\"200\" height=\"44\" rx=\"6\"/><rect x=\"10\" y=\"164\" width=\"190\" height=\"44\" rx=\"6\" class=\"dash\"/><rect x=\"560\" y=\"164\" width=\"190\" height=\"44\" rx=\"6\" class=\"dash\"/></g><g text-anchor=\"middle\" class=\"olab\"><text x=\"380\" y=\"35\" class=\"strong\">CEO and founder</text><text x=\"230\" y=\"113\">Director of Projects</text><text x=\"530\" y=\"113\">Director of Qualitative Research</text><text x=\"380\" y=\"191\">Board and volunteers (20)</text><text x=\"105\" y=\"191\">Women-led companies</text><text x=\"655\" y=\"191\">GSW-STEM network</text></g></svg><div class=\"tier\"><div class=\"tier-h\"><h3>Leadership</h3><p>Researchers and practitioners from the public sector and academia.</p></div><div class=\"team3\"><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T1\" role=\"img\" aria-label=\"Phirtia Silva\">PS</span><b>Phirtia Silva</b><small>Founder and CEO</small><p>Data scientist and social entrepreneur. Founder of D3S Consultoria and GSW-STEM, and CEO of D3S Intelligence. Has led human rights data analysis for the municipal government of S\u00e3o Paulo, Brazil's largest city, and holds a seat on its Interministerial Working Group on Indicators.</p></div><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T2\" role=\"img\" aria-label=\"Thayna Mesquita\">TM</span><b>Thayna Mesquita</b><small>Projects Director</small><p>Social scientist and cultural management specialist. Leads institutional partnerships, project design and fundraising. More than five years in public cultural funding and financial accountability in S\u00e3o Paulo, now at the State Secretariat of Culture.</p></div><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T3\" role=\"img\" aria-label=\"Amanda Raquel\">AR</span><b>Amanda Raquel</b><small>Director of Qualitative Research</small><p>Social anthropologist with more than ten years of fieldwork. PhD from the Federal University of Rio Grande do Norte, Best PhD Thesis 2024. Visiting researcher at INAH-UNAM in Mexico, and fellow at Harvard's ALARI.</p></div></div></div><div class=\"tier\"><div class=\"tier-h\"><h3>Volunteers</h3><p>About 20 direct collaborators across the board and the scientific-empowerment program of D3S Consultoria.</p></div><div><figure class=\"photo  draft-until-img\" style=\"--r:16/7\" data-slot=\"V1\" role=\"img\" aria-label=\"Volunteer group\"><span class=\"slot\">V1</span><figcaption>Volunteer group</figcaption></figure><div class=\"avrow draft\"><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Volunteer portrait placeholder\"></span><span class=\"more\">and more</span></div></div></div><div class=\"tier draft\"><div class=\"tier-h\"><h3>International network</h3><p>Members of GSW-STEM in seven countries.</p></div><div class=\"members\"><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N1\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N2\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N3\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N4\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N5\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N6\">Photo</span><b>Name</b><small>Role, country</small></div></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>How it is funded</h2><p class=\"lede\">The social enterprise earns revenue. The mission spends it.</p></div><div class=\"flow\"><div class=\"blk\"><span class=\"fig\">What we sell</span><h3>Products and services</h3><ul class=\"plain\"><li>Impact Intelligence, evidence tools for NGOs and funders</li><li>NeuroAnchor, wellbeing technology</li><li>Analytical consulting</li></ul></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk key\"><span class=\"fig\">What we do with it</span><h3>Reinvest in the mission</h3><p>Profit goes back into research, training and the network.</p><p class=\"ph pledge draft\">Share reinvested and annual report: to be defined by D3S Intelligence.</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk\"><span class=\"fig\">What it pays for</span><h3>Research, training and the network</h3><ul class=\"plain\"><li>Analytical support for NGOs, through D3S Consultoria</li><li>Training and a volunteer program in data and tech</li><li>International partnerships, through GSW-STEM</li></ul></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>What we are here to do</h2><p class=\"lede\">The statute of D3S Consultoria sets twelve objectives. These are the four themes they share.</p></div><div class=\"four mission\"><div><h3>Evidence</h3><ul class=\"plain\"><li>Analytical, impact and applied research for organizations aligned with social development</li><li>Models and indicators to prevent violence and protect rights</li></ul></div><div><h3>Programs and policy</h3><ul class=\"plain\"><li>Improve social development programs with Brazilian and international NGOs</li><li>Improve public policy that protects vulnerable people and minorities</li><li>Reduce inequality, protect children, advance gender and racial justice</li></ul></div><div><h3>Technology and inclusion</h3><ul class=\"plain\"><li>Wider access to knowledge and technology</li><li>Technology programs for socioeconomic development</li><li>Include more women in STEM</li></ul></div><div><h3>Talent, voice and funding</h3><ul class=\"plain\"><li>Train people working in social impact</li><li>Public debate and advocacy to include the third sector in technology</li><li>Raise funds to reinvest in social and technological development</li></ul></div></div></div></section></div><div class=\"view\" data-view=\"expertise\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Expertise built in the field.</h1><p class=\"lede\">Two years of community diagnostics, research and training with civil society in Brazil, through our NGO D3S Consultoria. This is where our products come from, and why they work.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Fieldwork in a Rio de Janeiro favela community\"><span class=\"slot\">F1</span><figcaption>Fieldwork in a Rio de Janeiro favela community</figcaption></figure></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>5</b><span>organizations in the first consulting cycle, with more than 40 days of work</span></div><div class=\"stat\"><b>40+</b><span>professionals trained in four cycles</span></div><div class=\"stat\"><b>35,000+</b><span>people reached through partner organizations</span></div><div class=\"stat\"><b>2 years</b><span>of work with civil society, since 2024</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Fieldwork first, then technology</h2><p class=\"lede\" style=\"margin-top:16px\">Most data tools are built without ever visiting the communities they describe. We start in the community, with researchers who listen, and then build the tools that make that knowledge reusable.</p><ul class=\"check\"><li><b>Mixed methods.</b> Quantitative analysis and qualitative research, side by side.</li><li><b>Led by researchers.</b> A social anthropologist with more than ten years of fieldwork directs our qualitative work.</li><li><b>Public sector experience.</b> Our team has worked inside the governments of S\u00e3o Paulo, Brazil's largest city, on human rights indicators and cultural policy.</li></ul></div><div><span class=\"fig\">Fig 1.1. Research methods we lead</span><ul class=\"facts big\"><li><span>Ethnography</span><b>Observation in the territory</b></li><li><span>Interviews</span><b>In-depth and focus groups</b></li><li><span>Workshops</span><b>Facilitated, with communities</b></li><li><span>Analysis</span><b>Thematic and intersectional</b></li><li><span>Output</span><b>Diagnostics and recommendations</b></li></ul></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Programs</h2><p class=\"lede\">Programs of our NGO, D3S Consultoria. Each is also a learning ground for the products we build.</p></div><div class=\"progs\"><article class=\"prog\"><div><span class=\"fig\">Program 1</span><h3>Analytical consulting for NGOs</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F1\" role=\"img\" aria-label=\"Delivery to a youth organization in Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Delivery to a youth organization in Rio de Janeiro</figcaption></figure></div><div><p>We work with each organization to produce a complex analytical product from the data it already has, and help it use that data to speak with funders.</p><ul class=\"facts\"><li><span>Diagnostics</span><b>Territorial and impact</b></li><li><span>Support</span><b>Data treatment, analysis, methods</b></li><li><span>First cycle</span><b>Five organizations</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Program 2</span><h3>Training for NGO professionals</h3></div><div><p>Four training cycles with professionals from non-governmental organizations.</p><ul class=\"facts\"><li><span>Cycle topics</span><b>Territorial diagnosis tools</b></li><li><span></span><b>Quantitative and qualitative data to measure impact</b></li><li><span></span><b>Data for strategic decisions</b></li><li><span></span><b>Program monitoring and evaluation</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Program 3</span><h3>Socioeducational volunteer program</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F3\" role=\"img\" aria-label=\"Volunteer project\"><span class=\"slot\">F3</span><figcaption>Volunteer project</figcaption></figure></div><div><p>Technical and scientific empowerment for women, trans and non-binary professionals in data and technology, through real project work.</p><ul class=\"facts\"><li><span>You get</span><b>Certificates, training, networking</b></li><li><span>Hands-on</span><b>Work on D3S Consultoria projects</b></li><li><span>Calls</span><b>Twice a year, next call coming soon</b></li></ul></div></article></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>How we can help your organization</h2><p class=\"lede\">Find where you are, and start there.</p></div><div class=\"svc\"><div><h3>Inputs</h3><p>Unsure which data you can use, and when and how.</p></div><div><h3>Analysis</h3><p>You have relevant data but no resources for qualified analysis.</p></div><div><h3>Methods</h3><p>You need more maturity in quantitative and qualitative methods.</p></div><div><h3>Training</h3><p>Your team needs to understand today's data context and build a data culture.</p></div><div><h3>Data treatment</h3><p>You have not yet worked with quantitative and qualitative data, even in simple tools like Excel.</p></div><div><h3>Territorial diagnosis</h3><p>You know the territory but cannot yet turn that knowledge into data funders understand.</p></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Organizations we have worked with</h2><p class=\"lede\">Descriptions are the organizations' own work, as shown on the D3S Consultoria site.</p></div><div class=\"partners\"><div><h3>Abra\u00e7o Campe\u00e3o</h3><p>A youth organization in the Complexo do Alem\u00e3o, a large favela complex in Rio de Janeiro. For nearly ten years it has worked with children and young people through martial arts, education and personal development. D3S Consultoria delivered profile, territorial and student-segmentation analysis.</p></div><div><h3>ELO Apoio Socioambiental</h3><p>More than ten years working with young people in vulnerable situations, in education and productive inclusion, in Curitiba in southern Brazil. It reports reaching over 20,000 people.</p></div><div><h3>Engajamundo</h3><p>A national organization with eleven years of work and 24 territories of action, including the Alto Xingu in the Amazon region. It raises awareness among young Brazilians on climate and socio-environmental justice.</p></div><div><h3>Reprograma</h3><p>A pioneer in STEM education in Brazil since 2016, closing the gender and race gap in technology by training women in vulnerable situations, especially Black and trans women.</p></div></div><p class=\"note-plain\">Also: Instituto Semeia and Abra\u00e7o Cultural.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>From the news</h2></div><ul class=\"init\"><li><h3>D3S Consultoria wins its first international award</h3><p>One of the winners of the Systers Pass It On Award 2024, by AnitaB.org, the global community for women in computing.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/a-d3s-consultoria-ganha-primeiro-pr%C3%AAmio-internacional\" rel=\"noopener\">15 Aug 2024</a></li><li><h3>D3S Consultoria takes its first report to Rio de Janeiro</h3><p>The first analytical product, delivered in person to a youth organization in the Complexo do Alem\u00e3o favela complex.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/d3s-consultoria-vai-at%C3%A9-o-complexo-do-alem%C3%A3o\" rel=\"noopener\">15 Aug 2024</a></li></ul></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Bring us a question from the field</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Consulting\">Talk to us</a><a class=\"btn btn-ghost\" href=\"#/products\">See the products</a></div></div></section></div><div class=\"view\" data-view=\"products\"><section class=\"ink hero\"><div class=\"wrap\"><div class=\"hero-top\"><h1>Tools that make evidence easier to use.</h1><div><p class=\"lede\">D3S Intelligence builds the products, and reinvests its profit in research and training by D3S Consultoria and in the GSW-STEM network.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pilot\">Join the pilot</a><a class=\"btn btn-ghost\" href=\"#/method\">Read the method</a></div></div></div><div class=\"hero-meta\"><span class=\"fig\">Fig 0.1. Impact Intelligence workspace. Interactive, with illustrative data.</span><div class=\"ws\" id=\"ws\"><div class=\"ws-bar\"><i></i><i></i><i></i><span>Impact Intelligence / Employment program</span><em>Illustrative data</em></div><div class=\"ws-body\"><aside class=\"ws-side\" aria-label=\"Sources\"><h4>Sources (5)</h4><ul><li data-s=\"1\"><span class=\"tag\">xlsx</span>Attendance and placements, 2021 to 2025</li><li data-s=\"2\"><span class=\"tag\">docx</span>Interview transcripts, 34 files, five sites</li><li data-s=\"3\"><span class=\"tag\">xlsx</span>Follow-up survey, 2023 and 2025</li><li data-s=\"4\"><span class=\"tag\">pdf</span>Annual report 2024</li><li data-s=\"5\"><span class=\"tag warn\">review</span>Theory of change (inferred)</li></ul><h4>Checks on this answer</h4><ul><li><span class=\"tag warn\">1</span>Question wording changed</li><li><span class=\"tag\">2</span>Evidence compared</li><li><span class=\"tag warn\">1</span>Evidence missing</li></ul></aside><div class=\"ws-main\"><div class=\"q\"><b>Why did our employment program underperform this year?</b><small>Asked by program manager</small></div><div class=\"drift\" id=\"drift\"><strong>Question wording changed between years</strong><p id=\"driftText\">The follow-up survey behind this indicator asked \"Current employment situation\" in 2023 and \"Are you currently employed?\" in 2025. Should the two be compared?</p><div class=\"drift-actions\" id=\"driftActions\"><button type=\"button\" data-d=\"yes\">Treat as comparable</button><button type=\"button\" data-d=\"no\">Keep separate</button></div></div><div class=\"ws-grid\"><div><h5>Evidence</h5><div class=\"tabs\" role=\"tablist\" aria-label=\"Relationship between quantitative and qualitative evidence\"><button class=\"tab\" role=\"tab\" data-k=\"convergence\" aria-selected=\"true\"><i style=\"background:#0F7F6D\"></i>Convergence</button><button class=\"tab\" role=\"tab\" data-k=\"complementarity\" aria-selected=\"false\"><i style=\"background:#865CA3\"></i>Complementarity</button><button class=\"tab\" role=\"tab\" data-k=\"divergence\" aria-selected=\"false\"><i style=\"background:#C98A1B\"></i>Divergence</button></div><svg class=\"chart\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"90-day placement rate 2021 to 2025 compared with interview evidence\"><g stroke=\"#E3DFEA\" stroke-width=\"1\"><line x1=\"30\" y1=\"60\" x2=\"500\" y2=\"60\"/><line x1=\"30\" y1=\"110\" x2=\"500\" y2=\"110\"/><line x1=\"30\" y1=\"160\" x2=\"500\" y2=\"160\"/><line x1=\"30\" y1=\"200\" x2=\"500\" y2=\"200\"/></g><g text-anchor=\"middle\"><text x=\"50\" y=\"224\">2021</text><text x=\"150\" y=\"224\">2022</text><text x=\"250\" y=\"224\">2023</text><text x=\"350\" y=\"224\">2024</text><text x=\"450\" y=\"224\">2025</text></g><path id=\"qual\" d=\"\" fill=\"none\" stroke=\"#0F7F6D\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle id=\"qualDot\" r=\"5\" cx=\"450\" cy=\"60\" fill=\"#0F7F6D\"/><path id=\"quantA\" d=\"M50 95.5 L150 73.5 L250 79 L350 84.5\" fill=\"none\" stroke=\"#1E1C24\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path id=\"quantB\" d=\"M350 84.5 L450 178\" fill=\"none\" stroke=\"#1E1C24\" stroke-width=\"3\" stroke-linecap=\"round\"/><g fill=\"#1E1C24\"><circle cx=\"50\" cy=\"95.5\" r=\"4\"/><circle cx=\"150\" cy=\"73.5\" r=\"4\"/><circle cx=\"250\" cy=\"79\" r=\"4\"/><circle cx=\"350\" cy=\"84.5\" r=\"4\"/></g><circle id=\"pt25\" cx=\"450\" cy=\"178\" r=\"5\" fill=\"#1E1C24\"/><circle id=\"ring25\" cx=\"450\" cy=\"178\" r=\"11\" fill=\"none\" stroke=\"#C98A1B\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"350\" y=\"68\" text-anchor=\"middle\" style=\"fill:#1E1C24;font-weight:600\">61%</text><text id=\"lbl25\" x=\"450\" y=\"204\" text-anchor=\"middle\" style=\"fill:#1E1C24;font-weight:600\">44%</text></svg><div class=\"leg\"><span><i style=\"background:#1E1C24\"></i>90-day placement rate</span><span><i id=\"legQ\" style=\"background:#0F7F6D\"></i><em id=\"legT\" style=\"font-style:normal\">Interviews: transport barrier mentions</em></span></div></div><div><div class=\"verdict\" aria-live=\"polite\"><h5>Triangulation result</h5><h4 id=\"vT\">Convergence</h4><p id=\"vP\"></p></div><div class=\"gapbox\"><b>Missing evidence.</b> No data links participants' commute distance to placement outcomes. That would turn a plausible explanation into a supported one.</div></div></div><div class=\"ws-foot\">Hover the numbered references to see their sources. Every statement links back to a document. Your team interprets the result.</div></div></div></div></div></div></section><section class=\"sec\" id=\"checks\"><div class=\"wrap\"><div class=\"s-head\"><h2>Three checks built into every answer</h2><p class=\"lede\">Finding documents is the easy part. The value is in how evidence is compared, and in saying clearly what the evidence cannot support.</p></div><div class=\"mods\"><div class=\"mod\"><span class=\"fig\">Fig 1.1</span><h3>Question drift</h3><p class=\"d\">Forms change from one funding cycle to the next. We flag when a question was reworded, and ask your team whether the years can be compared.</p><div class=\"frag\" aria-label=\"Example of a reworded question\"><div class=\"row-drift\"><code>2023</code><span>Employment status</span></div><div class=\"row-drift\"><code>2024</code><span>Current employment situation</span></div><div class=\"row-drift\"><code>2025</code><span>Are you currently employed?</span></div><span class=\"badge\">Possible same construct: needs your confirmation</span></div></div><div class=\"mod\"><span class=\"fig\">Fig 1.2</span><h3>Cause or pattern</h3><p class=\"d\">A theme that appears often is not a cause. Answers keep what the data shows separate from what it only suggests.</p><div class=\"frag\" aria-label=\"Example of causal language check\"><div class=\"say bad\"><small>Draft statement</small>Transport costs caused the decline.</div><div class=\"say good\"><small>Suggested wording</small>Transport cost is the most mentioned barrier at the two sites with the largest decline.</div></div></div><div class=\"mod\"><span class=\"fig\">Fig 1.3</span><h3>Missing evidence</h3><p class=\"d\">We hold your theory of change next to your data, so we can name the evidence that should exist for a claim, and doesn't.</p><div class=\"frag\" aria-label=\"Example theory of change gap\"><div class=\"chain\"><div class=\"ok\"><span>Activities: training sessions</span><b>Data found</b></div><div class=\"ok\"><span>Outputs: training completion</span><b>Data found</b></div><div class=\"miss\"><span>Outcome: still employed at 90 days</span><b>No data</b></div></div></div></div></div></div></section><section class=\"sec alt\" id=\"products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Two products, built on method</h2><p class=\"lede\">Each starts from a problem we worked on by hand in the field, and turns that practice into something repeatable.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Product 1</span><div class=\"status pilot\"><i></i>Pilot program, partners wanted</div><h3>Impact Intelligence</h3><p class=\"one\">A mixed-methods evidence engine for third-sector organizations.</p><div class=\"prod-viz\"><div class=\"trace\"><div class=\"ans\">Placement fell most at the two sites where interviews name transport cost most often <sup class=\"ref\">1</sup><sup class=\"ref\">2</sup>. No data yet links commute distance to outcome.</div><ol><li>Attendance and placements, 2021 to 2025</li><li>Interview transcripts, five sites</li></ol></div></div><ul class=\"facts\"><li><span>For</span><b>NGOs, institutes, foundations</b></li><li><span>Input</span><b>Spreadsheets, PDFs, reports, transcripts</b></li><li><span>Pilot</span><b>Up to three organizations</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/pilot\">Join the pilot</a><a class=\"btn btn-line\" href=\"#/method\">How it works</a></div></article><article class=\"prod\"><span class=\"fig\">Product 2</span><div class=\"status\"><i></i>Live in beta on Android and iOS</div><h3>NeuroAnchor</h3><p class=\"one\">To bring you back when hyperfocus takes over.</p><div class=\"prod-viz\"><div class=\"phone\" aria-label=\"NeuroAnchor screens, illustrative\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, now</small>It has been a while. Have you had some water?</div></div><div class=\"chk\">How are you doing?</div><div class=\"chk-grid\"><span>Had water</span><span>Ate</span><span>Stretched</span><span>Talked to someone</span></div><div class=\"chk-note\">No pressure. Not now is always fine.</div></div></div><ul class=\"facts\"><li><span>For</span><b>Neurodivergent and anxious people</b></li><li><span>Privacy</span><b>On-device by default, no ads</b></li><li><span>Plans</span><b>Free, Premium, Pro, Business</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta\">Join the beta</a><a class=\"btn btn-line\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20for%20Business\">For companies</a></div></article></div><div class=\"pipe\"><h3>In research</h3><div class=\"pipe-grid\"><div><span class=\"when\">Pipeline</span><b>Accountability layer</b><p>Tamper-evident feedback tracking, so funders and NGOs can show they listened.</p></div><div><span class=\"when\">Pipeline</span><b>Field narrative analysis</b><p>Qualitative analysis that starts from real fieldwork, not from a cold upload.</p></div><div><span class=\"when\">Pipeline</span><b>Low-connectivity data tools</b><p>Data capture and sync that never assume a live internet connection.</p></div></div></div></div></section></div><div class=\"view\" data-view=\"method\"><section class=\"ink page-hero\"><div class=\"wrap\"><h1>A method, not a chat box.</h1><p class=\"lede\">Anyone can upload documents and ask questions. Impact Intelligence adds monitoring and evaluation practice on top: structured comparison of numbers and narratives, and a clear view of what evidence is missing.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Triangulation: three ways evidence can relate</h2><p class=\"lede\">When quantitative and qualitative evidence address the same question, their relationship falls into one of three categories. Every answer says which.</p></div><div class=\"three\"><div><span class=\"dot\" style=\"background:var(--teal)\"></span><h3>Convergence</h3><p>Both sources point the same way and reinforce each other. This strengthens an explanation, without proving it.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 55 L100 40 L190 12\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 60 L100 48 L190 20\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.5\"/></svg></div><div><span class=\"dot\" style=\"background:var(--brand)\"></span><h3>Complementarity</h3><p>The sources cover different facets of the same picture, without contradicting each other.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 50 L100 40 L190 14\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 40 L100 42 L190 38\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"2.5\"/></svg></div><div><span class=\"dot\" style=\"background:var(--amber)\"></span><h3>Divergence</h3><p>The sources disagree. That is often the most useful finding, not a defect to smooth over.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 50 L100 40 L190 14\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 14 L100 36 L190 58\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"2.5\"/></svg></div></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Detecting what is missing</h2><p class=\"lede\" style=\"margin-top:16px\">The system holds a structured view of your theory of change, with inputs, activities, outputs and outcomes. It can then say when you have evidence that a program ran, but not that it worked.</p><ul class=\"check\"><li><b>Inferred, then confirmed.</b> A provisional theory of change is drafted from your documents. Your team corrects it before it drives any output.</li><li><b>Gaps point to indicators.</b> Each flag names the specific data point that would settle the question.</li><li><b>Findings are questions.</b> Results are framed for your interpretation, never as verdicts on your organization.</li></ul></div><div class=\"frag\" style=\"padding:20px\"><span class=\"fig\">Fig 2.1. Theory of change check</span><div class=\"chain\"><div class=\"ok\"><span>Inputs: staff, funding</span><b>Data found</b></div><div class=\"ok\"><span>Activities: training sessions</span><b>Data found</b></div><div class=\"ok\"><span>Outputs: training completion</span><b>Data found</b></div><div class=\"miss\"><span>Outcome: employed at 90 days</span><b>No data</b></div><div class=\"miss\"><span>Outcome: still employed at one year</span><b>No data</b></div></div><p class=\"note-draft\">Your program has evidence that training ran. It cannot yet show that it worked.</p></div></div></section><section class=\"sec\" id=\"protection\"><div class=\"wrap std\"><div><h2>Data protection and ethics</h2><p class=\"lede\" style=\"margin-top:16px\">Designed around Brazil's LGPD and the EU's GDPR, and held to a stricter standard than the minimum.</p></div><dl><div class=\"r\"><dt>Minimum data</dt><dd>We start with organization and program-level information, not beneficiary-level records, unless a question truly requires them.</dd></div><div class=\"r\"><dt>Controlled access</dt><dd>Access is limited, identifying information is kept apart from analytical data, and individual-level data is anonymized or pseudonymized.</dd></div><div class=\"r\"><dt>Explicit permission</dt><dd>Each dataset is used only with your explicit permission. No incidental use of sensitive personal information.</dd></div><div class=\"r\"><dt>Human review</dt><dd>Every answer is traceable to its source, and outputs are reviewed by your specialists before they leave your organization.</dd></div></dl></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>See it on your own data</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pilot\">Join the pilot</a><a class=\"btn btn-ghost\" href=\"#/\">Back to home</a></div></div></section></div><div class=\"view\" data-view=\"pilot\"><section class=\"ink page-hero\"><div class=\"wrap\"><h1>Join the Impact Intelligence pilot.</h1><p class=\"lede\">A time-boxed pilot with up to three organizations. You bring years of existing data. We build the workspace with your team, test it on real questions, and learn together what is worth paying for.</p></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>What you get</h2><ul class=\"check\"><li><b>An NGO Data and Evidence Map.</b> Your programs, data sources and recurring questions in one place.</li><li><b>Data and indicator dictionaries,</b> including how questions changed over the years.</li><li><b>A theory-of-change map</b> drafted from your documents, for your team to confirm.</li><li><b>A working analytical workspace,</b> with training and support for your staff.</li></ul><h2 style=\"margin-top:48px\">What we ask of you</h2><ul class=\"check\"><li><b>Historical data</b> from several years, ideally spanning at least one change in forms or definitions.</li><li><b>Staff time,</b> which we measure so we can be honest about the effort.</li><li><b>Straight answers</b> on whether you would pay for this, and what you would pay.</li></ul><p class=\"note-draft\">Best fit: an organization with a funder that requires periodic evidence or reporting.</p></div><div><span class=\"fig\">Fig 3.1. Pilot timeline</span><ol class=\"tl pad-l\"><li data-w=\"Weeks 1-2\"><b>Validation</b><span>We test the approach on a sample of your files.</span></li><li data-w=\"Weeks 3-4\"><b>Discovery</b><span>Map programs, data sources and your reporting process.</span></li><li data-w=\"Weeks 4-6\"><b>Data preparation</b><span>Dictionaries and a first theory of change for you to confirm.</span></li><li data-w=\"Weeks 6-9\"><b>Build</b><span>The workspace: ingestion, organization, triangulation, evidence tracing.</span></li><li data-w=\"Weeks 9-11\"><b>Real-task testing</b><span>Time to answer, accuracy, and whether your team keeps using it.</span></li><li data-w=\"Weeks 11-13\"><b>Commercial review</b><span>Willingness to pay, and whether a funder would sponsor access.</span></li></ol></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Apply</h2><p class=\"lede\" style=\"margin-top:16px\">Tell us about your organization. We read every application and reply with next steps.</p></div><form class=\"form\" id=\"pilotForm\" novalidate><label>Organization<input name=\"organization\" type=\"text\" required placeholder=\"Name of your organization\"></label><label>Email<input name=\"email\" type=\"email\" required placeholder=\"you@organization.org\"></label><label>Years of data available<select name=\"years\"><option>1 to 2 years</option><option>3 to 5 years</option><option>More than 5 years</option></select></label><label>Do you report to a funder?<select name=\"funder\"><option>Yes, regularly</option><option>Occasionally</option><option>No</option></select></label><label>What question would you most like answered?<textarea name=\"question\" rows=\"3\" placeholder=\"For example: why did outcomes change between years?\"></textarea></label><label class=\"check-l\"><input type=\"checkbox\" name=\"consent\" required> I agree that D3S Intelligence stores these details to reply to my application.</label><input type=\"text\" name=\"website\" class=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\"><button type=\"submit\" class=\"btn btn-brand\" id=\"pilotBtn\">Send application</button><div class=\"ok\" id=\"pilotOk\" role=\"status\"></div></form></div></section></div><div class=\"view\" data-view=\"network\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>A Global South network that already works.</h1><p class=\"lede\">GSW-STEM connects women in technology across seven countries. Launched in 2026 by the founder of D3S Consultoria, it is now building new links in China.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"N1\" role=\"img\" aria-label=\"GSW-STEM network meeting\"><span class=\"slot\">N1</span><figcaption>GSW-STEM network meeting</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><span class=\"fig\">Launched in 2026</span><h2>Global South Women in STEM (GSW-STEM)</h2><p class=\"lede\" style=\"margin-top:16px\">A network of institutions and individuals working in and around technology: engineers, scientists, researchers, designers, entrepreneurs, educators and policymakers. It is a social enterprise network, where each member keeps her own organization and shares expertise, contacts and credibility.</p><div class=\"chips2\"><span class=\"chip2\">Brazil</span><span class=\"chip2\">Mexico</span><span class=\"chip2\">Uganda</span><span class=\"chip2\">Cameroon</span><span class=\"chip2\">South Africa</span><span class=\"chip2\">India</span><span class=\"chip2\">Ethiopia</span></div><div class=\"links\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Join%20GSW-STEM\">Join the network</a><a class=\"btn btn-line\" href=\"#\" id=\"manifesto\">Read the founding manifesto</a></div></div><div><span class=\"fig\">Fig 4.1. The network today</span><svg class=\"net\" viewBox=\"0 0 440 340\" role=\"img\" aria-label=\"GSW-STEM network: Brazil at the center, linked to Mexico, Cameroon, Uganda, Ethiopia, South Africa and India, and a link being built to China\"><g><line x1=\"220\" y1=\"160\" x2=\"220\" y2=\"48\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"354\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"388\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"295\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"145\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"52\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"86\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"/></g><g><circle cx=\"220\" cy=\"48\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"354\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"388\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"295\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"145\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"52\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"86\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/></g><circle cx=\"220\" cy=\"160\" r=\"44\" fill=\"var(--brand)\" opacity=\".16\"/><circle cx=\"220\" cy=\"160\" r=\"28\" fill=\"var(--brand)\"/><text x=\"220\" y=\"218\" text-anchor=\"middle\" class=\"t-strong\">Brazil</text><g text-anchor=\"middle\"><text x=\"220\" y=\"84\">Mexico</text><text x=\"354\" y=\"126\">Cameroon</text><text x=\"388\" y=\"221\">Uganda</text><text x=\"295\" y=\"297\">Ethiopia</text><text x=\"145\" y=\"297\">South Africa</text><text x=\"52\" y=\"221\">India</text><text x=\"86\" y=\"126\">China</text><text x=\"86\" y=\"140\" style=\"font-size:11px\">building</text></g></svg></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>What we believe</h2><p class=\"lede\">From the founding manifesto.</p></div><div class=\"svc\"><div><h3>Women as leaders</h3><p>Many women in the Global South are already trained and leading. We exist to put them where technological futures are decided.</p></div><div><h3>Shared problems</h3><p>A problem in Ethiopia may be the same one in Brazil or India. Connecting across borders, we build solutions and seek funding together.</p></div><div><h3>STEM beyond code</h3><p>Technology applied to agriculture, energy, health, biotechnology and business, not only programming and AI.</p></div><div><h3>Impact in real communities</h3><p>Every project names the community it serves and explains how it will reach them.</p></div><div><h3>Knowledge belongs to the Global South</h3><p>Projects leave public-domain knowledge that any organization can adapt and reuse.</p></div><div><h3>Sustainability and reciprocity</h3><p>The network earns, reinvests and grows, so it can pay its contributors and fund education for other women.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>How we start</h2><p class=\"lede\" style=\"margin-top:16px\">We begin small and practical, and build through action.</p></div><ul class=\"check\" style=\"margin-top:0\"><li><b>Support funding applications.</b> We help members and trusted people outside the network prepare grant, startup and fellowship proposals.</li><li><b>Make our work visible.</b> We publish members' work, results and projects.</li><li><b>Run events.</b> Meetings and events that bring members and partners together.</li><li><b>Build partnerships</b> with universities, ministries and companies that offer funding, scholarships and training.</li></ul></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Events and delegations</h2><p class=\"lede\">Where the network meets, and where we build the next link.</p></div><div class=\"evts\"><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F4\" role=\"img\" aria-label=\"Network meeting\"><span class=\"slot\">F4</span><figcaption>Network meeting</figcaption></figure><div><h3>2nd meeting of the Global South Women in STEM Network</h3><p>A space for collaboration, leadership and collective action across regions.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delegation to China\"><span class=\"slot\">F5</span><figcaption>Delegation to China</figcaption></figure><div><h3>Building links in China</h3><p>Building a network to foster technology cooperation.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E2\" role=\"img\" aria-label=\"BRICS Young Innovators\"><span class=\"slot\">E2</span><figcaption>BRICS Young Innovators</figcaption></figure><div><h3>BRICS Young Innovators</h3><p>Recognition of D3S Consultoria's work as an innovation led from the Global South.</p></div></article></div></div></section><section class=\"draft sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Members and companies</h2><p class=\"lede\">Women researchers and engineers, and women-led companies, working across borders.</p></div><div class=\"members m3\"><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N1\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N2\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N3\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N4\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N5\">Photo</span><b>Name</b><small>Role, country</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Portrait placeholder N6\">Photo</span><b>Name</b><small>Role, country</small></div></div><div class=\"logos\" style=\"margin-top:32px\"><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L1\"><span class=\"slot\">L1</span>Company name<small>Country, sector</small></div><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L2\"><span class=\"slot\">L2</span>Company name<small>Country, sector</small></div><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L3\"><span class=\"slot\">L3</span>Company name<small>Country, sector</small></div><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L4\"><span class=\"slot\">L4</span>Company name<small>Country, sector</small></div><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L5\"><span class=\"slot\">L5</span>Company name<small>Country, sector</small></div><div class=\"logo-slot\" role=\"img\" aria-label=\"Company logo placeholder L6\"><span class=\"slot\">L6</span>Company name<small>Country, sector</small></div></div><div class=\"links\"><a class=\"btn btn-line\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Join%20the%20women-led%20company%20network\">Add your company</a></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Build with the network</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Partnership%20with%20GSW-STEM\">Get in touch</a></div></div></section></div></main><footer><div class=\"wrap foot\"><div><div class=\"chip\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><span><b>D3S</b> Intelligence</span></div><div>Social technology, built from the field.</div></div><div><h4>D3S Intelligence</h4><ul><li><a href=\"#/products\">Impact Intelligence</a></li><li><a href=\"#/products\">NeuroAnchor</a></li><li><a href=\"#/method\">Method</a></li><li><a href=\"#/pilot\">Pilot</a></li></ul></div><div><h4>Ecosystem</h4><ul><li><a href=\"#/expertise\">D3S Consultoria</a></li><li><a href=\"#/network\">GSW-STEM</a></li><li><a href=\"#/about\">About</a></li></ul></div><div><h4>Contact</h4><ul><li><a href=\"mailto:contato@d3sconsultoria.com.br\">contato@d3sconsultoria.com.br</a></li><li><a href=\"https://www.instagram.com/d3sconsultoria/\" rel=\"noopener\">Instagram</a></li><li>&copy; 2026 D3S</li></ul></div></div></footer>", "pt": "<header class=\"site-header\"><div class=\"wrap nav\"><a class=\"brand\" href=\"#/pt/\" aria-label=\"D3S Intelligence, in\u00edcio\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><div><b>D3S</b> <span>Intelligence</span></div></a><button class=\"menu-btn\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"navLinks\">Menu</button><nav class=\"nav-links\" id=\"navLinks\" aria-label=\"Principal\"><a href=\"#/pt/products\" data-route=\"products\">Produtos</a><a href=\"#/pt/expertise\" data-route=\"expertise\">Expertise</a><a href=\"#/pt/network\" data-route=\"network\">Rede</a><a href=\"#/pt/about\" data-route=\"about\">Sobre</a><a class=\"lang\" id=\"langSwitch\" href=\"#\" aria-label=\"English version\">EN</a><a href=\"#contact\" data-scroll=\"contact\" class=\"nav-cta\">Fa\u00e7a parceria conosco</a></nav></div></header><main><div class=\"view\" data-view=\"home\"><section class=\"ink hero hero-vision\"><div class=\"wrap\"><h1>Construindo o futuro da tecnologia para o impacto social.</h1><p class=\"lede\">Um neg\u00f3cio social que constr\u00f3i tecnologia para o impacto social, do conhecimento de base \u00e0 alta expertise t\u00e9cnica.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pt/products\">Conhe\u00e7a nossos produtos</a><a href=\"#contact\" class=\"btn btn-ghost\" data-scroll=\"contact\">Fa\u00e7a parceria conosco</a></div></div></section><section class=\"sec\" id=\"vision\"><div class=\"wrap\"><div class=\"s-head\"><h2>Um ecossistema, da base ao mundo</h2><p class=\"lede\">A D3S Intelligence \u00e9 um neg\u00f3cio social que trabalha com a ONG D3S Consultoria e com a rede GSW-STEM. Juntas, formam um desenho institucional internacional de empreendedorismo de impacto social, capaz de construir tecnologia para o impacto social, do conhecimento de base \u00e0 alta expertise t\u00e9cnica.</p></div><span class=\"fig\">Fig 0.1. Como o ecossistema funciona</span><div class=\"flow4\" role=\"group\" aria-label=\"Como o ecossistema funciona\"><div class=\"fnode ground\"><span class=\"fig\">A base</span><h3>Iniciativas de base e problemas sociais</h3><p>Onde o trabalho come\u00e7a</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">A ponte</span><h3>D3S Consultoria</h3><p>ONG, desde 2024</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode key\"><span class=\"fig\">As solu\u00e7\u00f5es</span><h3>D3S Intelligence</h3><p>Neg\u00f3cio social</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">A escala</span><h3>GSW-STEM</h3><p>Rede internacional</p></div></div><div class=\"three explain\"><div><span class=\"fig\">A ponte</span><h3>D3S Consultoria, o elo com a base</h3><p>Uma ONG ativa desde 2024 que trabalha lado a lado com organiza\u00e7\u00f5es de base e institui\u00e7\u00f5es p\u00fablicas no Brasil. Transforma problemas do territ\u00f3rio em diagn\u00f3sticos, pesquisa e forma\u00e7\u00e3o.</p><a class=\"inl\" href=\"#/pt/expertise\">Conhe\u00e7a a expertise</a></div><div><span class=\"fig\">O neg\u00f3cio</span><h3>D3S Intelligence, solu\u00e7\u00f5es inteligentes</h3><p>Um neg\u00f3cio social que oferece solu\u00e7\u00f5es de tecnologia inteligente para esses problemas. Ele se apoia no que o campo e a rede ensinam e reinveste seu lucro na miss\u00e3o.</p><a class=\"inl\" href=\"#/pt/products\">Conhe\u00e7a os produtos</a></div><div><span class=\"fig\">O cen\u00e1rio</span><h3>GSW-STEM, a escala internacional</h3><p>Uma rede de mulheres em tecnologia em sete pa\u00edses: Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia. \u00c9 o cen\u00e1rio internacional em que as solu\u00e7\u00f5es podem escalar.</p><a class=\"inl\" href=\"#/pt/network\">Conhe\u00e7a a rede</a></div></div></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>35.000+</b><span>pessoas alcan\u00e7adas por meio de organiza\u00e7\u00f5es parceiras</span></div><div class=\"stat\"><b>40+</b><span>profissionais formados em dados para impacto social</span></div><div class=\"stat\"><b>2</b><span>reconhecimentos internacionais: Systers Pass It On e BRICS Young Innovators</span></div><div class=\"stat\"><b>7</b><span>pa\u00edses na rede GSW-STEM</span></div></div><p class=\"names\"><b>J\u00e1 atuamos com, no Brasil:</b> Abra\u00e7o Campe\u00e3o (educa\u00e7\u00e3o de jovens, Rio de Janeiro), ELO (inclus\u00e3o de jovens, Curitiba), Engajamundo (justi\u00e7a clim\u00e1tica), Reprograma (mulheres em tecnologia) e outras.</p></div></section><section class=\"sec alt\" id=\"home-products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Produtos constru\u00eddos a partir da experi\u00eancia de campo</h2><p class=\"lede\">Cada um nasce de um problema em que trabalhamos manualmente em campo, e transforma essa pr\u00e1tica em algo repet\u00edvel.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Produto 1</span><div class=\"status pilot\"><i></i>Programa piloto, buscamos parceiras e parceiros</div><h3>Impact Intelligence</h3><p class=\"one\">Um motor de evid\u00eancias de m\u00e9todos mistos para organiza\u00e7\u00f5es do terceiro setor.</p><div class=\"prod-viz mock\"><img class=\"mock-img\" src=\"images/mock-workspace-pt.png\" alt=\"Ambiente do Impact Intelligence, dados ilustrativos\" loading=\"lazy\"></div><ul class=\"facts\"><li><span>Para</span><b>ONGs, institutos, funda\u00e7\u00f5es</b></li><li><span>Insumos</span><b>Planilhas, PDFs, relat\u00f3rios, transcri\u00e7\u00f5es</b></li><li><span>Piloto</span><b>At\u00e9 tr\u00eas organiza\u00e7\u00f5es</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/pt/pilot\">Participe do piloto</a><a class=\"btn btn-line\" href=\"#/pt/method\">Como funciona</a></div></article><article class=\"prod\"><span class=\"fig\">Produto 2</span><div class=\"status\"><i></i>No ar em beta para Android e iOS</div><h3>NeuroAnchor</h3><p class=\"one\">Para trazer voc\u00ea de volta quando o hiperfoco assume.</p><div class=\"prod-viz\"><div class=\"phone\" data-slot=\"NA\" aria-label=\"Telas do NeuroAnchor, ilustrativas\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, agora</small>Faz um tempo. Voc\u00ea bebeu \u00e1gua?</div></div><div class=\"chk\">Como voc\u00ea est\u00e1?</div><div class=\"chk-grid\"><span>Bebi \u00e1gua</span><span>Comi</span><span>Me alonguei</span><span>Falei com algu\u00e9m</span></div><div class=\"chk-note\">Sem press\u00e3o. Agora n\u00e3o tamb\u00e9m vale.</div></div></div><ul class=\"facts\"><li><span>Para</span><b>Pessoas neurodivergentes e ansiosas</b></li><li><span>Privacidade</span><b>No pr\u00f3prio aparelho por padr\u00e3o, sem an\u00fancios</b></li><li><span>Planos</span><b>Free, Premium, Pro, Business</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta\">Entre no beta</a><a class=\"btn btn-line\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20para%20empresas\">Para empresas</a></div></article></div><div class=\"pipe\"><h3>Em pesquisa</h3><div class=\"pipe-grid\"><div><span class=\"when\">Em desenvolvimento</span><b>Camada de presta\u00e7\u00e3o de contas</b><p>Registro \u00e0 prova de adultera\u00e7\u00e3o do retorno das comunidades, para que financiadores e ONGs possam mostrar que ouviram.</p></div><div><span class=\"when\">Em desenvolvimento</span><b>An\u00e1lise de narrativas de campo</b><p>An\u00e1lise qualitativa que parte do trabalho de campo real, n\u00e3o de um upload frio.</p></div><div><span class=\"when\">Em desenvolvimento</span><b>Ferramentas de dados para baixa conectividade</b><p>Coleta e sincroniza\u00e7\u00e3o de dados que nunca pressup\u00f5em uma conex\u00e3o ativa com a internet.</p></div></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>O que sustenta os produtos</h2><p class=\"lede\">Expertise constru\u00edda em campo, reputa\u00e7\u00e3o reconhecida no exterior e uma rede que j\u00e1 cruza fronteiras.</p></div><div class=\"trio\"><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Trabalho de campo em uma favela do Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Trabalho de campo em uma favela do Rio de Janeiro</figcaption></figure><span class=\"fig\">Expertise</span><h3>Constru\u00edda em campo</h3><ul class=\"plain\"><li>Diagn\u00f3sticos comunit\u00e1rios com ONGs no Brasil, inclusive em favelas do Rio de Janeiro</li><li>Pesquisa qualitativa dirigida por uma antrop\u00f3loga social</li><li>Experi\u00eancia da equipe dentro dos governos de S\u00e3o Paulo, a maior cidade e o maior estado do pa\u00eds</li></ul><a class=\"inl\" href=\"#/pt/expertise\">Conhe\u00e7a a expertise</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Evento de premia\u00e7\u00e3o, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Evento de premia\u00e7\u00e3o, Systers Pass It On</figcaption></figure><span class=\"fig\">Reputa\u00e7\u00e3o</span><h3>Reconhecimento no exterior</h3><ul class=\"plain\"><li>Systers Pass It On Award 2024, da AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o</li><li>Reconhecimento BRICS Young Innovators</li><li>A fundadora integra o Grupo de Trabalho Interministerial de Indicadores de S\u00e3o Paulo, a maior cidade do Brasil</li></ul><a class=\"inl\" href=\"#/pt/about\">Conhe\u00e7a nossa hist\u00f3ria</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delega\u00e7\u00e3o \u00e0 China\"><span class=\"slot\">F5</span><figcaption>Delega\u00e7\u00e3o \u00e0 China</figcaption></figure><span class=\"fig\">Alcance</span><h3>Uma rede que cruza fronteiras</h3><ul class=\"plain\"><li>GSW-STEM: Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia</li><li>Encontros realizados entre regi\u00f5es</li><li>Agora construindo novos la\u00e7os na China</li></ul><a class=\"inl\" href=\"#/pt/network\">Conhe\u00e7a a rede</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>O lucro volta para a miss\u00e3o</h2><p class=\"lede\" style=\"margin-top:16px\">A D3S Intelligence reinveste seu lucro na pesquisa e na forma\u00e7\u00e3o da D3S Consultoria e na rede GSW-STEM, para que a expertise por tr\u00e1s dos produtos continue crescendo.</p></div><div class=\"links\" style=\"margin-top:0\"><a class=\"btn btn-line\" href=\"#/pt/about\">Veja como \u00e9 financiado</a></div></div></section><section class=\"ink contact\" id=\"contact\"><div class=\"wrap\"><h2>Fa\u00e7a parceria conosco</h2><div class=\"paths\"><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Financiadores%20e%20funda%C3%A7%C3%B5es\"><b>Financiadores e funda\u00e7\u00f5es</b><span>Financie pesquisa ou patrocine o acesso \u00e0s nossas ferramentas para as organiza\u00e7\u00f5es que voc\u00ea apoia.</span><em>Inicie uma conversa</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Governos%20e%20prefeituras\"><b>Governos e prefeituras</b><span>Evid\u00eancias, indicadores e ferramentas de mapeamento de risco para pol\u00edticas p\u00fablicas.</span><em>Fale conosco</em></a><a href=\"#/pt/pilot\"><b>ONGs e institutos</b><span>Participe do piloto do Impact Intelligence com seus pr\u00f3prios dados.</span><em>Inscreva-se no piloto</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Empresas%20e%20parceiros\"><b>Empresas e parceiros</b><span>Bem-estar, ESG e mensura\u00e7\u00e3o de impacto, e parcerias no Sul Global.</span><em>Fa\u00e7a parceria conosco</em></a></div></div></section></div><div class=\"view\" data-view=\"about\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Dois anos de trabalho, e o que vem a seguir.</h1><p class=\"lede\">A D3S Consultoria nasceu em 2024 como uma ONG volunt\u00e1ria para ajudar organiza\u00e7\u00f5es a usar bem os dados. Hoje a D3S Intelligence, um neg\u00f3cio social e think tank, re\u00fane essa expertise com a rede GSW-STEM e um conjunto de produtos.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Evento de premia\u00e7\u00e3o, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Evento de premia\u00e7\u00e3o, Systers Pass It On</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Nossa hist\u00f3ria</h2><p class=\"lede\" style=\"margin-top:16px\">A maior parte de cientistas de dados n\u00e3o trabalha com causas sociais, porque o investimento flui para outros lugares. Criamos a D3S Consultoria para mudar isso, liderada e conduzida inteiramente por mulheres, pessoas trans e n\u00e3o bin\u00e1rias.</p><p class=\"note-draft draft\">Datas marcadas com \"a confirmar\" precisam ser conferidas nos seus registros.</p></div><ol class=\"tl2\"><li><small class=\"when\">2024</small><b>A D3S Consultoria nasce como uma ONG volunt\u00e1ria</b><span>Dados qualificados para ONGs, e espa\u00e7o para mulheres, pessoas trans e n\u00e3o bin\u00e1rias em dados e tecnologia.</span></li><li><small class=\"when\">2024</small><b>Primeiro ciclo de consultoria</b><span>Cinco organiza\u00e7\u00f5es selecionadas, com mais de 40 dias de trabalho para produzir um produto anal\u00edtico complexo.</span></li><li><small class=\"when\">Agosto de 2024</small><b>Primeiro produto anal\u00edtico entregue</b><span>Apresentado presencialmente ao Abra\u00e7o Campe\u00e3o, organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o, um dos maiores conjuntos de favelas do Rio de Janeiro.</span></li><li><small class=\"when\">Agosto de 2024</small><b>Systers Pass It On Award</b><span>Uma das vencedoras, reconhecida pela AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o, por construir comunidade para mulheres em STEM.</span></li><li><b>BRICS Young Innovators</b><span>Reconhecida como uma inova\u00e7\u00e3o liderada a partir do Sul Global.</span></li><li><b>Ciclos de forma\u00e7\u00e3o e programa de voluntariado</b><span>Quatro ciclos de forma\u00e7\u00e3o para profissionais de ONGs, e um programa de voluntariado com editais duas vezes por ano.</span></li><li><small class=\"when\">2026</small><b>GSW-STEM \u00e9 lan\u00e7ada</b><span>Uma rede de mulheres em tecnologia no Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia, lan\u00e7ada pela fundadora da D3S Consultoria.</span></li><li><b>Construindo la\u00e7os na China</b><span>Delega\u00e7\u00e3o para construir uma rede que fomente a coopera\u00e7\u00e3o em tecnologia.</span></li><li><small class=\"when\">2026</small><b>A D3S Intelligence \u00e9 lan\u00e7ada</b><span>Um neg\u00f3cio social e think tank. Seus produtos se apoiam na expertise da ONG, e seu lucro financia a miss\u00e3o.</span></li></ol></div></section><section class=\"sec alt\" id=\"people\"><div class=\"wrap\"><div class=\"s-head\"><h2>Nossa equipe</h2><p class=\"lede\">Uma pequena equipe de lideran\u00e7a, uma comunidade de volunt\u00e1rias e volunt\u00e1rios, e uma rede internacional. Tudo liderado e conduzido por mulheres, pessoas trans e n\u00e3o bin\u00e1rias.</p></div><span class=\"fig\">Fig 5.1. Pessoas no ecossistema</span><svg class=\"org\" viewBox=\"0 0 760 250\" role=\"img\" aria-label=\"Organograma: CEO, duas diretoras, programa de voluntariado, rede internacional e empresas lideradas por mulheres\"><g stroke=\"var(--muted)\" stroke-width=\"1.5\" fill=\"none\"><path d=\"M380 52 V69 M230 69 H530 M230 69 V86 M530 69 V86\"/><path d=\"M230 130 V147 H530 V130 M380 147 V164\"/></g><g stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\" fill=\"none\"><path d=\"M200 186 H280 M480 186 H560\"/></g><g class=\"obox\"><rect x=\"280\" y=\"8\" width=\"200\" height=\"44\" rx=\"6\" class=\"key\"/><rect x=\"130\" y=\"86\" width=\"200\" height=\"44\" rx=\"6\"/><rect x=\"430\" y=\"86\" width=\"200\" height=\"44\" rx=\"6\"/><rect x=\"280\" y=\"164\" width=\"200\" height=\"44\" rx=\"
