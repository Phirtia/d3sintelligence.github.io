contas financeira de uma lei municipal de incentivo fiscal. Trabalha todos os dias dentro do mecanismo pelo qual os recursos p\u00fablicos s\u00e3o alocados, monitorados e prestados, e j\u00e1 integrou comiss\u00f5es de avalia\u00e7\u00e3o de editais p\u00fablicos de cultura. Isso nos d\u00e1 uma vis\u00e3o direta de como financiadores p\u00fablicos avaliam e financiam o trabalho da sociedade civil. Cientista social pela USP, lidera parcerias, desenho de projetos e capta\u00e7\u00e3o de recursos na D3S.</p></div></article><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T3\" role=\"img\" aria-label=\"Amanda Raquel\">AR</span><div class=\"lead-b\"><h3>Amanda Raquel</h3><p class=\"role\">Diretora de Pesquisa Qualitativa</p><p class=\"bio\">Antrop\u00f3loga social com doutorado, pr\u00eamio de melhor tese e mais de dez anos de pesquisa etnogr\u00e1fica e aplicada sobre ra\u00e7a, g\u00eanero, sexualidade, sa\u00fade e envelhecimento. Sua autoridade vem do campo: seis anos como agente comunit\u00e1ria de sa\u00fade na aten\u00e7\u00e3o prim\u00e1ria p\u00fablica, trabalho de campo com comunidades ind\u00edgenas e quilombolas e longa participa\u00e7\u00e3o em coletivos e movimentos de mulheres negras. \u00c9 pesquisadora visitante no INAH-UNAM, no M\u00e9xico, e fellow da ALARI, de Harvard. \u00c9 por causa dela que nossas ferramentas leem a experi\u00eancia vivida como uma pesquisadora treinada, e n\u00e3o como texto a ser resumido.</p></div></article></div><span class=\"fig\" style=\"margin-top:56px\">Como nos organizamos</span><div class=\"board\"><article class=\"org int\"><span class=\"kind\">Neg\u00f3cio social</span><h3>D3S Intelligence</h3><p class=\"d\">Constr\u00f3i e vende os produtos e reinveste seu lucro na miss\u00e3o.</p><ul class=\"rail\"><li><b>CEO</b></li><li class=\"sub\"><b>Diretoria de Parcerias</b></li><li class=\"sub\"><b>Diretoria de Pesquisa Qualitativa</b></li><li class=\"sub\"><b>Diretoria de Pesquisa Quantitativa</b></li><li class=\"sub\"><b>Lideran\u00e7a de Tecnologia</b></li></ul></article><article class=\"org ngo\"><span class=\"kind\">ONG</span><h3>D3S Consultoria</h3><p class=\"d\">Pesquisa, forma\u00e7\u00e3o e programas com a sociedade civil.</p><ul class=\"rail\"><li><b>Presid\u00eancia</b></li><li><b>Diretoria</b></li><li><b>Volunt\u00e1rias e volunt\u00e1rios</b><small>Cerca de 20 colaboradoras e colaboradores entre a diretoria e o programa de empoderamento cient\u00edfico.</small></li></ul></article><article class=\"org gsw\"><span class=\"kind\">Internacional</span><h3>Internacional</h3><p class=\"d\">Iniciativas que levam a nossa abordagem al\u00e9m das fronteiras.</p><ul class=\"rail\"><li><b>GSW-STEM</b><small>Principal iniciativa hoje: mulheres fundadoras e integrantes em sete pa\u00edses.</small></li><li><b>Iniciativas futuras</b><small>Constru\u00eddas sobre a mesma plataforma, m\u00e9todo e padr\u00f5es.</small></li></ul></article></div></div></section><section class=\"sec alt\" id=\"story\"><div class=\"wrap\"><div class=\"s-head\"><h2>Nossa hist\u00f3ria</h2></div><div class=\"htl\" id=\"htl\" tabindex=\"0\" aria-label=\"Linha do tempo. Role para o lado.\"><ol class=\"htl-track\"><li class=\"htl-item\"><small class=\"when\">2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>A D3S Consultoria nasce como uma ONG volunt\u00e1ria</b><span class=\"dsc\">Dados qualificados para ONGs, e espa\u00e7o para mulheres, pessoas trans e n\u00e3o bin\u00e1rias em dados e tecnologia.</span></li><li class=\"htl-item\"><small class=\"when\">2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>Primeiro ciclo de consultoria</b><span class=\"dsc\">Cinco organiza\u00e7\u00f5es selecionadas, com mais de 40 dias de trabalho para produzir um produto anal\u00edtico complexo.</span></li><li class=\"htl-item\"><small class=\"when\">Agosto de 2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>Primeiro produto anal\u00edtico entregue</b><span class=\"dsc\">Apresentado presencialmente ao Abra\u00e7o Campe\u00e3o, organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o, um dos maiores conjuntos de favelas do Rio de Janeiro.</span></li><li class=\"htl-item\"><small class=\"when\">Agosto de 2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>Systers Pass It On Award</b><span class=\"dsc\">Uma das vencedoras, reconhecida pela AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o, por construir comunidade para mulheres em STEM.</span></li><li class=\"htl-item\"><small class=\"when\">2025</small><span class=\"itag ngo\">D3S Consultoria</span><b>BRICS Young Innovators</b><span class=\"dsc\">A fundadora \u00e9 reconhecida como BRICS Young Innovator.</span></li><li class=\"htl-item\"><span class=\"itag ngo\">D3S Consultoria</span><b>Ciclos de forma\u00e7\u00e3o e programa de voluntariado</b><span class=\"dsc\">Quatro ciclos de forma\u00e7\u00e3o para profissionais de ONGs, e um programa de voluntariado com editais duas vezes por ano.</span></li><li class=\"htl-item\"><small class=\"when\">2026</small><span class=\"itag gsw\">GSW-STEM</span><b>GSW-STEM \u00e9 lan\u00e7ada</b><span class=\"dsc\">Uma rede de mulheres em tecnologia no Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia, lan\u00e7ada pela fundadora da D3S Consultoria.</span></li><li class=\"htl-item\"><span class=\"itag gsw\">GSW-STEM</span><b>Construindo la\u00e7os na China</b><span class=\"dsc\">Delega\u00e7\u00e3o para construir uma rede que fomente a coopera\u00e7\u00e3o em tecnologia.</span></li><li class=\"htl-item\"><small class=\"when\">2026</small><span class=\"itag int\">D3S Intelligence</span><b>A D3S Intelligence \u00e9 lan\u00e7ada</b><span class=\"dsc\">Um neg\u00f3cio social e think tank. Seus produtos se apoiam na expertise da ONG, e seu lucro financia a miss\u00e3o.</span></li></ol></div><div class=\"htl-nav\"><button type=\"button\" data-htl=\"-1\" aria-label=\"Anterior\"><svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" aria-hidden=\"true\"><path d=\"M14 6H2M7 1L2 6l5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button><button type=\"button\" data-htl=\"1\" aria-label=\"Pr\u00f3ximo\"><svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" aria-hidden=\"true\"><path d=\"M2 6h12M9 1l5 5-5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como \u00e9 financiado</h2><p class=\"lede\">O neg\u00f3cio social gera receita. A miss\u00e3o a investe.</p></div><div class=\"flow\"><div class=\"blk\"><span class=\"fig\">O que vendemos</span><h3>Produtos e servi\u00e7os</h3><ul class=\"plain\"><li>GroundCommons, ferramentas de dados para organiza\u00e7\u00f5es de base</li><li>NeuroAnchor, tecnologia de bem-estar</li><li>Consultoria anal\u00edtica</li></ul></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk key\"><span class=\"fig\">O que fazemos com isso</span><h3>Reinvestir na miss\u00e3o</h3><p>O lucro volta para pesquisa, forma\u00e7\u00e3o e a rede.</p><p class=\"ph pledge draft\">Parcela reinvestida e relat\u00f3rio anual: a definir pela D3S Intelligence.</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk\"><span class=\"fig\">O que isso financia</span><h3>Pesquisa, forma\u00e7\u00e3o e rede</h3><ul class=\"plain\"><li>Apoio anal\u00edtico a ONGs, pela D3S Consultoria</li><li>Forma\u00e7\u00e3o e programa de voluntariado em dados e tecnologia</li><li>Parcerias internacionais, pela GSW-STEM</li></ul></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>O que nos move</h2><p class=\"lede\">O estatuto da D3S Consultoria define doze objetivos. Estes s\u00e3o os quatro temas que eles compartilham.</p></div><div class=\"four mission\"><div><h3>Evid\u00eancias</h3><ul class=\"plain\"><li>Pesquisa anal\u00edtica, de impacto e aplicada para organiza\u00e7\u00f5es alinhadas ao desenvolvimento social</li><li>Modelos e indicadores para prevenir viol\u00eancias e proteger direitos</li></ul></div><div><h3>Programas e pol\u00edticas</h3><ul class=\"plain\"><li>Aprimorar programas de desenvolvimento social com ONGs brasileiras e internacionais</li><li>Aprimorar pol\u00edticas p\u00fablicas que protegem pessoas vulnerabilizadas e minorias</li><li>Reduzir desigualdades, proteger crian\u00e7as, avan\u00e7ar a justi\u00e7a de g\u00eanero e racial</li></ul></div><div><h3>Tecnologia e inclus\u00e3o</h3><ul class=\"plain\"><li>Mais acesso a conhecimento e tecnologia</li><li>Programas de tecnologia para o desenvolvimento socioecon\u00f4mico</li><li>Incluir mais mulheres em STEM</li></ul></div><div><h3>Forma\u00e7\u00e3o, voz e financiamento</h3><ul class=\"plain\"><li>Formar pessoas que atuam com impacto social</li><li>Debate p\u00fablico e advocacy para incluir o terceiro setor na tecnologia</li><li>Captar recursos para reinvestir em desenvolvimento social e tecnol\u00f3gico</li></ul></div></div></div></section></div><div class=\"view\" data-view=\"method\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Tecnologia para o impacto social, constru\u00edda por dentro.</h1><p class=\"lede\">N\u00e3o estudamos problemas sociais de longe. Nossa equipe trabalha com as pessoas que os vivem e constr\u00f3i as ferramentas que melhoram a vida delas e fortalecem as institui\u00e7\u00f5es que as protegem e promovem seu desenvolvimento.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"M1\" role=\"img\" aria-label=\"Nossa equipe trabalhando em campo\"><span class=\"slot\">M1</span><figcaption>Nossa equipe trabalhando em campo</figcaption></figure></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>5</b><span>organiza\u00e7\u00f5es no primeiro ciclo de consultoria, com mais de 40 dias de trabalho</span></div><div class=\"stat\"><b>40+</b><span>profissionais formados em quatro ciclos</span></div><div class=\"stat\"><b>35.000+</b><span>pessoas alcan\u00e7adas por meio de organiza\u00e7\u00f5es parceiras</span></div><div class=\"stat\"><b>2 anos</b><span>de trabalho com a sociedade civil, desde 2024</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Vivemos o problema, ent\u00e3o constru\u00edmos para ele.</h2></div><div><p class=\"lede\">A maioria das ferramentas para problemas sociais \u00e9 desenhada longe das pessoas que deveriam atender. No papel parecem certas e, no dia a dia, falham.</p><p class=\"lede\" style=\"margin-top:16px\">Come\u00e7amos onde o problema vive. Nossa equipe j\u00e1 trabalhou diretamente com comunidades, com pessoas em situa\u00e7\u00e3o de vulnerabilidade e com as institui\u00e7\u00f5es que deveriam proteg\u00ea-las. Toda ferramenta que constru\u00edmos carrega essa experi\u00eancia.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Onde nossa equipe j\u00e1 atuou, por dentro</h2></div><div class=\"four places\"><div><h3>Favelas e periferias urbanas</h3><p>Diagn\u00f3sticos comunit\u00e1rios, pesquisa territorial e trabalho di\u00e1rio com fam\u00edlias, no Rio de Janeiro, em Natal e em S\u00e3o Paulo.</p></div><div><h3>Comunidades ind\u00edgenas e quilombolas</h3><p>Trabalho de campo sobre territ\u00f3rio e identidade, e pesquisa sobre como a educa\u00e7\u00e3o p\u00fablica chega a essas comunidades.</p></div><div><h3>Direitos e prote\u00e7\u00e3o p\u00fablica</h3><p>Trabalho de campo em servi\u00e7os p\u00fablicos com v\u00edtimas de viola\u00e7\u00f5es de direitos, um artigo de pesquisa sobre um modelo preditivo para prevenir a viol\u00eancia contra a mulher e pesquisa sobre o sistema prisional.</p></div><div><h3>Migrantes e refugiados</h3><p>Pesquisa etnogr\u00e1fica sobre a chegada de refugiados e atividades com imigrantes e refugiados.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Dois tipos de ferramenta, uma abordagem</h2><p class=\"lede\">Tudo o que constru\u00edmos melhora a vida das pessoas diretamente ou fortalece as institui\u00e7\u00f5es que as protegem e promovem seu desenvolvimento.</p></div><div class=\"board two2\"><article class=\"org ngo\"><span class=\"kind\">Para pessoas</span><h3>NeuroAnchor</h3><p class=\"d\">Nascido da experi\u00eancia vivida. Um companheiro que ajuda as pessoas a viver bem com hiperfoco, ansiedade e neurodiverg\u00eancia.</p><a class=\"inl\" href=\"#/pt/neuroanchor\">Conhe\u00e7a o NeuroAnchor</a></article><article class=\"org int\"><span class=\"kind\">Para institui\u00e7\u00f5es</span><h3>GroundCommons</h3><p class=\"d\">Uma plataforma gratuita que ajuda organiza\u00e7\u00f5es de base a organizar os dados que j\u00e1 t\u00eam, para que o trabalho de prote\u00e7\u00e3o e desenvolvimento delas seja visto e fortalecido.</p><a class=\"inl\" href=\"#/pt/groundcommons\">Conhe\u00e7a o GroundCommons</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Um m\u00e9todo, feito para se repetir</h2></div><div class=\"four\"><div><span class=\"stepn\">Passo 1</span><h3>Viver e escutar</h3><p>Trabalho de campo, entrevistas e rotina ao lado das pessoas que enfrentam o problema.</p></div><div><span class=\"stepn\">Passo 2</span><h3>Construir com as pessoas</h3><p>As ferramentas s\u00e3o desenhadas e testadas com elas, n\u00e3o entregues a elas.</p></div><div><span class=\"stepn\">Passo 3</span><h3>Fortalecer as institui\u00e7\u00f5es</h3><p>Forma\u00e7\u00e3o, um programa de voluntariado e parcerias, para que institui\u00e7\u00f5es de prote\u00e7\u00e3o e desenvolvimento possam levar o trabalho adiante.</p></div><div><span class=\"stepn\">Passo 4</span><h3>Escalar al\u00e9m das fronteiras</h3><p>Por meio de iniciativas internacionais lideradas por parceiros locais, come\u00e7ando pela GSW-STEM.</p></div></div><p style=\"margin-top:22px\"><a class=\"inl\" href=\"#/pt/international\">Conhe\u00e7a a atua\u00e7\u00e3o internacional</a></p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Programas que nos mant\u00eam no territ\u00f3rio</h2><p class=\"lede\">Programas da nossa ONG, a D3S Consultoria. Cada um tamb\u00e9m \u00e9 onde as nossas ferramentas aprendem.</p></div><div class=\"progs\"><article class=\"prog\"><div><span class=\"fig\">Programa 1</span><h3>Diagn\u00f3stico comunit\u00e1rio com organiza\u00e7\u00f5es</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F1\" role=\"img\" aria-label=\"Entrega a uma organiza\u00e7\u00e3o de jovens no Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Entrega a uma organiza\u00e7\u00e3o de jovens no Rio de Janeiro</figcaption></figure></div><div><p>Trabalhamos com cada organiza\u00e7\u00e3o para entender a sua comunidade por dentro e produzir um diagn\u00f3stico que ela possa usar com financiadores e parceiros.</p><ul class=\"facts\"><li><span>Diagn\u00f3sticos</span><b>Territorial e de impacto</b></li><li><span>Apoio</span><b>Tratamento de dados, an\u00e1lise, m\u00e9todos</b></li><li><span>Primeiro ciclo</span><b>Cinco organiza\u00e7\u00f5es</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Programa 2</span><h3>Forma\u00e7\u00e3o para profissionais de ONGs</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F6\" role=\"img\" aria-label=\"Sess\u00e3o de forma\u00e7\u00e3o para profissionais de ONGs\"><span class=\"slot\">F6</span><figcaption>Sess\u00e3o de forma\u00e7\u00e3o para profissionais de ONGs</figcaption></figure></div><div><p>Quatro ciclos de forma\u00e7\u00e3o com profissionais de organiza\u00e7\u00f5es n\u00e3o governamentais.</p><ul class=\"facts\"><li><span>Temas dos ciclos</span><b>Instrumentos de diagn\u00f3stico territorial</b></li><li><span></span><b>Dados quantitativos e qualitativos para mensurar impacto</b></li><li><span></span><b>Dados para decis\u00f5es estrat\u00e9gicas</b></li><li><span></span><b>Monitoramento e avalia\u00e7\u00e3o de programas</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Programa 3</span><h3>Programa socioeducativo de voluntariado</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F3\" role=\"img\" aria-label=\"Projeto de voluntariado\"><span class=\"slot\">F3</span><figcaption>Projeto de voluntariado</figcaption></figure></div><div><p>Empoderamento t\u00e9cnico e cient\u00edfico para mulheres, pessoas trans e n\u00e3o bin\u00e1rias profissionais de dados e tecnologia, por meio de trabalho em projetos reais.</p><ul class=\"facts\"><li><span>Voc\u00ea recebe</span><b>Certificados, forma\u00e7\u00e3o, networking</b></li><li><span>Na pr\u00e1tica</span><b>Atua\u00e7\u00e3o em projetos da D3S Consultoria</b></li><li><span>Editais</span><b>Duas vezes por ano, pr\u00f3ximo edital em breve</b></li></ul></div></article></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Algumas organiza\u00e7\u00f5es com que atuamos</h2><p class=\"lede\">As descri\u00e7\u00f5es s\u00e3o do trabalho das pr\u00f3prias organiza\u00e7\u00f5es, como aparecem no site da D3S Consultoria.</p></div><div class=\"partners\"><div><h3>Abra\u00e7o Campe\u00e3o</h3><p>Organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o, um grande conjunto de favelas do Rio de Janeiro. H\u00e1 quase dez anos atua com crian\u00e7as e jovens por meio de artes marciais, educa\u00e7\u00e3o e desenvolvimento pessoal. A D3S Consultoria entregou an\u00e1lises de perfil, territorial e de segmenta\u00e7\u00e3o de alunos.</p></div><div><h3>ELO Apoio Socioambiental</h3><p>Mais de dez anos de trabalho com jovens em situa\u00e7\u00e3o de vulnerabilidade, em educa\u00e7\u00e3o e inclus\u00e3o produtiva, em Curitiba, no sul do Brasil. Informa ter alcan\u00e7ado mais de 20 mil pessoas.</p></div><div><h3>Engajamundo</h3><p>Organiza\u00e7\u00e3o nacional com onze anos de atua\u00e7\u00e3o e 24 territ\u00f3rios de incid\u00eancia, incluindo o Alto Xingu, na regi\u00e3o amaz\u00f4nica. Sensibiliza jovens brasileiros para a justi\u00e7a clim\u00e1tica e socioambiental.</p></div><div><h3>Reprograma</h3><p>Pioneira em educa\u00e7\u00e3o STEM no Brasil desde 2016, reduz a lacuna de g\u00eanero e ra\u00e7a em tecnologia ao capacitar mulheres em situa\u00e7\u00e3o de vulnerabilidade, sobretudo mulheres negras e trans.</p></div></div><p class=\"note-plain\">Tamb\u00e9m: Instituto Semeia e Abra\u00e7o Cultural.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Nas not\u00edcias</h2></div><ul class=\"init\"><li><h3>D3S Consultoria ganha seu primeiro pr\u00eamio internacional</h3><p>Uma das vencedoras do Systers Pass It On Award 2024, da AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/a-d3s-consultoria-ganha-primeiro-pr%C3%AAmio-internacional\" rel=\"noopener\">15 ago. 2024</a></li><li><h3>D3S Consultoria leva seu primeiro relat\u00f3rio ao Rio de Janeiro</h3><p>O primeiro produto anal\u00edtico, entregue presencialmente a uma organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/d3s-consultoria-vai-at%C3%A9-o-complexo-do-alem%C3%A3o\" rel=\"noopener\">15 ago. 2024</a></li></ul></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Traga um problema que precisa de uma ferramenta</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Consulting\">Fale conosco</a><a class=\"btn btn-ghost\" href=\"#/pt/neuroanchor\">Veja os produtos</a></div></div></section></div><div class=\"view\" data-view=\"neuroanchor\"><section class=\"ink hero hero-product\"><div class=\"wrap hero-split\"><div><label class=\"psel\">Produto<select aria-label=\"Escolha um produto\"><option value=\"neuroanchor\" selected>NeuroAnchor</option><option value=\"teams\">NeuroAnchor para Equipes</option><option value=\"groundcommons\">GroundCommons</option></select></label><div class=\"status\"><i></i>Beta gratuito no Android e iOS. Premium em desenvolvimento.</div><h1>NeuroAnchor</h1><p class=\"tagline\">Para trazer voc\u00ea de volta quando o hiperfoco assume.</p><p class=\"lede\">O hiperfoco \u00e9 um superpoder at\u00e9 voc\u00ea levantar a cabe\u00e7a e o dia ter acabado: sem almo\u00e7o, sem \u00e1gua, sem falar com ningu\u00e9m. O NeuroAnchor \u00e9 a interrup\u00e7\u00e3o gentil feita para mentes com TDAH, autistas e ansiosas. Ele traz voc\u00ea de volta ao seu corpo e \u00e0s pessoas ao redor, sem culpa e sem quebrar o foco que faz de voc\u00ea bom no que faz.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Aparelho%20%28Android%20ou%20iOS%29%3A%0ANome%3A\">Baixe gr\u00e1tis</a><a class=\"btn btn-ghost\" href=\"#/pt/teams\">Para empresas</a></div><p class=\"fnote\">A vers\u00e3o gratuita \u00e9 a vers\u00e3o mais simples do NeuroAnchor.</p></div><div><div class=\"phone\" data-slot=\"NA\" aria-label=\"Telas do NeuroAnchor, ilustrativas\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, agora</small>Faz um tempo. Voc\u00ea bebeu \u00e1gua?</div></div><div class=\"chk\">Como voc\u00ea est\u00e1?</div><div class=\"chk-grid\"><span>Bebi \u00e1gua</span><span>Comi</span><span>Me alonguei</span><span>Falei com algu\u00e9m</span></div><div class=\"chk-note\">Sem press\u00e3o. Agora n\u00e3o tamb\u00e9m vale.</div></div></div></div></section><section class=\"cobar\"><div class=\"wrap cobar-in\"><div><b>Vai levar o NeuroAnchor para uma empresa?</b><span>Assinaturas para equipes de empresas de 10 a 100 pessoas. Leia a justificativa de neg\u00f3cio.</span></div><a class=\"btn btn-brand\" href=\"#/pt/teams\">NeuroAnchor para Equipes</a></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats s3\"><div class=\"stat\"><b>Cerca de 1 em 5</b><span>pessoas \u00e9 neurodivergente.</span></div><div class=\"stat\"><b>~50%</b><span>dos adultos neurodivergentes empregados relatam esgotamento (Willis Towers Watson, 2022).</span></div><div class=\"stat\"><b>0</b><span>an\u00fancios e nenhum dado vendido, nunca. O \u00fanico modelo de neg\u00f3cio s\u00e3o as assinaturas.</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Visto de dentro, n\u00e3o parece um problema.</h2><p class=\"pullq\">Parece perder o jantar, de novo, sem perceber que o dia acabou.</p></div><div><p class=\"lede\">O foco profundo \u00e9 uma for\u00e7a. Para muitas pessoas neurodivergentes e ansiosas, ele tamb\u00e9m tem um custo escondido: as horas passam sem que se perceba, refei\u00e7\u00f5es s\u00e3o puladas, mensagens ficam sem resposta e os sinais do corpo s\u00e3o ignorados.</p><p class=\"lede\" style=\"margin-top:16px\">Com o tempo, isso vira esgotamento e desgaste nas rela\u00e7\u00f5es. Cerca de uma em cada cinco pessoas \u00e9 neurodivergente, ent\u00e3o essa \u00e9 uma realidade di\u00e1ria para milh\u00f5es. A maioria das ferramentas pede que voc\u00ea se lembre de us\u00e1-las. Esta lembra por voc\u00ea, com gentileza.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como funciona</h2></div><span class=\"stag free\">Gr\u00e1tis hoje</span><div class=\"three\"><div><span class=\"stepn\">Passo 1</span><h3>Voc\u00ea define suas janelas</h3><p>Escolha os hor\u00e1rios em que o NeuroAnchor pode falar com voc\u00ea. Fora deles, ele fica em sil\u00eancio.</p></div><div><span class=\"stepn\">Passo 2</span><h3>Chega um lembrete gentil</h3><p>Em um momento inesperado, aparece uma mensagem amig\u00e1vel: \"Faz um tempo. Voc\u00ea bebeu \u00e1gua?\" Sem alarmes, sem culpa.</p></div><div><span class=\"stepn\">Passo 3</span><h3>Voc\u00ea faz o check-in e segue</h3><p>Toque na notifica\u00e7\u00e3o para abrir um check-in simples: bebi \u00e1gua, comi, me alonguei, falei com algu\u00e9m ou agora n\u00e3o. Depois, volte ao que estava fazendo.</p></div></div><span class=\"stag prog\" style=\"margin-top:36px\">Premium, em desenvolvimento</span><div class=\"three\"><div><span class=\"stepn\">Premium 1</span><h3>Conte como voc\u00ea trabalha</h3><p>Um breve Perfil de Foco define o hor\u00e1rio e o tom dos lembretes e os h\u00e1bitos priorit\u00e1rios, para o NeuroAnchor se ajustar a voc\u00ea desde o primeiro dia.</p></div><div><span class=\"stepn\">Premium 2</span><h3>H\u00e1bitos que cabem na sua vida</h3><p>H\u00e1bitos personalizados ilimitados, sequ\u00eancias e um hor\u00e1rio separado para cada h\u00e1bito.</p></div><div><span class=\"stepn\">Premium 3</span><h3>Ele aprende o que ajuda</h3><p>Inicie uma sess\u00e3o de foco (\"me chame daqui a uma hora\") e responda a um r\u00e1pido \"Isso ajudou?\" O NeuroAnchor se ajusta a voc\u00ea.</p></div></div><p class=\"who-note\" style=\"margin-top:20px\">O plano gratuito continua realmente \u00fatil. Os planos pagos acrescentam profundidade e nunca tiram o que j\u00e1 funciona.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Para quem \u00e9</h2></div><div class=\"three\"><div><h3>Pessoas que vivem com hiperfoco</h3><p>Pessoas que lidam com TDAH, autismo ou ansiedade no dia a dia e querem uma ferramenta gentil e pessoal, que elas escolhem e controlam.</p></div><div><h3>Profissionais e aut\u00f4nomos</h3><p>Quem trabalha com conhecimento e desaparece dentro do trabalho, e quer que o b\u00e1sico acompanhe.</p></div><div><h3>Equipes e empresas</h3><p>Empresas de 10 a 100 pessoas que querem que suas pessoas mais profundas continuem entregando.</p><a class=\"inl\" href=\"#/pt/teams\">NeuroAnchor para Equipes</a></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Constru\u00eddo sobre confian\u00e7a</h2><p class=\"lede\">O NeuroAnchor nasceu da experi\u00eancia vivida, n\u00e3o de um estudo de mercado.</p></div><div class=\"three\"><div><h3>Sem an\u00fancios, sem venda de dados</h3><p>O NeuroAnchor s\u00f3 ganha dinheiro com assinaturas. Seus dados nunca s\u00e3o o produto.</p></div><div><h3>Voc\u00ea no controle</h3><p>Voc\u00ea escolhe quando os lembretes podem aparecer e pode deslig\u00e1-los a qualquer momento.</p></div><div><h3>Gentil por desenho</h3><p>Os lembretes s\u00e3o amig\u00e1veis, nunca alarmes. Uma primeira mensagem suave e, se voc\u00ea perder, um aviso mais gentil.</p></div></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Experimente de gra\u00e7a</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Diga qual \u00e9 o seu aparelho, Android ou iOS, e enviaremos o link do beta.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Aparelho%20%28Android%20ou%20iOS%29%3A%0ANome%3A\">Baixe gr\u00e1tis</a><a class=\"btn btn-ghost\" href=\"#/pt/teams\">Para empresas</a></div></div></section></div><div class=\"view\" data-view=\"teams\"><section class=\"ink hero hero-product\"><div class=\"wrap\"><label class=\"psel\">Produto<select aria-label=\"Escolha um produto\"><option value=\"neuroanchor\">NeuroAnchor</option><option value=\"teams\" selected>NeuroAnchor para Equipes</option><option value=\"groundcommons\">GroundCommons</option></select></label><div class=\"status\"><i></i>Assinaturas para equipes de empresas de 10 a 100 pessoas</div><h1 style=\"max-width:16ch\">NeuroAnchor para Equipes</h1><p class=\"tagline\" style=\"max-width:34ch\">Proteja a aten\u00e7\u00e3o em que a sua empresa funciona.</p><p class=\"lede\">As suas pessoas mais profundas s\u00e3o as mais expostas a colapsos, entregas perdidas e sil\u00eancios mal interpretados. O NeuroAnchor mant\u00e9m o foco profundo sustent\u00e1vel no celular de cada pessoa, sem nada para voc\u00ea administrar.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20para%20Equipes&amp;body=Empresa%3A%0AN%C3%BAmero%20de%20funcion%C3%A1rias%20e%20funcion%C3%A1rios%3A%0ASeu%20cargo%3A\">Fale conosco sobre uma assinatura para equipes</a></div><p class=\"fnote\">Para empresas de 10 a 100 pessoas.</p></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats s3\"><div class=\"stat\"><b>Cerca de 1 em 5</b><span>pessoas \u00e9 neurodivergente, ent\u00e3o a maioria das equipes j\u00e1 inclui v\u00e1rias.</span></div><div class=\"stat\"><b>~50%</b><span>dos adultos neurodivergentes empregados relatam esgotamento (Willis Towers Watson, 2022).</span></div><div class=\"stat\"><b>89%</b><span>do custo do esgotamento para as empresas, segundo estimativa, vem do presente\u00edsmo: pessoas no trabalho, mas n\u00e3o no seu melhor (American Journal of Preventive Medicine, 2025).</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Suas melhores pessoas funcionam \u00e0 base de aten\u00e7\u00e3o</h2></div><div><p class=\"lede\">Toda entrega, passagem de bast\u00e3o e decis\u00e3o depende de um \u00fanico insumo: a aten\u00e7\u00e3o focada de quem faz o trabalho. As pessoas que entregam o trabalho mais profundo costumam ser as que desaparecem dentro dele.</p><p class=\"lede\" style=\"margin-top:16px\">\u00c9 a\u00ed que o custo come\u00e7a, e ele raramente aparece como uma linha no or\u00e7amento. Aparece como uma reuni\u00e3o perdida, uma resposta tardia lida como indiferen\u00e7a, uma entrega que escorrega, um conflito que n\u00e3o precisava existir e, meses depois, um pedido de demiss\u00e3o. Quando fica vis\u00edvel, j\u00e1 \u00e9 caro.</p><p class=\"lede lede-strong\" style=\"margin-top:16px\">O NeuroAnchor pega os pequenos deslizes antes que virem esses desfechos. Ele interrompe o t\u00fanel com gentileza, nos termos de cada pessoa, para que as mesmas pessoas continuem entregando em profundidade, semana ap\u00f3s semana, sem o colapso.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Onde ele se paga</h2></div><div class=\"four reasons\"><div><h3>Entrega que se sustenta</h3><p>As pessoas que produzem o seu trabalho mais profundo continuam nele semana ap\u00f3s semana. Menos dias de colapso, menos entregas perdidas, nenhuma queda silenciosa.</p></div><div><h3>Menos mal-entendidos, menos conflitos</h3><p>Faltar a uma reuni\u00e3o ou demorar a responder \u00e9 f\u00e1cil de ler como desengajamento. Quase sempre \u00e9 algu\u00e9m mergulhado em uma tarefa. Menos deslizes significam menos mal-entendidos entre colegas e com as chefias.</p></div><div><h3>Pessoas que ficam</h3><p>Adultos neurodivergentes enfrentam desemprego cerca de 40% maior que seus pares, ent\u00e3o \u00e9 um grande grupo de talentos que muitas empresas n\u00e3o alcan\u00e7am nem ret\u00eam. Um apoio discreto e pr\u00e1tico ajuda a contratar e a manter essas pessoas.</p></div><div><h3>Apoio sem processo por tr\u00e1s</h3><p>Sem diagn\u00f3stico, sem papelada, sem gestor de caso, sem programa para administrar. Vive no celular de cada pessoa, e a ades\u00e3o \u00e9 privada. O seu custo \u00e9 a assinatura, n\u00e3o a estrutura.</p></div></div><div class=\"pricebox\" style=\"margin-top:28px\"><span class=\"stag prog\">Em breve</span><p>Uma vis\u00e3o an\u00f4nima da equipe, com tamanho m\u00ednimo de grupo, que mostra quando os padr\u00f5es de carga de trabalho ficam insustent\u00e1veis, antes de virarem aus\u00eancias ou pedidos de demiss\u00e3o.</p></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como funciona a assinatura para equipes</h2></div><div class=\"three\"><div><span class=\"stepn\">Passo 1</span><h3>Escolha o tamanho da equipe</h3><p>As assinaturas s\u00e3o para empresas de 10 a 100 pessoas, com pre\u00e7o por funcion\u00e1ria ou funcion\u00e1rio por m\u00eas.</p></div><div><span class=\"stepn\">Passo 2</span><h3>Convide as pessoas</h3><p>Cada pessoa instala o NeuroAnchor e adere por conta pr\u00f3pria, de forma privada.</p></div><div><span class=\"stepn\">Passo 3</span><h3>Todas as pessoas recebem o produto completo</h3><p>Cada funcion\u00e1ria e funcion\u00e1rio recebe o NeuroAnchor Premium quando ele for lan\u00e7ado, com o Perfil de Foco que ajusta os lembretes a cada pessoa.</p></div></div><div class=\"pricebox\"><h3>Pre\u00e7o que cabe em um or\u00e7amento existente</h3><p>As empresas j\u00e1 gastam cerca de US$ 1 a US$ 5 por funcion\u00e1rio por m\u00eas em programas de assist\u00eancia ao empregado. Uma assinatura de equipe do NeuroAnchor foi pensada para caber nessa mesma linha de or\u00e7amento, com pre\u00e7o por volume para 10 a 100 pessoas.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>O que as suas pessoas mant\u00eam</h2></div><div class=\"three\"><div><h3>Nenhum dado individual para a empresa</h3><p>A empresa s\u00f3 v\u00ea tend\u00eancias agregadas e an\u00f4nimas. Nunca as respostas de uma pessoa.</p></div><div><h3>Sempre por escolha</h3><p>Ningu\u00e9m \u00e9 inscrito pela empresa. Cada pessoa escolhe entrar e pode sair a qualquer momento.</p></div><div><h3>Sem an\u00fancios, sem venda de dados</h3><p>O NeuroAnchor s\u00f3 ganha dinheiro com assinaturas.</p></div></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Leve o NeuroAnchor para a sua equipe</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Conte-nos o tamanho da sua empresa e voltaremos com os pr\u00f3ximos passos.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20para%20Equipes&amp;body=Empresa%3A%0AN%C3%BAmero%20de%20funcion%C3%A1rias%20e%20funcion%C3%A1rios%3A%0ASeu%20cargo%3A\">Fale conosco sobre uma assinatura para equipes</a></div></div></section></div><div class=\"view\" data-view=\"groundcommons\"><section class=\"ink hero hero-product\"><div class=\"wrap hero-split\"><div><label class=\"psel\">Produto<select aria-label=\"Escolha um produto\"><option value=\"neuroanchor\">NeuroAnchor</option><option value=\"teams\">NeuroAnchor para Equipes</option><option value=\"groundcommons\" selected>GroundCommons</option></select></label><div class=\"status pilot\"><i></i>Piloto: buscamos organiza\u00e7\u00f5es</div><h1>GroundCommons</h1><p class=\"tagline\">Uma plataforma gratuita para organizar os dados que a sua organiza\u00e7\u00e3o j\u00e1 tem.</p><p class=\"lede\">Estamos construindo o GroundCommons junto com organiza\u00e7\u00f5es de base. Participe do piloto.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Piloto%20GroundCommons&amp;body=Organiza%C3%A7%C3%A3o%3A%0APa%C3%ADs%3A%0AQue%20dados%20voc%C3%AAs%20t%C3%AAm%20%28per%C3%ADodo%2C%20n%C3%ADvel%20de%20detalhe%29%3F%0APessoa%20de%20contato%3A\">Inscreva-se no piloto</a></div></div><figure class=\"gcfig\" data-slot=\"GC\" role=\"img\" aria-label=\"GroundCommons\"><svg viewBox=\"0 0 240 150\" width=\"100%\" height=\"150\" aria-hidden=\"true\" class=\"cmn\"><g stroke=\"#4A3E63\" stroke-width=\"1.5\"><line x1=\"120\" y1=\"75\" x2=\"40\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"14\"/><line x1=\"120\" y1=\"75\" x2=\"200\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"210\" y2=\"95\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"136\"/><line x1=\"120\" y1=\"75\" x2=\"30\" y2=\"100\"/></g><g fill=\"#261E33\" stroke=\"#C9A3E6\" stroke-width=\"2\"><circle cx=\"40\" cy=\"30\" r=\"9\"/><circle cx=\"120\" cy=\"14\" r=\"9\"/><circle cx=\"200\" cy=\"30\" r=\"9\"/><circle cx=\"210\" cy=\"95\" r=\"9\"/><circle cx=\"120\" cy=\"136\" r=\"9\"/><circle cx=\"30\" cy=\"100\" r=\"9\"/></g><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#C9A3E6\"/></svg></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>O que \u00e9 o GroundCommons?</h2></div><div><p class=\"lede\">Organiza\u00e7\u00f5es de base coletam informa\u00e7\u00f5es valiosas sobre as comunidades que atendem: formul\u00e1rios, planilhas, registros, anota\u00e7\u00f5es. Quase tudo fica espalhado, o que dificulta achar respostas, comparar anos ou mostrar resultados.</p><p class=\"lede\" style=\"margin-top:16px\">O GroundCommons ajuda voc\u00ea a organizar esses dados em um s\u00f3 lugar. \u00c0 medida que mais organiza\u00e7\u00f5es entram, ele tamb\u00e9m constr\u00f3i uma forma comum de organizar dados de base.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como funciona o piloto</h2></div><div class=\"three\"><div><span class=\"stepn\">Passo 1</span><h3>Voc\u00ea nos conta sobre os seus dados</h3><p>O que voc\u00eas coletam e como est\u00e3o separados por grupos, como g\u00eanero, ra\u00e7a, idade ou territ\u00f3rio.</p></div><div><span class=\"stepn\">Passo 2</span><h3>Trabalhamos juntos na estrutura</h3><p>Como os seus dados s\u00e3o organizados e definidos. Usamos isso para desenhar o GroundCommons.</p></div><div><span class=\"stepn\">Passo 3</span><h3>Voc\u00ea usa a plataforma de gra\u00e7a</h3><p>Em troca de trabalhar conosco, a sua organiza\u00e7\u00e3o recebe acesso gratuito ao GroundCommons.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>\u00c9 para voc\u00ea?</h2></div><div><ul class=\"checklist\"><li>Voc\u00eas coletam dados sobre as pessoas ou comunidades que atendem.</li><li>Os dados est\u00e3o separados por grupos, como g\u00eanero, ra\u00e7a, idade ou territ\u00f3rio.</li><li>Voc\u00eas querem um s\u00f3 lugar para organiz\u00e1-los.</li><li>Voc\u00eas podem dedicar algum tempo a trabalhar conosco.</li></ul><p class=\"who-note\" style=\"margin-top:24px\">Come\u00e7amos com a estrutura dos seus dados e n\u00fameros agregados, n\u00e3o com informa\u00e7\u00f5es pessoais das pessoas que voc\u00eas atendem. Os termos e a prote\u00e7\u00e3o de dados s\u00e3o combinados por escrito antes de come\u00e7armos.</p></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Quer fazer parte do piloto?</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Escreva para n\u00f3s com uma breve descri\u00e7\u00e3o da sua organiza\u00e7\u00e3o e dos dados que voc\u00eas t\u00eam.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Piloto%20GroundCommons&amp;body=Organiza%C3%A7%C3%A3o%3A%0APa%C3%ADs%3A%0AQue%20dados%20voc%C3%AAs%20t%C3%AAm%20%28per%C3%ADodo%2C%20n%C3%ADvel%20de%20detalhe%29%3F%0APessoa%20de%20contato%3A\">Inscreva-se no piloto</a></div></div></section></div><div class=\"view\" data-view=\"international\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Feito para expandir e escalar.</h1><p class=\"lede\">A D3S Intelligence atua internacionalmente por meio de iniciativas. Hoje a GSW-STEM \u00e9 a principal. Outras vir\u00e3o, na mesma plataforma, m\u00e9todo e padr\u00f5es, lideradas por parceiros locais.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"N1\" role=\"img\" aria-label=\"Encontro da rede GSW-STEM\"><span class=\"slot\">N1</span><figcaption>Encontro da rede GSW-STEM</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como escalamos</h2></div><div class=\"three\"><div><h3>Uma plataforma</h3><p>Produtos compartilhados, um m\u00e9todo compartilhado e padr\u00f5es compartilhados de \u00e9tica e prote\u00e7\u00e3o de dados.</p></div><div><h3>Lideran\u00e7a local</h3><p>Cada iniciativa \u00e9 liderada por pessoas que conhecem o contexto: a l\u00edngua, os parceiros e as perguntas.</p></div><div><h3>Financiado pela miss\u00e3o</h3><p>Lucro reinvestido da D3S Intelligence, n\u00e3o produtos vendidos no exterior.</p></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Iniciativas</h2><p class=\"lede\">Cada iniciativa \u00e9 a sua pr\u00f3pria comunidade de pessoas e organiza\u00e7\u00f5es, constru\u00edda sobre a mesma base.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Iniciativa 1</span><div class=\"status\"><i></i>Principal iniciativa hoje</div><h3>GSW-STEM</h3><p class=\"one\">Global South Women in STEM</p><p class=\"desc\">Uma rede de mulheres em tecnologia em sete pa\u00edses: Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia. Lan\u00e7ada em 2026.</p><ul class=\"facts\"><li><span>Para</span><b>Mulheres em tecnologia</b></li><li><span>Onde</span><b>Sete pa\u00edses</b></li><li><span>Participe</span><b>Aberta a novas integrantes</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Entrar%20na%20GSW-STEM\">Entre na GSW-STEM</a></div></article><article class=\"prod next\"><span class=\"fig\">Pr\u00f3xima</span><div class=\"status pilot\"><i></i>Aberta</div><h3>A pr\u00f3xima iniciativa</h3><p class=\"one\">Em outra \u00e1rea ou regi\u00e3o</p><p class=\"desc\">Estamos construindo a capacidade de abrir mais iniciativas. Se voc\u00ea quer construir uma conosco, em outra \u00e1rea ou em outra parte do mundo, entre em contato.</p><ul class=\"facts\"><li><span>Para</span><b>Parceiros e fundadoras</b></li><li><span>Voc\u00ea traz</span><b>Uma equipe local e uma miss\u00e3o em comum</b></li><li><span>N\u00f3s trazemos</span><b>A plataforma, o m\u00e9todo e os padr\u00f5es</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Iniciativa%20internacional\">Fa\u00e7a parceria conosco</a></div></article></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><span class=\"fig\">Iniciativa 1, lan\u00e7ada em 2026</span><h2>Global South Women in STEM (GSW-STEM)</h2><p class=\"lede\" style=\"margin-top:16px\">Uma rede de institui\u00e7\u00f5es e pessoas que atuam em tecnologia e no entorno dela: engenheiras, cientistas, pesquisadoras, designers, empreendedoras, educadoras e formuladoras de pol\u00edticas. \u00c9 uma rede de neg\u00f3cios sociais, em que cada integrante mant\u00e9m sua pr\u00f3pria organiza\u00e7\u00e3o e compartilha expertise, contatos e credibilidade.</p><div class=\"chips2\"><span class=\"chip2\">Brasil</span><span class=\"chip2\">M\u00e9xico</span><span class=\"chip2\">Uganda</span><span class=\"chip2\">Camar\u00f5es</span><span class=\"chip2\">\u00c1frica do Sul</span><span class=\"chip2\">\u00cdndia</span><span class=\"chip2\">Eti\u00f3pia</span></div><div class=\"links\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Entrar%20na%20GSW-STEM\">Entre na GSW-STEM</a><a class=\"btn btn-line\" href=\"GSW-STEM-manifesto.pdf\" target=\"_blank\" rel=\"noopener\">Leia o manifesto de funda\u00e7\u00e3o</a></div></div><div><span class=\"fig\">Fig 4.1. A GSW-STEM hoje</span><svg class=\"net\" viewBox=\"0 0 440 340\" role=\"img\" aria-label=\"Rede GSW-STEM: Brasil no centro, ligado a M\u00e9xico, Camar\u00f5es, Uganda, Eti\u00f3pia, \u00c1frica do Sul e \u00cdndia, e um la\u00e7o sendo constru\u00eddo com a China\"><g><line x1=\"220\" y1=\"160\" x2=\"220\" y2=\"48\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"354\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"388\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"295\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"145\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"52\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"86\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"/></g><g><circle cx=\"220\" cy=\"48\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"354\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"388\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"295\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"145\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"52\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"86\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/></g><circle cx=\"220\" cy=\"160\" r=\"44\" fill=\"var(--brand)\" opacity=\".16\"/><circle cx=\"220\" cy=\"160\" r=\"28\" fill=\"var(--brand)\"/><text x=\"220\" y=\"218\" text-anchor=\"middle\" class=\"t-strong\">Brasil</text><g text-anchor=\"middle\"><text x=\"220\" y=\"84\">M\u00e9xico</text><text x=\"354\" y=\"126\">Camar\u00f5es</text><text x=\"388\" y=\"221\">Uganda</text><text x=\"295\" y=\"297\">Eti\u00f3pia</text><text x=\"145\" y=\"297\">\u00c1frica do Sul</text><text x=\"52\" y=\"221\">\u00cdndia</text><text x=\"86\" y=\"126\">China</text><text x=\"86\" y=\"140\" style=\"font-size:11px\">em constru\u00e7\u00e3o</text></g></svg></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>No que a GSW-STEM acredita</h2><p class=\"lede\">Do manifesto de funda\u00e7\u00e3o.</p></div><div class=\"svc\"><div><h3>Mulheres como lideran\u00e7as</h3><p>Muitas mulheres do Sul Global j\u00e1 s\u00e3o formadas e j\u00e1 lideram. Existimos para coloc\u00e1-las onde se decidem os futuros tecnol\u00f3gicos.</p></div><div><h3>Problemas compartilhados</h3><p>Um problema na Eti\u00f3pia pode ser o mesmo no Brasil ou na \u00cdndia. Conectando-nos al\u00e9m das fronteiras, constru\u00edmos solu\u00e7\u00f5es e buscamos financiamento juntas.</p></div><div><h3>STEM al\u00e9m do c\u00f3digo</h3><p>Tecnologia aplicada \u00e0 agricultura, energia, sa\u00fade, biotecnologia e neg\u00f3cios, n\u00e3o apenas programa\u00e7\u00e3o e IA.</p></div><div><h3>Impacto em comunidades reais</h3><p>Todo projeto nomeia a comunidade que atende e explica como vai alcan\u00e7\u00e1-la.</p></div><div><h3>O conhecimento pertence ao Sul Global</h3><p>Os projetos deixam conhecimento de dom\u00ednio p\u00fablico que qualquer organiza\u00e7\u00e3o pode adaptar e reutilizar.</p></div><div><h3>Sustentabilidade e reciprocidade</h3><p>A rede gera receita, reinveste e cresce, para poder remunerar quem contribui e financiar a educa\u00e7\u00e3o de outras mulheres.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Como a GSW-STEM come\u00e7a</h2><p class=\"lede\" style=\"margin-top:16px\">Come\u00e7amos pequenas e pr\u00e1ticas, e constru\u00edmos pela a\u00e7\u00e3o.</p></div><ul class=\"check\" style=\"margin-top:0\"><li><b>Apoiar candidaturas a financiamento.</b> Ajudamos integrantes e pessoas de confian\u00e7a fora da rede a preparar propostas de editais, startups e bolsas.</li><li><b>Dar visibilidade ao nosso trabalho.</b> Publicamos o trabalho, os resultados e os projetos das integrantes.</li><li><b>Realizar eventos.</b> Encontros e eventos que re\u00fanem integrantes e parceiros.</li><li><b>Construir parcerias</b> com universidades, minist\u00e9rios e empresas que oferecem financiamento, bolsas e forma\u00e7\u00e3o.</li></ul></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Eventos e delega\u00e7\u00f5es</h2><p class=\"lede\">Onde a rede se encontra, e onde constru\u00edmos o pr\u00f3ximo la\u00e7o.</p></div><div class=\"evts\"><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F4\" role=\"img\" aria-label=\"Encontro da rede\"><span class=\"slot\">F4</span><figcaption>Encontro da rede</figcaption></figure><div><h3>2\u00ba encontro da Global South Women in STEM Network</h3><p>Um espa\u00e7o de colabora\u00e7\u00e3o, lideran\u00e7a e a\u00e7\u00e3o coletiva entre regi\u00f5es.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delega\u00e7\u00e3o \u00e0 China\"><span class=\"slot\">F5</span><figcaption>Delega\u00e7\u00e3o \u00e0 China</figcaption></figure><div><h3>Construindo la\u00e7os na China</h3><p>Construindo uma rede para fomentar a coopera\u00e7\u00e3o em tecnologia.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E2\" role=\"img\" aria-label=\"BRICS Young Innovators\"><span class=\"slot\">E2</span><figcaption>BRICS Young Innovators</figcaption></figure><div><small class=\"when\">2025</small><h3>BRICS Young Innovators</h3><p>A fundadora da D3S Consultoria \u00e9 reconhecida como BRICS Young Innovator.</p></div></article></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Construa a pr\u00f3xima iniciativa conosco</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Parceria%20internacional\">Entre em contato</a></div></div></section></div></main><footer><div class=\"wrap foot\"><div><div class=\"chip\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><span><b>D3S</b> Intelligence</span></div><div>Tecnologia para o impacto social, constru\u00edda em campo.</div></div><div><h4>D3S I       }
      dAct.addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b) return; var d=b.getAttribute('data-d');
        if(d==='reset'){ reset(); return; }
        drift.classList.add('done'); dAct.innerHTML='<button type="button" data-d="reset">'+x.undo+'</button>';
        if(d==='yes'){ dText.textContent=x.yes; ring.setAttribute('stroke','#0F7F6D'); ring.setAttribute('stroke-dasharray','none');
          quantB.setAttribute('stroke','#1E1C24'); quantB.style.strokeDasharray='none'; lbl.textContent='44%'; }
        else { dText.textContent=x.no; ring.setAttribute('stroke','#8A8694'); ring.setAttribute('stroke-dasharray','3 3');
          quantB.setAttribute('stroke','#8A8694'); quantB.style.strokeDasharray='6 6'; quantB.style.strokeDashoffset=0; lbl.textContent=x.nc; }
      });
    }
    initForm(){
      var self=this, f=this.$('pilotForm'); if(!f) return;
      var x=STR[this.lang].x, ok=this.$('pilotOk'), btn=this.$('pilotBtn');
      f.addEventListener('submit',function(e){
        e.preventDefault();
        if(f.elements.website.value) return;
        if(!f.checkValidity()){ f.reportValidity(); return; }
        var d={organization:f.elements.organization.value.trim(), email:f.elements.email.value.trim(), years:f.elements.years.value,
               funder:f.elements.funder.value, question:f.elements.question.value.trim(), language:self.lang, consent:true};
        ok.className='ok'; ok.style.display='block'; ok.textContent=x.sending; btn.disabled=true;
        self.dispatchEvent(new CustomEvent('pilot-submit',{detail:d,bubbles:true,composed:true}));
        clearTimeout(self._t); self._t=setTimeout(function(){ self.submitStatus('error'); },10000);
      });
    }
    submitStatus(v){
      clearTimeout(this._t);
      var f=this.$('pilotForm'), ok=this.$('pilotOk'), btn=this.$('pilotBtn'); if(!f||!ok) return;
      var x=STR[this.lang].x; btn.disabled=false; ok.style.display='block';
      if(v==='ok'){ ok.className='ok'; ok.textContent=x.ok; f.reset(); } else { ok.className='ok err'; ok.innerHTML=x.error; }
      this.removeAttribute('submit-status');
    }
  }
  customElements.define('d3s-site',D3SSite);
})();
</script></body></html>
