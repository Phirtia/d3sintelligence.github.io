6\"/><rect x=\"10\" y=\"164\" width=\"190\" height=\"44\" rx=\"6\" class=\"dash\"/><rect x=\"560\" y=\"164\" width=\"190\" height=\"44\" rx=\"6\" class=\"dash\"/></g><g text-anchor=\"middle\" class=\"olab\"><text x=\"380\" y=\"35\" class=\"strong\">CEO e fundadora</text><text x=\"230\" y=\"113\">Diretora de Projetos</text><text x=\"530\" y=\"113\">Diretora de Pesquisa Qualitativa</text><text x=\"380\" y=\"191\">Conselho e volunt\u00e1rios (20)</text><text x=\"105\" y=\"191\">Empresas de mulheres</text><text x=\"655\" y=\"191\">Rede GSW-STEM</text></g></svg><div class=\"tier\"><div class=\"tier-h\"><h3>Lideran\u00e7a</h3><p>Pesquisadoras e profissionais do setor p\u00fablico e da academia.</p></div><div class=\"team3\"><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T1\" role=\"img\" aria-label=\"Phirtia Silva\">PS</span><b>Phirtia Silva</b><small>Fundadora e CEO</small><p>Cientista de dados e empreendedora social. Fundadora da D3S Consultoria e da GSW-STEM, e CEO da D3S Intelligence. Liderou a an\u00e1lise de dados de direitos humanos da prefeitura de S\u00e3o Paulo, a maior cidade do Brasil, e integra seu Grupo de Trabalho Interministerial de Indicadores.</p></div><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T2\" role=\"img\" aria-label=\"Thayna Mesquita\">TM</span><b>Thayna Mesquita</b><small>Diretora de Projetos</small><p>Cientista social e especialista em gest\u00e3o cultural. Lidera parcerias institucionais, desenho de projetos e capta\u00e7\u00e3o de recursos. Mais de cinco anos em financiamento p\u00fablico da cultura e presta\u00e7\u00e3o de contas em S\u00e3o Paulo, hoje na Secretaria de Estado da Cultura.</p></div><div class=\"pcard\"><span class=\"av pic\" data-slot=\"T3\" role=\"img\" aria-label=\"Amanda Raquel\">AR</span><b>Amanda Raquel</b><small>Diretora de Pesquisa Qualitativa</small><p>Antrop\u00f3loga social com mais de dez anos de trabalho de campo. Doutora pela Universidade Federal do Rio Grande do Norte, Melhor Tese de Doutorado 2024. Pesquisadora visitante no INAH-UNAM, no M\u00e9xico, e fellow da ALARI, de Harvard.</p></div></div></div><div class=\"tier\"><div class=\"tier-h\"><h3>Volunt\u00e1rias e volunt\u00e1rios</h3><p>Cerca de 20 colaboradoras e colaboradores diretos entre o conselho e o programa de empoderamento cient\u00edfico da D3S Consultoria.</p></div><div><figure class=\"photo  draft-until-img\" style=\"--r:16/7\" data-slot=\"V1\" role=\"img\" aria-label=\"Grupo de volunt\u00e1rias e volunt\u00e1rios\"><span class=\"slot\">V1</span><figcaption>Grupo de volunt\u00e1rias e volunt\u00e1rios</figcaption></figure><div class=\"avrow draft\"><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"av pic sm\" role=\"img\" aria-label=\"Espa\u00e7o para retrato de volunt\u00e1ria ou volunt\u00e1rio\"></span><span class=\"more\">e mais</span></div></div></div><div class=\"tier draft\"><div class=\"tier-h\"><h3>Rede internacional</h3><p>Integrantes da GSW-STEM em sete pa\u00edses.</p></div><div class=\"members\"><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N1\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N2\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N3\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N4\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N5\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div><div class=\"mem\"><span class=\"av pic\" role=\"img\" aria-label=\"Espa\u00e7o para retrato N6\">Foto</span><b>Nome</b><small>Cargo, pa\u00eds</small></div></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como \u00e9 financiado</h2><p class=\"lede\">O neg\u00f3cio social gera receita. A miss\u00e3o a investe.</p></div><div class=\"flow\"><div class=\"blk\"><span class=\"fig\">O que vendemos</span><h3>Produtos e servi\u00e7os</h3><ul class=\"plain\"><li>Impact Intelligence, ferramentas de evid\u00eancias para ONGs e financiadores</li><li>NeuroAnchor, tecnologia de bem-estar</li><li>Consultoria anal\u00edtica</li></ul></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk key\"><span class=\"fig\">O que fazemos com isso</span><h3>Reinvestir na miss\u00e3o</h3><p>O lucro volta para pesquisa, forma\u00e7\u00e3o e a rede.</p><p class=\"ph pledge draft\">Parcela reinvestida e relat\u00f3rio anual: a definir pela D3S Intelligence.</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk\"><span class=\"fig\">O que isso financia</span><h3>Pesquisa, forma\u00e7\u00e3o e rede</h3><ul class=\"plain\"><li>Apoio anal\u00edtico a ONGs, pela D3S Consultoria</li><li>Forma\u00e7\u00e3o e programa de voluntariado em dados e tecnologia</li><li>Parcerias internacionais, pela GSW-STEM</li></ul></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>O que nos move</h2><p class=\"lede\">O estatuto da D3S Consultoria define doze objetivos. Estes s\u00e3o os quatro temas que eles compartilham.</p></div><div class=\"four mission\"><div><h3>Evid\u00eancias</h3><ul class=\"plain\"><li>Pesquisa anal\u00edtica, de impacto e aplicada para organiza\u00e7\u00f5es alinhadas ao desenvolvimento social</li><li>Modelos e indicadores para prevenir viol\u00eancias e proteger direitos</li></ul></div><div><h3>Programas e pol\u00edticas</h3><ul class=\"plain\"><li>Aprimorar programas de desenvolvimento social com ONGs brasileiras e internacionais</li><li>Aprimorar pol\u00edticas p\u00fablicas que protegem pessoas vulnerabilizadas e minorias</li><li>Reduzir desigualdades, proteger crian\u00e7as, avan\u00e7ar a justi\u00e7a de g\u00eanero e racial</li></ul></div><div><h3>Tecnologia e inclus\u00e3o</h3><ul class=\"plain\"><li>Mais acesso a conhecimento e tecnologia</li><li>Programas de tecnologia para o desenvolvimento socioecon\u00f4mico</li><li>Incluir mais mulheres em STEM</li></ul></div><div><h3>Forma\u00e7\u00e3o, voz e financiamento</h3><ul class=\"plain\"><li>Formar pessoas que atuam com impacto social</li><li>Debate p\u00fablico e advocacy para incluir o terceiro setor na tecnologia</li><li>Captar recursos para reinvestir em desenvolvimento social e tecnol\u00f3gico</li></ul></div></div></div></section></div><div class=\"view\" data-view=\"expertise\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Expertise constru\u00edda em campo.</h1><p class=\"lede\">Dois anos de diagn\u00f3sticos comunit\u00e1rios, pesquisa e forma\u00e7\u00e3o com a sociedade civil no Brasil, por meio da nossa ONG, a D3S Consultoria. \u00c9 daqui que v\u00eam nossos produtos, e \u00e9 por isso que eles funcionam.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Trabalho de campo em uma favela do Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Trabalho de campo em uma favela do Rio de Janeiro</figcaption></figure></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>5</b><span>organiza\u00e7\u00f5es no primeiro ciclo de consultoria, com mais de 40 dias de trabalho</span></div><div class=\"stat\"><b>40+</b><span>profissionais formados em quatro ciclos</span></div><div class=\"stat\"><b>35.000+</b><span>pessoas alcan\u00e7adas por meio de organiza\u00e7\u00f5es parceiras</span></div><div class=\"stat\"><b>2 anos</b><span>de trabalho com a sociedade civil, desde 2024</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Primeiro o campo, depois a tecnologia</h2><p class=\"lede\" style=\"margin-top:16px\">A maioria das ferramentas de dados \u00e9 feita sem nunca visitar as comunidades que descreve. Come\u00e7amos na comunidade, com pesquisadoras que escutam, e ent\u00e3o constru\u00edmos as ferramentas que tornam esse conhecimento reutiliz\u00e1vel.</p><ul class=\"check\"><li><b>M\u00e9todos mistos.</b> An\u00e1lise quantitativa e pesquisa qualitativa, lado a lado.</li><li><b>Lideradas por pesquisadoras.</b> Uma antrop\u00f3loga social com mais de dez anos de trabalho de campo dirige nossa pesquisa qualitativa.</li><li><b>Experi\u00eancia no setor p\u00fablico.</b> Nossa equipe j\u00e1 atuou dentro dos governos de S\u00e3o Paulo, a maior cidade do Brasil, em indicadores de direitos humanos e pol\u00edtica cultural.</li></ul></div><div><span class=\"fig\">Fig 1.1. M\u00e9todos de pesquisa que conduzimos</span><ul class=\"facts big\"><li><span>Etnografia</span><b>Observa\u00e7\u00e3o no territ\u00f3rio</b></li><li><span>Entrevistas</span><b>Aprofundadas e grupos focais</b></li><li><span>Oficinas</span><b>Facilitadas, com as comunidades</b></li><li><span>An\u00e1lise</span><b>Tem\u00e1tica e interseccional</b></li><li><span>Resultado</span><b>Diagn\u00f3sticos e recomenda\u00e7\u00f5es</b></li></ul></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Programas</h2><p class=\"lede\">Programas da nossa ONG, a D3S Consultoria. Cada um tamb\u00e9m \u00e9 um campo de aprendizado para os produtos que constru\u00edmos.</p></div><div class=\"progs\"><article class=\"prog\"><div><span class=\"fig\">Programa 1</span><h3>Consultoria anal\u00edtica para ONGs</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F1\" role=\"img\" aria-label=\"Entrega a uma organiza\u00e7\u00e3o de jovens no Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Entrega a uma organiza\u00e7\u00e3o de jovens no Rio de Janeiro</figcaption></figure></div><div><p>Trabalhamos com cada organiza\u00e7\u00e3o para produzir um produto anal\u00edtico complexo a partir dos dados que ela j\u00e1 tem, e ajudamos a usar esses dados na conversa com financiadores.</p><ul class=\"facts\"><li><span>Diagn\u00f3sticos</span><b>Territorial e de impacto</b></li><li><span>Apoio</span><b>Tratamento de dados, an\u00e1lise, m\u00e9todos</b></li><li><span>Primeiro ciclo</span><b>Cinco organiza\u00e7\u00f5es</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Programa 2</span><h3>Forma\u00e7\u00e3o para profissionais de ONGs</h3></div><div><p>Quatro ciclos de forma\u00e7\u00e3o com profissionais de organiza\u00e7\u00f5es n\u00e3o governamentais.</p><ul class=\"facts\"><li><span>Temas dos ciclos</span><b>Instrumentos de diagn\u00f3stico territorial</b></li><li><span></span><b>Dados quantitativos e qualitativos para mensurar impacto</b></li><li><span></span><b>Dados para decis\u00f5es estrat\u00e9gicas</b></li><li><span></span><b>Monitoramento e avalia\u00e7\u00e3o de programas</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Programa 3</span><h3>Programa socioeducativo de voluntariado</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F3\" role=\"img\" aria-label=\"Projeto de voluntariado\"><span class=\"slot\">F3</span><figcaption>Projeto de voluntariado</figcaption></figure></div><div><p>Empoderamento t\u00e9cnico e cient\u00edfico para mulheres, pessoas trans e n\u00e3o bin\u00e1rias profissionais de dados e tecnologia, por meio de trabalho em projetos reais.</p><ul class=\"facts\"><li><span>Voc\u00ea recebe</span><b>Certificados, forma\u00e7\u00e3o, networking</b></li><li><span>Na pr\u00e1tica</span><b>Atua\u00e7\u00e3o em projetos da D3S Consultoria</b></li><li><span>Editais</span><b>Duas vezes por ano, pr\u00f3ximo edital em breve</b></li></ul></div></article></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Como podemos ajudar sua organiza\u00e7\u00e3o</h2><p class=\"lede\">Encontre onde voc\u00ea est\u00e1 e comece por a\u00ed.</p></div><div class=\"svc\"><div><h3>Insumos</h3><p>Voc\u00ea n\u00e3o sabe quais dados pode usar, nem quando e como.</p></div><div><h3>An\u00e1lise</h3><p>Voc\u00ea tem dados relevantes, mas n\u00e3o tem recursos para uma an\u00e1lise qualificada.</p></div><div><h3>M\u00e9todos</h3><p>Voc\u00ea precisa de mais maturidade em m\u00e9todos quantitativos e qualitativos.</p></div><div><h3>Forma\u00e7\u00e3o</h3><p>Sua equipe precisa entender o contexto atual dos dados e construir uma cultura de dados.</p></div><div><h3>Tratamento de dados</h3><p>Voc\u00ea ainda n\u00e3o trabalhou com dados quantitativos e qualitativos, nem em ferramentas simples como o Excel.</p></div><div><h3>Diagn\u00f3stico territorial</h3><p>Voc\u00ea conhece o territ\u00f3rio, mas ainda n\u00e3o conseguiu transformar esse conhecimento em dados que financiadores entendam.</p></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Organiza\u00e7\u00f5es com que j\u00e1 atuamos</h2><p class=\"lede\">As descri\u00e7\u00f5es s\u00e3o do trabalho das pr\u00f3prias organiza\u00e7\u00f5es, como aparecem no site da D3S Consultoria.</p></div><div class=\"partners\"><div><h3>Abra\u00e7o Campe\u00e3o</h3><p>Organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o, um grande conjunto de favelas do Rio de Janeiro. H\u00e1 quase dez anos atua com crian\u00e7as e jovens por meio de artes marciais, educa\u00e7\u00e3o e desenvolvimento pessoal. A D3S Consultoria entregou an\u00e1lises de perfil, territorial e de segmenta\u00e7\u00e3o de alunos.</p></div><div><h3>ELO Apoio Socioambiental</h3><p>Mais de dez anos de trabalho com jovens em situa\u00e7\u00e3o de vulnerabilidade, em educa\u00e7\u00e3o e inclus\u00e3o produtiva, em Curitiba, no sul do Brasil. Informa ter alcan\u00e7ado mais de 20 mil pessoas.</p></div><div><h3>Engajamundo</h3><p>Organiza\u00e7\u00e3o nacional com onze anos de atua\u00e7\u00e3o e 24 territ\u00f3rios de incid\u00eancia, incluindo o Alto Xingu, na regi\u00e3o amaz\u00f4nica. Sensibiliza jovens brasileiros para a justi\u00e7a clim\u00e1tica e socioambiental.</p></div><div><h3>Reprograma</h3><p>Pioneira em educa\u00e7\u00e3o STEM no Brasil desde 2016, reduz a lacuna de g\u00eanero e ra\u00e7a em tecnologia ao capacitar mulheres em situa\u00e7\u00e3o de vulnerabilidade, sobretudo mulheres negras e trans.</p></div></div><p class=\"note-plain\">Tamb\u00e9m: Instituto Semeia e Abra\u00e7o Cultural.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Nas not\u00edcias</h2></div><ul class=\"init\"><li><h3>D3S Consultoria ganha seu primeiro pr\u00eamio internacional</h3><p>Uma das vencedoras do Systers Pass It On Award 2024, da AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/a-d3s-consultoria-ganha-primeiro-pr%C3%AAmio-internacional\" rel=\"noopener\">15 ago. 2024</a></li><li><h3>D3S Consultoria leva seu primeiro relat\u00f3rio ao Rio de Janeiro</h3><p>O primeiro produto anal\u00edtico, entregue presencialmente a uma organiza\u00e7\u00e3o de jovens no Complexo do Alem\u00e3o.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/d3s-consultoria-vai-at%C3%A9-o-complexo-do-alem%C3%A3o\" rel=\"noopener\">15 ago. 2024</a></li></ul></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Traga uma pergunta do campo</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Consultoria\">Fale conosco</a><a class=\"btn btn-ghost\" href=\"#/pt/products\">Veja os produtos</a></div></div></section></div><div class=\"view\" data-view=\"products\"><section class=\"ink hero\"><div class=\"wrap\"><div class=\"hero-top\"><h1>Ferramentas que tornam as evid\u00eancias mais f\u00e1ceis de usar.</h1><div><p class=\"lede\">A D3S Intelligence constr\u00f3i os produtos e reinveste seu lucro na pesquisa e na forma\u00e7\u00e3o da D3S Consultoria e na rede GSW-STEM.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pt/pilot\">Participe do piloto</a><a class=\"btn btn-ghost\" href=\"#/pt/method\">Leia o m\u00e9todo</a></div></div></div><div class=\"hero-meta\"><span class=\"fig\">Fig 0.1. Ambiente de trabalho do Impact Intelligence. Interativo, com dados ilustrativos.</span><div class=\"ws\" id=\"ws\"><div class=\"ws-bar\"><i></i><i></i><i></i><span>Impact Intelligence / Programa de empregabilidade</span><em>Dados ilustrativos</em></div><div class=\"ws-body\"><aside class=\"ws-side\" aria-label=\"Fontes\"><h4>Fontes (5)</h4><ul><li data-s=\"1\"><span class=\"tag\">xlsx</span>Frequ\u00eancia e inser\u00e7\u00f5es, 2021 a 2025</li><li data-s=\"2\"><span class=\"tag\">docx</span>Transcri\u00e7\u00f5es de entrevistas, 34 arquivos, cinco locais</li><li data-s=\"3\"><span class=\"tag\">xlsx</span>Pesquisa de acompanhamento, 2023 e 2025</li><li data-s=\"4\"><span class=\"tag\">pdf</span>Relat\u00f3rio anual 2024</li><li data-s=\"5\"><span class=\"tag warn\">revisar</span>Teoria de mudan\u00e7a (inferida)</li></ul><h4>Verifica\u00e7\u00f5es desta resposta</h4><ul><li><span class=\"tag warn\">1</span>Reda\u00e7\u00e3o da pergunta mudou</li><li><span class=\"tag\">2</span>Evid\u00eancias comparadas</li><li><span class=\"tag warn\">1</span>Evid\u00eancia ausente</li></ul></aside><div class=\"ws-main\"><div class=\"q\"><b>Por que nosso programa de empregabilidade teve resultado abaixo do esperado este ano?</b><small>Pergunta feita pela gest\u00e3o do programa</small></div><div class=\"drift\" id=\"drift\"><strong>A reda\u00e7\u00e3o da pergunta mudou entre os anos</strong><p id=\"driftText\">A pesquisa de acompanhamento por tr\u00e1s deste indicador perguntava \"Situa\u00e7\u00e3o atual de trabalho\" em 2023 e \"Voc\u00ea est\u00e1 trabalhando atualmente?\" em 2025. As duas devem ser comparadas?</p><div class=\"drift-actions\" id=\"driftActions\"><button type=\"button\" data-d=\"yes\">Tratar como compar\u00e1vel</button><button type=\"button\" data-d=\"no\">Manter separadas</button></div></div><div class=\"ws-grid\"><div><h5>Evid\u00eancias</h5><div class=\"tabs\" role=\"tablist\" aria-label=\"Rela\u00e7\u00e3o entre evid\u00eancias quantitativas e qualitativas\"><button class=\"tab\" role=\"tab\" data-k=\"convergence\" aria-selected=\"true\"><i style=\"background:#0F7F6D\"></i>Converg\u00eancia</button><button class=\"tab\" role=\"tab\" data-k=\"complementarity\" aria-selected=\"false\"><i style=\"background:#865CA3\"></i>Complementaridade</button><button class=\"tab\" role=\"tab\" data-k=\"divergence\" aria-selected=\"false\"><i style=\"background:#C98A1B\"></i>Diverg\u00eancia</button></div><svg class=\"chart\" viewBox=\"0 0 520 240\" role=\"img\" aria-label=\"Taxa de inser\u00e7\u00e3o em 90 dias de 2021 a 2025 comparada \u00e0s evid\u00eancias das entrevistas\"><g stroke=\"#E3DFEA\" stroke-width=\"1\"><line x1=\"30\" y1=\"60\" x2=\"500\" y2=\"60\"/><line x1=\"30\" y1=\"110\" x2=\"500\" y2=\"110\"/><line x1=\"30\" y1=\"160\" x2=\"500\" y2=\"160\"/><line x1=\"30\" y1=\"200\" x2=\"500\" y2=\"200\"/></g><g text-anchor=\"middle\"><text x=\"50\" y=\"224\">2021</text><text x=\"150\" y=\"224\">2022</text><text x=\"250\" y=\"224\">2023</text><text x=\"350\" y=\"224\">2024</text><text x=\"450\" y=\"224\">2025</text></g><path id=\"qual\" d=\"\" fill=\"none\" stroke=\"#0F7F6D\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><circle id=\"qualDot\" r=\"5\" cx=\"450\" cy=\"60\" fill=\"#0F7F6D\"/><path id=\"quantA\" d=\"M50 95.5 L150 73.5 L250 79 L350 84.5\" fill=\"none\" stroke=\"#1E1C24\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/><path id=\"quantB\" d=\"M350 84.5 L450 178\" fill=\"none\" stroke=\"#1E1C24\" stroke-width=\"3\" stroke-linecap=\"round\"/><g fill=\"#1E1C24\"><circle cx=\"50\" cy=\"95.5\" r=\"4\"/><circle cx=\"150\" cy=\"73.5\" r=\"4\"/><circle cx=\"250\" cy=\"79\" r=\"4\"/><circle cx=\"350\" cy=\"84.5\" r=\"4\"/></g><circle id=\"pt25\" cx=\"450\" cy=\"178\" r=\"5\" fill=\"#1E1C24\"/><circle id=\"ring25\" cx=\"450\" cy=\"178\" r=\"11\" fill=\"none\" stroke=\"#C98A1B\" stroke-width=\"2\" stroke-dasharray=\"3 3\"/><text x=\"350\" y=\"68\" text-anchor=\"middle\" style=\"fill:#1E1C24;font-weight:600\">61%</text><text id=\"lbl25\" x=\"450\" y=\"204\" text-anchor=\"middle\" style=\"fill:#1E1C24;font-weight:600\">44%</text></svg><div class=\"leg\"><span><i style=\"background:#1E1C24\"></i>Taxa de inser\u00e7\u00e3o em 90 dias</span><span><i id=\"legQ\" style=\"background:#0F7F6D\"></i><em id=\"legT\" style=\"font-style:normal\">Entrevistas: men\u00e7\u00f5es \u00e0 barreira de transporte</em></span></div></div><div><div class=\"verdict\" aria-live=\"polite\"><h5>Resultado da triangula\u00e7\u00e3o</h5><h4 id=\"vT\">Converg\u00eancia</h4><p id=\"vP\"></p></div><div class=\"gapbox\"><b>Evid\u00eancia ausente.</b> Nenhum dado liga a dist\u00e2ncia de deslocamento das participantes aos resultados de inser\u00e7\u00e3o. Isso transformaria uma explica\u00e7\u00e3o plaus\u00edvel em uma explica\u00e7\u00e3o sustentada.</div></div></div><div class=\"ws-foot\">Passe o mouse sobre as refer\u00eancias numeradas para ver as fontes. Cada afirma\u00e7\u00e3o remete a um documento. Sua equipe interpreta o resultado.</div></div></div></div></div></div></section><section class=\"sec\" id=\"checks\"><div class=\"wrap\"><div class=\"s-head\"><h2>Tr\u00eas verifica\u00e7\u00f5es em cada resposta</h2><p class=\"lede\">Encontrar documentos \u00e9 a parte f\u00e1cil. O valor est\u00e1 em como as evid\u00eancias s\u00e3o comparadas e em dizer com clareza o que elas n\u00e3o conseguem sustentar.</p></div><div class=\"mods\"><div class=\"mod\"><span class=\"fig\">Fig 1.1</span><h3>Deriva de perguntas</h3><p class=\"d\">Formul\u00e1rios mudam de um ciclo de financiamento para o outro. Sinalizamos quando uma pergunta foi reescrita e perguntamos \u00e0 sua equipe se os anos podem ser comparados.</p><div class=\"frag\" aria-label=\"Exemplo de pergunta reescrita\"><div class=\"row-drift\"><code>2023</code><span>Situa\u00e7\u00e3o de trabalho</span></div><div class=\"row-drift\"><code>2024</code><span>Situa\u00e7\u00e3o atual de trabalho</span></div><div class=\"row-drift\"><code>2025</code><span>Voc\u00ea est\u00e1 trabalhando atualmente?</span></div><span class=\"badge\">Possivelmente o mesmo conceito: precisa da sua confirma\u00e7\u00e3o</span></div></div><div class=\"mod\"><span class=\"fig\">Fig 1.2</span><h3>Causa ou padr\u00e3o</h3><p class=\"d\">Um tema que aparece muito n\u00e3o \u00e9 uma causa. As respostas separam o que os dados mostram do que eles apenas sugerem.</p><div class=\"frag\" aria-label=\"Exemplo de verifica\u00e7\u00e3o de linguagem causal\"><div class=\"say bad\"><small>Texto em rascunho</small>Os custos de transporte causaram a queda.</div><div class=\"say good\"><small>Reda\u00e7\u00e3o sugerida</small>O custo de transporte \u00e9 a barreira mais citada nos dois locais com maior queda.</div></div></div><div class=\"mod\"><span class=\"fig\">Fig 1.3</span><h3>Evid\u00eancia ausente</h3><p class=\"d\">Colocamos sua teoria de mudan\u00e7a ao lado dos seus dados, para poder nomear a evid\u00eancia que deveria existir para uma afirma\u00e7\u00e3o, e n\u00e3o existe.</p><div class=\"frag\" aria-label=\"Exemplo de lacuna na teoria de mudan\u00e7a\"><div class=\"chain\"><div class=\"ok\"><span>Atividades: sess\u00f5es de forma\u00e7\u00e3o</span><b>Dados encontrados</b></div><div class=\"ok\"><span>Entregas: conclus\u00e3o da forma\u00e7\u00e3o</span><b>Dados encontrados</b></div><div class=\"miss\"><span>Resultado: ocupa\u00e7\u00e3o mantida aos 90 dias</span><b>Sem dados</b></div></div></div></div></div></div></section><section class=\"sec alt\" id=\"products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Dois produtos, constru\u00eddos com m\u00e9todo</h2><p class=\"lede\">Cada um nasce de um problema em que trabalhamos manualmente em campo, e transforma essa pr\u00e1tica em algo repet\u00edvel.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Produto 1</span><div class=\"status pilot\"><i></i>Programa piloto, buscamos parceiras e parceiros</div><h3>Impact Intelligence</h3><p class=\"one\">Um motor de evid\u00eancias de m\u00e9todos mistos para organiza\u00e7\u00f5es do terceiro setor.</p><div class=\"prod-viz\"><div class=\"trace\"><div class=\"ans\">A inser\u00e7\u00e3o caiu mais nos dois locais em que as entrevistas citam o custo de transporte com mais frequ\u00eancia <sup class=\"ref\">1</sup><sup class=\"ref\">2</sup>. Ainda n\u00e3o h\u00e1 dados que liguem a dist\u00e2ncia do deslocamento ao resultado.</div><ol><li>Frequ\u00eancia e inser\u00e7\u00f5es, 2021 a 2025</li><li>Transcri\u00e7\u00f5es de entrevistas, cinco locais</li></ol></div></div><ul class=\"facts\"><li><span>Para</span><b>ONGs, institutos, funda\u00e7\u00f5es</b></li><li><span>Insumos</span><b>Planilhas, PDFs, relat\u00f3rios, transcri\u00e7\u00f5es</b></li><li><span>Piloto</span><b>At\u00e9 tr\u00eas organiza\u00e7\u00f5es</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/pt/pilot\">Participe do piloto</a><a class=\"btn btn-line\" href=\"#/pt/method\">Como funciona</a></div></article><article class=\"prod\"><span class=\"fig\">Produto 2</span><div class=\"status\"><i></i>No ar em beta para Android e iOS</div><h3>NeuroAnchor</h3><p class=\"one\">Para trazer voc\u00ea de volta quando o hiperfoco assume.</p><div class=\"prod-viz\"><div class=\"phone\" aria-label=\"Telas do NeuroAnchor, ilustrativas\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, agora</small>Faz um tempo. Voc\u00ea bebeu \u00e1gua?</div></div><div class=\"chk\">Como voc\u00ea est\u00e1?</div><div class=\"chk-grid\"><span>Bebi \u00e1gua</span><span>Comi</span><span>Me alonguei</span><span>Falei com algu\u00e9m</span></div><div class=\"chk-note\">Sem press\u00e3o. Agora n\u00e3o tamb\u00e9m vale.</div></div></div><ul class=\"facts\"><li><span>Para</span><b>Pessoas neurodivergentes e ansiosas</b></li><li><span>Privacidade</span><b>No pr\u00f3prio aparelho por padr\u00e3o, sem an\u00fancios</b></li><li><span>Planos</span><b>Free, Premium, Pro, Business</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta\">Entre no beta</a><a class=\"btn btn-line\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20para%20empresas\">Para empresas</a></div></article></div><div class=\"pipe\"><h3>Em pesquisa</h3><div class=\"pipe-grid\"><div><span class=\"when\">Em desenvolvimento</span><b>Camada de presta\u00e7\u00e3o de contas</b><p>Registro \u00e0 prova de adultera\u00e7\u00e3o do retorno das comunidades, para que financiadores e ONGs possam mostrar que ouviram.</p></div><div><span class=\"when\">Em desenvolvimento</span><b>An\u00e1lise de narrativas de campo</b><p>An\u00e1lise qualitativa que parte do trabalho de campo real, n\u00e3o de um upload frio.</p></div><div><span class=\"when\">Em desenvolvimento</span><b>Ferramentas de dados para baixa conectividade</b><p>Coleta e sincroniza\u00e7\u00e3o de dados que nunca pressup\u00f5em uma conex\u00e3o ativa com a internet.</p></div></div></div></div></section></div><div class=\"view\" data-view=\"method\"><section class=\"ink page-hero\"><div class=\"wrap\"><h1>Um m\u00e9todo, n\u00e3o uma caixa de chat.</h1><p class=\"lede\">Qualquer pessoa pode subir documentos e fazer perguntas. O Impact Intelligence acrescenta por cima a pr\u00e1tica de monitoramento e avalia\u00e7\u00e3o: compara\u00e7\u00e3o estruturada entre n\u00fameros e narrativas, e uma vis\u00e3o clara do que falta de evid\u00eancia.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Triangula\u00e7\u00e3o: tr\u00eas formas de as evid\u00eancias se relacionarem</h2><p class=\"lede\">Quando evid\u00eancias quantitativas e qualitativas respondem \u00e0 mesma pergunta, a rela\u00e7\u00e3o entre elas cai em uma de tr\u00eas categorias. Cada resposta diz qual.</p></div><div class=\"three\"><div><span class=\"dot\" style=\"background:var(--teal)\"></span><h3>Converg\u00eancia</h3><p>As duas fontes apontam na mesma dire\u00e7\u00e3o e se refor\u00e7am. Isso fortalece uma explica\u00e7\u00e3o, sem prov\u00e1-la.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 55 L100 40 L190 12\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 60 L100 48 L190 20\" fill=\"none\" stroke=\"var(--teal)\" stroke-width=\"2.5\"/></svg></div><div><span class=\"dot\" style=\"background:var(--brand)\"></span><h3>Complementaridade</h3><p>As fontes cobrem facetas diferentes do mesmo quadro, sem se contradizerem.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 50 L100 40 L190 14\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 40 L100 42 L190 38\" fill=\"none\" stroke=\"var(--brand)\" stroke-width=\"2.5\"/></svg></div><div><span class=\"dot\" style=\"background:var(--amber)\"></span><h3>Diverg\u00eancia</h3><p>As fontes discordam. Muitas vezes esse \u00e9 o achado mais \u00fatil, n\u00e3o um defeito a ser suavizado.</p><svg class=\"diag\" viewBox=\"0 0 200 70\" aria-hidden=\"true\"><path d=\"M10 50 L100 40 L190 14\" fill=\"none\" stroke=\"var(--text)\" stroke-width=\"2.5\"/><path d=\"M10 14 L100 36 L190 58\" fill=\"none\" stroke=\"var(--amber)\" stroke-width=\"2.5\"/></svg></div></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Detectando o que falta</h2><p class=\"lede\" style=\"margin-top:16px\">O sistema mant\u00e9m uma vis\u00e3o estruturada da sua teoria de mudan\u00e7a, com insumos, atividades, entregas e resultados. Assim pode dizer quando voc\u00ea tem evid\u00eancia de que um programa aconteceu, mas n\u00e3o de que funcionou.</p><ul class=\"check\"><li><b>Inferida, depois confirmada.</b> Um rascunho de teoria de mudan\u00e7a \u00e9 feito a partir dos seus documentos. Sua equipe o corrige antes que ele oriente qualquer resultado.</li><li><b>Lacunas apontam para indicadores.</b> Cada alerta nomeia o dado espec\u00edfico que resolveria a quest\u00e3o.</li><li><b>Achados s\u00e3o perguntas.</b> Os resultados s\u00e3o apresentados para a sua interpreta\u00e7\u00e3o, nunca como veredictos sobre a sua organiza\u00e7\u00e3o.</li></ul></div><div class=\"frag\" style=\"padding:20px\"><span class=\"fig\">Fig 2.1. Verifica\u00e7\u00e3o da teoria de mudan\u00e7a</span><div class=\"chain\"><div class=\"ok\"><span>Insumos: equipe, recursos</span><b>Dados encontrados</b></div><div class=\"ok\"><span>Atividades: sess\u00f5es de forma\u00e7\u00e3o</span><b>Dados encontrados</b></div><div class=\"ok\"><span>Entregas: conclus\u00e3o da forma\u00e7\u00e3o</span><b>Dados encontrados</b></div><div class=\"miss\"><span>Resultado: ocupa\u00e7\u00e3o aos 90 dias</span><b>Sem dados</b></div><div class=\"miss\"><span>Resultado: ocupa\u00e7\u00e3o mantida ap\u00f3s um ano</span><b>Sem dados</b></div></div><p class=\"note-draft\">Seu programa tem evid\u00eancia de que a forma\u00e7\u00e3o aconteceu. Ainda n\u00e3o consegue mostrar que funcionou.</p></div></div></section><section class=\"sec\" id=\"protection\"><div class=\"wrap std\"><div><h2>Prote\u00e7\u00e3o de dados e \u00e9tica</h2><p class=\"lede\" style=\"margin-top:16px\">Desenhado em torno da LGPD do Brasil e do GDPR da Uni\u00e3o Europeia, e com um padr\u00e3o mais r\u00edgido que o m\u00ednimo.</p></div><dl><div class=\"r\"><dt>Dados m\u00ednimos</dt><dd>Come\u00e7amos com informa\u00e7\u00f5es da organiza\u00e7\u00e3o e do programa, n\u00e3o com registros de benefici\u00e1rias e benefici\u00e1rios, a menos que uma pergunta realmente exija.</dd></div><div class=\"r\"><dt>Acesso controlado</dt><dd>O acesso \u00e9 limitado, informa\u00e7\u00f5es de identifica\u00e7\u00e3o ficam separadas dos dados anal\u00edticos, e dados individuais s\u00e3o anonimizados ou pseudonimizados.</dd></div><div class=\"r\"><dt>Permiss\u00e3o expl\u00edcita</dt><dd>Cada conjunto de dados \u00e9 usado somente com a sua permiss\u00e3o expl\u00edcita. Nenhum uso incidental de informa\u00e7\u00f5es pessoais sens\u00edveis.</dd></div><div class=\"r\"><dt>Revis\u00e3o humana</dt><dd>Toda resposta \u00e9 rastre\u00e1vel at\u00e9 sua fonte, e os resultados s\u00e3o revisados por especialistas da sua organiza\u00e7\u00e3o antes de sa\u00edrem dela.</dd></div></dl></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Veja com os seus pr\u00f3prios dados</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pt/pilot\">Participe do piloto</a><a class=\"btn btn-ghost\" href=\"#/pt/\">Voltar ao in\u00edcio</a></div></div></section></div><div class=\"view\" data-view=\"pilot\"><section class=\"ink page-hero\"><div class=\"wrap\"><h1>Participe do piloto do Impact Intelligence.</h1><p class=\"lede\">Um piloto com prazo definido, com at\u00e9 tr\u00eas organiza\u00e7\u00f5es. Voc\u00ea traz anos de dados que j\u00e1 existem. Constru\u00edmos o ambiente com a sua equipe, testamos em perguntas reais e aprendemos juntos o que vale a pena pagar.</p></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>O que voc\u00ea recebe</h2><ul class=\"check\"><li><b>Um Mapa de Dados e Evid\u00eancias da ONG.</b> Seus programas, fontes de dados e perguntas recorrentes em um s\u00f3 lugar.</li><li><b>Dicion\u00e1rios de dados e indicadores,</b> incluindo como as perguntas mudaram ao longo dos anos.</li><li><b>Um mapa de teoria de mudan\u00e7a</b> elaborado a partir dos seus documentos, para a sua equipe confirmar.</li><li><b>Um ambiente anal\u00edtico funcionando,</b> com forma\u00e7\u00e3o e suporte para sua equipe.</li></ul><h2 style=\"margin-top:48px\">O que pedimos de voc\u00ea</h2><ul class=\"check\"><li><b>Dados hist\u00f3ricos</b> de v\u00e1rios anos, de prefer\u00eancia abrangendo ao menos uma mudan\u00e7a de formul\u00e1rios ou defini\u00e7\u00f5es.</li><li><b>Tempo da equipe,</b> que medimos para sermos honestas quanto ao esfor\u00e7o.</li><li><b>Respostas diretas</b> sobre se voc\u00ea pagaria por isso, e quanto.</li></ul><p class=\"note-draft\">Melhor perfil: organiza\u00e7\u00e3o com financiador que exige evid\u00eancias ou relat\u00f3rios peri\u00f3dicos.</p></div><div><span class=\"fig\">Fig 3.1. Cronograma do piloto</span><ol class=\"tl pad-l\"><li data-w=\"Weeks 1-2\"><b>Valida\u00e7\u00e3o</b><span>Testamos a abordagem em uma amostra dos seus arquivos.</span></li><li data-w=\"Weeks 3-4\"><b>Descoberta</b><span>Mapeamos programas, fontes de dados e seu processo de presta\u00e7\u00e3o de contas.</span></li><li data-w=\"Weeks 4-6\"><b>Prepara\u00e7\u00e3o dos dados</b><span>Dicion\u00e1rios e uma primeira teoria de mudan\u00e7a para voc\u00ea confirmar.</span></li><li data-w=\"Weeks 6-9\"><b>Constru\u00e7\u00e3o</b><span>O ambiente de trabalho: ingest\u00e3o, organiza\u00e7\u00e3o, triangula\u00e7\u00e3o, rastreio de evid\u00eancias.</span></li><li data-w=\"Weeks 9-11\"><b>Teste com tarefas reais</b><span>Tempo de resposta, precis\u00e3o e se a sua equipe continua usando.</span></li><li data-w=\"Weeks 11-13\"><b>Avalia\u00e7\u00e3o comercial</b><span>Disposi\u00e7\u00e3o a pagar, e se um financiador patrocinaria o acesso.</span></li></ol></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Inscri\u00e7\u00e3o</h2><p class=\"lede\" style=\"margin-top:16px\">Conte-nos sobre a sua organiza\u00e7\u00e3o. Lemos todas as inscri\u00e7\u00f5es e respondemos com os pr\u00f3ximos passos.</p></div><form class=\"form\" id=\"pilotForm\" novalidate><label>Organiza\u00e7\u00e3o<input name=\"organization\" type=\"text\" required placeholder=\"Nome da sua organiza\u00e7\u00e3o\"></label><label>E-mail<input name=\"email\" type=\"email\" required placeholder=\"voce@organizacao.org\"></label><label>Anos de dados dispon\u00edveis<select name=\"years\"><option>1 a 2 anos</option><option>3 a 5 anos</option><option>Mais de 5 anos</option></select></label><label>Voc\u00ea presta contas a um financiador?<select name=\"funder\"><option>Sim, regularmente</option><option>\u00c0s vezes</option><option>N\u00e3o</option></select></label><label>Que pergunta voc\u00ea mais gostaria de ver respondida?<textarea name=\"question\" rows=\"3\" placeholder=\"Por exemplo: por que os resultados mudaram entre os anos?\"></textarea></label><label class=\"check-l\"><input type=\"checkbox\" name=\"consent\" required> Concordo que a D3S Intelligence armazene estes dados para responder \u00e0 minha inscri\u00e7\u00e3o.</label><input type=\"text\" name=\"website\" class=\"hp\" tabindex=\"-1\" autocomplete=\"off\" aria-hidden=\"true\"><button type=\"submit\" class=\"btn btn-brand\" id=\"pilotBtn\">Enviar inscri\u00e7\u00e3o</button><div class=\"ok\" id=\"pilotOk\" role=\"status\"></div></form></div></section></div><div class=\"view\" data-view=\"network\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Uma rede do Sul Global que j\u00e1 funciona.</h1><p class=\"lede\">A GSW-STEM conecta mulheres em tecnologia em sete pa\u00edses. Lan\u00e7ada em 2026 pela fundadora da D3S Consultoria, agora constr\u00f3i novos la\u00e7os na China.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"N1\" role=\"img\" aria-label=\"Encontro da rede GSW-STEM\"><span class=\"slot\">N1</span><figcaption>Encontro da rede GSW-STEM</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><span class=\"fig\">Lan\u00e7ada em 2026</span><h2>Global South Women in STEM (GSW-STEM)</h2><p class=\"lede\" style=\"margin-top:16px\">Uma rede de institui\u00e7\u00f5es e pessoas que atuam em tecnologia e no entorno dela: engenheiras, cientistas, pesquisadoras, designers, empreendedoras, educadoras e formuladoras de pol\u00edticas. \u00c9 uma rede de neg\u00f3cios sociais, em que cada integrante mant\u00e9m sua pr\u00f3pria organiza\u00e7\u00e3o e compartilha expertise, contatos e credibilidade.</p><div class=\"chips2\"><span class=\"chip2\">Brasil</span><span class=\"chip2\">M\u00e9xico</span><span class=\"chip2\">Uganda</span><span class=\"chip2\">Camar\u00f5es</span><span class=\"chip2\">\u00c1frica do Sul</span><span class=\"chip2\">\u00cdndia</span><span class=\"chip2\">Eti\u00f3pia</span></div><div class=\"links\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Entrar%20na%20GSW-STEM\">Entre para a rede</a><a class=\"btn btn-line\" href=\"#\" id=\"manifesto\">Leia o manifesto de funda\u00e7\u00e3o</a></div></div><div><span class=\"fig\">Fig 4.1. A rede hoje</span><svg class=\"net\" viewBox=\"0 0 440 340\" role=\"img\" aria-label=\"Rede GSW-STEM: Brasil no centro, ligado a M\u00e9xico, Camar\u00f5es, Uganda, Eti\u00f3pia, \u00c1frica do Sul e \u00cdndia, e um la\u00e7o sendo constru\u00eddo com a China\"><g><line x1=\"220\" y1=\"160\" x2=\"220\" y2=\"48\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"354\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"388\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"295\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"145\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"52\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"86\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"/></g><g><circle cx=\"220\" cy=\"48\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"354\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"388\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"295\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"145\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"52\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"86\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/></g><circle cx=\"220\" cy=\"160\" r=\"44\" fill=\"var(--brand)\" opacity=\".16\"/><circle cx=\"220\" cy=\"160\" r=\"28\" fill=\"var(--brand)\"/><text x=\"220\" y=\"218\" text-anchor=\"middle\" class=\"t-strong\">Brasil</text><g text-anchor=\"middle\"><text x=\"220\" y=\"84\">M\u00e9xico</text><text x=\"354\" y=\"126\">Camar\u00f5es</text><text x=\"388\" y=\"221\">Uganda</text><text x=\"295\" y=\"297\">Eti\u00f3pia</text><text x=\"145\" y=\"297\">\u00c1frica do Sul</text><text x=\"52\" y=\"221\">\u00cdndia</text><text x=\"86\" y=\"126\">China</text><text x=\"86\" y=\"140\" style=\"font-size:11px\">em constru\u00e7\u00e3o</text></g></svg></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>No que acreditamos</h2><p class=\"lede\">Do manifesto de funda\u00e7\u00e3o.</p></div><div class=\"svc\"><div><h3>Mulheres como lideran\u00e7as</h3><p>Muitas mulheres do Sul Global j\u00e1 s\u00e3o formadas e j\u00e1 lideram. Existimos para coloc\u00e1-las onde se decidem os futuros tecnol\u00f3gicos.</p></div><div><h3>Problemas compartilhados</h3><p>Um problema na Eti\u00f3pia pode ser o mesmo no Brasil ou na \u00cdndia. Conectando-nos al\u00e9m das fronteiras, constru\u00edmos solu\u00e7\u00f5es e buscamos financiamento juntas.</p></div><div><h3>STEM al\u00e9m do c\u00f3digo</h3><p>Tecnologia aplicada \u00e0 agricultura, energia, sa\u00fade, biotecnologia e neg\u00f3cios, n\u00e3o apenas programa\u00e7\u00e3o e IA.</p></div><div><h3>Impacto em comunidades reais</h3><p>Todo projeto nomeia a comunidade que atende e explica como vai alcan\u00e7\u00e1-la.</p></div><div><h3>O conhecimento pertence ao Sul Global</h3><p>Os projetos deixam conhecimento de dom\u00ednio p\u00fablico que qualquer organiza\u00e7\u00e3o pode adaptar e reutilizar.</p></div><div><h3>Sustentabilidade e reciprocidade</h3><p>A rede gera receita, reinveste e cresce, para poder remunerar quem contribui e financiar a educa\u00e7\u00e3o de outras mulheres.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Como come\u00e7amos</h2><p class=\"lede\" style=\"margin-top:16px\">Come\u00e7amos pequenas e pr\u00e1ticas, e constru\u00edmos pela a\u00e7\u00e3o.</p></div><ul class=\"check\" style=\"margin-top:0\"><li><b>Apoiar candidaturas a financiamento.</b> Ajudamos integrantes e pessoas de confian\u00e7a fora da rede a preparar propostas de editais, startups e bolsas.</li><li><b>Dar visibilidade ao nosso trabalho.</b> Publicamos o trabalho, os resultados e os projetos das integrantes.</li><li><b>Realizar eventos.</b> Encontros e eventos que re\u00fanem integrantes e parceiros.</li><li><b>Construir parcerias</b> com universidades, minist\u00e9rios e empresas que oferecem financiamento, bolsas e forma\u00e7\u00e3o.</li></ul></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Eventos e delega\u00e7\u00f5es</h2><p class=\"lede\">Onde a rede se encontra, e onde constru\u00edmos o pr\u00f3ximo la\u00e7o.</p></div><div class=\"evts\"><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F4\" role=\"img\" aria-label=\"Encontro da rede\"><span class=\"slot\">F4</span><figcaption>Encontro da rede</figcaption></figure><div><h3>2\u00ba encontro da Global South Women in STEM Network</h3><p>Um espa\u00e7o de colabora\u00e7\u00e3o, lideran\u00e7a e a\u00e7\u00e3o coletiva entre regi\u00f5es.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delega\u00e7\u00e3o \u00e0 China\"><span class=\"slot\">F5</span><figcaption>Delega\u00e7\u00e3o \u00e0 China</figcaption></figure><div><h3>Construindo la\u00e7os na China</h3><p>Construindo uma rede para fomentar a coopera\u00e7\u00e3o em tecnologia.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E2\" role=\"img\" aria-label=\"BRICS Young Innovators\"><span class=\"slot\">E2</span><figcaption>BRICS Young Innovators</figcaption></figure><div><h3>BRICS Young Innovators</h3><p>Reconhecimento do trabalho da D3S Consultoria como uma inova\u00e7\u00e3o liderada a partir do Sul Global.</p></div></article></div></div></section><section class=\"draft sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Integrantes e empresas</h2><p class=\"lede\">Pesquisadoras e e       /* menu + anchor links */
      var nav=$('navLinks'), mb=$('menuBtn');
      if(mb) mb.addEventListener('click',function(){ var o=nav.classList.toggle('open'); mb.setAttribute('aria-expanded',o?'true':'false'); });
      root.addEventListener('click',function(e){
        var t=e.target.closest&&e.target.closest('[data-scroll]'); if(!t) return;
        e.preventDefault();
        var id=t.getAttribute('data-scroll'), cur=self.parse().view;
        if(cur==='home'){ self.scrollToId(id); if(nav){ nav.classList.remove('open'); mb.setAttribute('aria-expanded','false'); } }
        else { self.pending=id; location.hash=(self.lang==='pt'?'#/pt/':'#/'); }
      });
      this.initEco(); this.initWorkspace(); this.initForm();
    }
    initEco(){
      var self=this,$=function(i){ return self.$(i); };
      if(!$('eco')) return;
      var ECO=STR[this.lang].ECO, eT=$('ecT'), eP=$('ecP'), eL=$('ecL'), eA=$('ecA');
      var btns=Array.prototype.slice.call(this.root.querySelectorAll('.eco-src button'));
      function set(k){ var o=ECO[k]; eT.textContent=o.t; eP.textContent=o.p; eA.textContent=o.a; eA.setAttribute('href',o.h);
        eL.innerHTML=o.l.map(function(x){ return '<li>'+x+'</li>'; }).join('');
        btns.forEach(function(b){ b.setAttribute('aria-pressed',b.getAttribute('data-e')===k?'true':'false'); }); }
      btns.forEach(function(b){ b.addEventListener('click',function(){ set(b.getAttribute('data-e')); }); });
      set('d3s');
    }
    initWorkspace(){
      var self=this,$=function(i){ return self.$(i); };
      if(!$('ws')) return;
      var S=STR[this.lang].S, x=STR[this.lang].x, X=[50,150,250,350,450];
      var qual=$('qual'), qd=$('qualDot'), quantA=$('quantA'), quantB=$('quantB'), legQ=$('legQ'), legT=$('legQualText')||$('legT');
      var vT=$('vT'), vP=$('vP');
      var tabs=Array.prototype.slice.call(this.root.querySelectorAll('.tab'));
      var side=Array.prototype.slice.call(this.root.querySelectorAll('.ws-side li[data-s]'));
      function draw(p,delay){
        if(reduce){ p.style.strokeDasharray='none'; return; }
        var L=p.getTotalLength(); p.style.transition='none'; p.style.strokeDasharray=L; p.style.strokeDashoffset=L;
        p.getBoundingClientRect(); p.style.transition='stroke-dashoffset 900ms ease '+delay+'ms'; p.style.strokeDashoffset=0;
      }
      function bindRefs(){ Array.prototype.forEach.call(vP.querySelectorAll('.ref'),function(r){
        r.addEventListener('mouseenter',function(){ side.forEach(function(li){ li.classList.toggle('hl',li.getAttribute('data-s')===r.getAttribute('data-src')); }); });
        r.addEventListener('mouseleave',function(){ side.forEach(function(li){ li.classList.remove('hl'); }); }); }); }
      function scenario(k,first){
        var s=S[k], d=''; s.y.forEach(function(y,i){ d+=(i?' L':'M')+X[i]+' '+y; });
        qual.setAttribute('d',d); qual.setAttribute('stroke',s.color); qd.setAttribute('cy',s.y[4]); qd.setAttribute('fill',s.color);
        legQ.style.background=s.color; legT.textContent=s.label;
        vT.textContent=s.title; vT.style.color=s.color; vP.innerHTML=s.html; bindRefs();
        tabs.forEach(function(t){ t.setAttribute('aria-selected',t.getAttribute('data-k')===k?'true':'false'); });
        draw(qual,first?800:0);
        if(!reduce){ qd.style.opacity=0; qd.style.transition='none'; setTimeout(function(){ qd.style.transition='opacity 200ms'; qd.style.opacity=1; },first?1700:900); }
      }
      tabs.forEach(function(t){ t.addEventListener('click',function(){ scenario(t.getAttribute('data-k'),false); }); });
      draw(quantA,0); draw(quantB,500); scenario('convergence',true);
      var drift=$('drift'), dText=$('driftText'), dAct=$('driftActions'), ring=$('ring25'), lbl=$('lbl25');
      function reset(){
        drift.classList.remove('done'); dText.textContent=x.ask;
        dAct.innerHTML='<button type="button" data-d="yes">'+x.bYes+'</button><button type="button" data-d="no">'+x.bNo+'</button>';
        ring.setAttribute('stroke','#C98A1B'); ring.setAttribute('stroke-dasharray','3 3');
        quantB.setAttribute('stroke','#1E1C24'); quantB.style.strokeDasharray='none'; lbl.textContent='44%';
      }
      dAct.addEventListener('click',function(e){
        var b=e.target.closest('button'); if(!b) return; var d=b.getAttribute('data-d');
        if(d==='reset'){ reset(); return; }
        drift.classList.add('done'); dAct.innerHTML='<button type="button" data-d="reset">'+x.undo+'</button>';
        if(d==='yes'){ dText.textContent=x.yes; ring.setAttribute('stroke','#0F7F6D'); ring.setAttribute('stroke-dasharray','none');
          quantB.setAttribute('stroke','#1E1C24'); quantB.style.strokeDasharray='none'; lbl.textContent='44%'; }
        else { dText.textContent=x.no; ring.setAttribute('stroke','#8A8694'); ring.setAttribute('stroke-dasharray','3 3');
          quantB.setAttribute('stroke','#8A8694'); quantB.style.strokeDasharray='6 6'; quantB.style.strokeDashoffset=0; lbl.textContent=x.nc; }
      });
    }
    initForm(){
      var self=this, f=this.$('pilotForm'); if(!f) return;
      var x=STR[this.lang].x, ok=this.$('pilotOk'), btn=this.$('pilotBtn');
      f.addEventListener('submit',function(e){
        e.preventDefault();
        if(f.elements.website.value) return;
        if(!f.checkValidity()){ f.reportValidity(); return; }
        var d={organization:f.elements.organization.value.trim(), email:f.elements.email.value.trim(), years:f.elements.years.value,
               funder:f.elements.funder.value, question:f.elements.question.value.trim(), language:self.lang, consent:true};
        ok.className='ok'; ok.style.display='block'; ok.textContent=x.sending; btn.disabled=true;
        self.dispatchEvent(new CustomEvent('pilot-submit',{detail:d,bubbles:true,composed:true}));
        clearTimeout(self._t); self._t=setTimeout(function(){ self.submitStatus('error'); },10000);
      });
    }
    submitStatus(v){
      clearTimeout(this._t);
      var f=this.$('pilotForm'), ok=this.$('pilotOk'), btn=this.$('pilotBtn'); if(!f||!ok) return;
      var x=STR[this.lang].x; btn.disabled=false; ok.style.display='block';
      if(v==='ok'){ ok.className='ok'; ok.textContent=x.ok; f.reset(); } else { ok.className='ok err'; ok.innerHTML=x.error; }
      this.removeAttribute('submit-status');
    }
  }
  customElements.define('d3s-site',D3SSite);
})();
</script></body></html>
