  var CSS="\nd3s-site{display:block;\n  --bg:#F6F5F9; --surface:#FFFFFF; --text:#1E1C24; --muted:#595663; --line:#DCD8E4;\n  --brand:#865CA3; --brand-deep:#5E3A7A; --on-brand:#FFFFFF; --teal:#0F7F6D; --amber:#A35D00;\n  --ink:#1C1626; --ink-2:#261E33; --ink-line:rgba(255,255,255,.14); --ink-text:#F1EEF6; --ink-muted:#B9B2C8;\n  --ph-a:#EEE8F4; --ph-b:#DACCE9;\n  --c-teal:#3FD6B6; --c-violet:#C9A3E6; --c-amber:#FFB347;\n  --font-display:\"Bricolage Grotesque\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --font-body:\"IBM Plex Sans\",\"Segoe UI\",system-ui,-apple-system,sans-serif;\n  --font-mono:\"IBM Plex Mono\",ui-monospace,Menlo,Consolas,monospace;\n  box-sizing:border-box;\n}\n*,*::before,*::after{box-sizing:inherit}\n.d3s-root{background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}\nsvg{max-width:100%}\na{color:inherit}\nbutton{font-family:inherit}\n:focus-visible{outline:3px solid var(--brand);outline-offset:3px;border-radius:2px}\n.ink :focus-visible{outline-color:var(--c-violet)}\n.wrap{width:min(1180px,100% - 48px);margin-inline:auto}\nh1,h2,h3,h4{font-family:var(--font-display);margin:0;letter-spacing:-.02em;line-height:1.1}\nh1{font-size:clamp(2.4rem,5vw,3.9rem);font-weight:700}\nh2{font-size:clamp(1.8rem,3.2vw,2.6rem);font-weight:650}\nh3{font-size:1.4rem;font-weight:650;letter-spacing:-.01em}\np{margin:0}\n.lede{color:var(--muted);max-width:62ch}\n.fig{font-family:var(--font-mono);font-size:.78rem;color:var(--muted);display:block;margin-bottom:10px}\n.ink .fig{color:var(--ink-muted)}\n.view{display:none}\n.view.active{display:block}\n\n/* header */\n.site-header{position:sticky;top:0;z-index:30;background:var(--surface);border-bottom:1px solid var(--line)}\n.nav{display:flex;align-items:center;justify-content:space-between;height:72px;gap:24px}\n.brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-family:var(--font-display);font-size:1.3rem;letter-spacing:-.01em}\n.brand img{width:44px;height:44px;display:block}\n.brand b{font-weight:800}\n.brand span{font-weight:500;color:var(--muted)}\n.nav-links{display:flex;gap:26px;align-items:center}\n.nav-links a{text-decoration:none;font-size:.95rem;color:var(--muted);padding:6px 0;border-bottom:2px solid transparent;cursor:pointer}\n.nav-links a:hover,.nav-links a.on{color:var(--text);border-bottom-color:var(--brand)}\n.nav-links .nav-cta{background:var(--brand);color:var(--on-brand);padding:10px 18px;border-radius:4px;font-weight:600;border-bottom:0}\n.nav-links .nav-cta:hover{filter:brightness(1.08);color:var(--on-brand)}\n.menu-btn{display:none;background:none;border:1px solid var(--line);color:var(--text);padding:8px 14px;border-radius:4px;font-size:.9rem;cursor:pointer}\n\n/* buttons */\n.btn{display:inline-block;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:4px;font-size:1rem;border:1px solid transparent;cursor:pointer}\n.btn-brand{background:var(--brand);color:var(--on-brand)}\n.btn-brand:hover{filter:brightness(1.08)}\n.btn-light{background:var(--ink-text);color:var(--ink)}\n.btn-ghost{border-color:var(--ink-line);color:var(--ink-text)}\n.btn-ghost:hover{border-color:var(--ink-text)}\n.btn-line{border-color:var(--line);color:var(--text)}\n.btn-line:hover{border-color:var(--text)}\n\n/* hero */\n.ink{background:var(--ink);color:var(--ink-text)}\n.hero{padding:64px 0 80px}\n.hero-top{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:56px;align-items:end}\n.hero h1{font-size:clamp(2.2rem,4.2vw,3.5rem);max-width:18ch}\n.hero .lede{color:var(--ink-muted);font-size:1.08rem;max-width:46ch}\n.hero-actions{display:flex;flex-wrap:wrap;gap:14px;margin-top:26px}\n.hero-meta{margin-top:44px}\n@media (max-width:1020px){.hero-top{grid-template-columns:1fr;gap:24px}}\n\n/* workspace mock */\n.ws{--t:#1E1C24;--m:#625E6C;--l:#E3DFEA;--b:#F6F5F9;--p:#865CA3;--pd:#5E3A7A;\n  background:#fff;color:var(--t);border-radius:8px;overflow   var HTML={"en": "<header class=\"site-header\"><div class=\"wrap nav\"><a class=\"brand\" href=\"#/\" aria-label=\"D3S Intelligence, home\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><div><b>D3S</b> <span>Intelligence</span></div></a><button class=\"menu-btn\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"navLinks\">Menu</button><nav class=\"nav-links\" id=\"navLinks\" aria-label=\"Main\"><div class=\"dd\" id=\"dd\"><button type=\"button\" class=\"dd-btn\" id=\"ddBtn\" aria-haspopup=\"true\" aria-expanded=\"false\" data-route=\"neuroanchor teams groundcommons\">Products<svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\" aria-hidden=\"true\"><path d=\"M1 1l4 4 4-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button><div class=\"dd-menu\" id=\"ddMenu\"><a href=\"#/neuroanchor\" data-route=\"neuroanchor\">NeuroAnchor</a><a href=\"#/teams\" data-route=\"teams\">NeuroAnchor for Teams</a><a href=\"#/groundcommons\" data-route=\"groundcommons\">GroundCommons</a></div></div><a href=\"#/method\" data-route=\"method\">Method</a><a href=\"#/international\" data-route=\"international\">International</a><a href=\"#/about\" data-route=\"about\">About</a><a class=\"lang\" id=\"langSwitch\" href=\"#\" aria-label=\"Vers\u00e3o em portugu\u00eas\">PT</a><a href=\"#contact\" data-scroll=\"contact\" class=\"nav-cta\">Partner with us</a></nav></div></header><main><div class=\"view\" data-view=\"home\"><section class=\"ink hero hero-vision hero-with-photo\"><div class=\"wrap hero-split\"><div><h1>Building the future of social technology.</h1><p class=\"lede\">A social enterprise that builds technology for social impact, from grassroots knowledge to high-level technical expertise.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/neuroanchor\">See our products</a><a href=\"#contact\" class=\"btn btn-ghost\" data-scroll=\"contact\">Partner with us</a></div></div><figure class=\"photo dark\" style=\"--r:4/3\" data-slot=\"HM\" role=\"img\" aria-label=\"Our team in the field\"><span class=\"slot\">HM</span><figcaption>Our team in the field</figcaption></figure></div></section><section class=\"sec\" id=\"vision\"><div class=\"wrap\"><div class=\"s-head\"><h2>One ecosystem, from the ground to the world</h2><p class=\"lede\">D3S Intelligence is a social enterprise that works with the NGO D3S Consultoria and the GSW-STEM network. Together, they form an international institutional design for social impact entrepreneurship, able to build technology for social impact, from grassroots knowledge to high-level technical expertise.</p></div><span class=\"fig\">Fig 0.1. How the ecosystem works</span><div class=\"flow4\" role=\"group\" aria-label=\"How the ecosystem works\"><div class=\"fnode ground\"><span class=\"fig\">The ground</span><h3>Grassroots initiatives and social problems</h3><p>Where the work starts</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">The bridge</span><h3>D3S Consultoria</h3><p>NGO, since 2024</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode key\"><span class=\"fig\">The solutions</span><h3>D3S Intelligence</h3><p>Social enterprise</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">The scale</span><h3>International</h3><p>Starting with GSW-STEM</p></div></div><div class=\"three explain\"><div><span class=\"fig\">The bridge</span><h3>D3S Consultoria, the link to the ground</h3><p>An NGO active since 2024 that works directly with the people who live social problems in Brazil. What it learns on the ground becomes research, training and the starting point of every tool we build.</p><a class=\"inl\" href=\"#/method\">See the method</a></div><div><span class=\"fig\">The enterprise</span><h3>D3S Intelligence, smart solutions</h3><p>A social enterprise that offers smart technology solutions to those problems. It builds on what the field and the network teach, and reinvests its profit in the mission.</p><a class=\"inl\" href=\"#/neuroanchor\">See the products</a></div><div><span class=\"fig\">The scale</span><h3>International, built to scale</h3><p>D3S Intelligence works across borders through initiatives. The first is GSW-STEM, a network of women in technology in seven countries: Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia. More will follow.</p><a class=\"inl\" href=\"#/international\">See International</a></div></div></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>35,000+</b><span>people reached through partner organizations</span></div><div class=\"stat\"><b>40+</b><span>professionals trained in data for social impact</span></div><div class=\"stat\"><b>2</b><span>international recognitions: Systers Pass It On and BRICS Young Innovators</span></div><div class=\"stat\"><b>7</b><span>countries in the GSW-STEM network</span></div></div><p class=\"names\"><b>Some organizations we worked with, in Brazil:</b> Abra\u00e7o Campe\u00e3o (youth education, Rio de Janeiro), ELO (youth inclusion, Curitiba), Engajamundo (climate justice), Reprograma (women in tech), and others.</p></div></section><section class=\"sec alt\" id=\"home-products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Products built on field expertise</h2><p class=\"lede\">Each starts from a problem we worked on by hand in the field, and turns that practice into something repeatable.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Product 1</span><div class=\"status\"><i></i>Live in beta on Android and iOS</div><h3>NeuroAnchor</h3><p class=\"one\">To bring you back when hyperfocus takes over.</p><p class=\"desc\">For minds that disappear into what they love. A gentle, unexpected nudge to eat, drink, move and reconnect, without breaking your focus. Free to start, Premium in progress.</p><div class=\"prod-viz\"><div class=\"phone\" data-slot=\"NA\" aria-label=\"NeuroAnchor screens, illustrative\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, now</small>It has been a while. Have you had some water?</div></div><div class=\"chk\">How are you doing?</div><div class=\"chk-grid\"><span>Had water</span><span>Ate</span><span>Stretched</span><span>Talked to someone</span></div><div class=\"chk-note\">No pressure. Not now is always fine.</div></div></div><ul class=\"facts\"><li><span>For</span><b>Neurodivergent and anxious people</b></li><li><span>Privacy</span><b>No ads, no data sales</b></li><li><span>Plans</span><b>Free now, Premium in progress</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Device%20%28Android%20or%20iOS%29%3A%0AName%3A\">Download for free</a><a class=\"btn btn-line\" href=\"#/neuroanchor\">Learn more</a></div></article><article class=\"prod\"><span class=\"fig\">Product 2</span><div class=\"status pilot\"><i></i>Pilot: organizations wanted</div><h3>GroundCommons</h3><p class=\"one\">A free platform for grassroots organizations to organize the data they already have.</p><div class=\"prod-viz fill gcfig\" data-slot=\"GC\"><svg viewBox=\"0 0 240 150\" width=\"100%\" height=\"150\" aria-hidden=\"true\" class=\"cmn\"><g stroke=\"#DCD8E4\" stroke-width=\"1.5\"><line x1=\"120\" y1=\"75\" x2=\"40\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"14\"/><line x1=\"120\" y1=\"75\" x2=\"200\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"210\" y2=\"95\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"136\"/><line x1=\"120\" y1=\"75\" x2=\"30\" y2=\"100\"/></g><g fill=\"#FFFFFF\" stroke=\"#865CA3\" stroke-width=\"2\"><circle cx=\"40\" cy=\"30\" r=\"9\"/><circle cx=\"120\" cy=\"14\" r=\"9\"/><circle cx=\"200\" cy=\"30\" r=\"9\"/><circle cx=\"210\" cy=\"95\" r=\"9\"/><circle cx=\"120\" cy=\"136\" r=\"9\"/><circle cx=\"30\" cy=\"100\" r=\"9\"/></g><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#865CA3\"/></svg></div><ul class=\"facts\"><li><span>For</span><b>Grassroots organizations with disaggregated data</b></li><li><span>You get</span><b>Free access to the platform</b></li><li><span>Pilot</span><b>Organizations wanted</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/groundcommons\">Join the pilot</a></div></article></div><p class=\"note-draft\">More products are in development.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>What stands behind the products</h2><p class=\"lede\">Expertise built in the field, a reputation recognized abroad, and a network that already crosses borders.</p></div><div class=\"trio\"><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Fieldwork in a Rio de Janeiro favela community\"><span class=\"slot\">F1</span><figcaption>Fieldwork in a Rio de Janeiro favela community</figcaption></figure><span class=\"fig\">Method</span><h3>Built from the inside</h3><ul class=\"plain\"><li>A team that has worked with favela, Indigenous and Quilombola communities, and with victims of rights violations</li><li>Tools built with the people they serve</li><li>Experience inside the governments of S\u00e3o Paulo, Brazil's largest city and state</li></ul><a class=\"inl\" href=\"#/method\">See the method</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Award event, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Award event, Systers Pass It On</figcaption></figure><span class=\"fig\">Reputation</span><h3>Recognized abroad</h3><ul class=\"plain\"><li>Systers Pass It On Award 2024, from AnitaB.org, the global community for women in computing</li><li>BRICS Young Innovators recognition</li><li>Founder holds a seat on the Interministerial Working Group on Indicators of S\u00e3o Paulo, Brazil's largest city</li></ul><a class=\"inl\" href=\"#/about\">See our story</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delegation to China\"><span class=\"slot\">F5</span><figcaption>Delegation to China</figcaption></figure><span class=\"fig\">Reach</span><h3>Built to scale across borders</h3><ul class=\"plain\"><li>GSW-STEM, our first initiative: Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia</li><li>Meetings convened across regions</li><li>Now building new links in China</li></ul><a class=\"inl\" href=\"#/international\">See our international work</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>Profit goes back to the mission</h2><p class=\"lede\" style=\"margin-top:16px\">D3S Intelligence reinvests its profit in the research and training of D3S Consultoria and in the GSW-STEM network, so the expertise behind the products keeps growing.</p></div><div class=\"links\" style=\"margin-top:0\"><a class=\"btn btn-line\" href=\"#/about\">See how it is funded</a></div></div></section><section class=\"ink contact\" id=\"contact\"><div class=\"wrap\"><h2>Partner with us</h2><div class=\"paths\"><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Funders%20and%20foundations\"><b>Funders and foundations</b><span>Fund research, or sponsor access to our tools for the organizations you support.</span><em>Start a conversation</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Government%20and%20municipalities\"><b>Governments and municipalities</b><span>Evidence, indicators and risk-mapping tools for public policy.</span><em>Talk to us</em></a><a href=\"#/groundcommons\"><b>NGOs and institutes</b><span>Join the GroundCommons pilot with your organization's data.</span><em>Apply to the pilot</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Companies%20and%20partners\"><b>Companies and partners</b><span>Impact measurement, research and partnerships in Brazil and the Global South.</span><em>Partner with us</em></a></div></div></section></div><div class=\"view\" data-view=\"about\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Two years of work, and what comes next.</h1><p class=\"lede\">D3S Consultoria began in 2024 as a volunteer-led NGO helping organizations use data well. Today D3S Intelligence, a social enterprise and think tank, brings that expertise together with the GSW-STEM network and a set of products.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Award event, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Award event, Systers Pass It On</figcaption></figure></div></section><section class=\"sec\" id=\"people\"><div class=\"wrap\"><div class=\"s-head\"><h2>Our people</h2><p class=\"lede\">A leadership team that works across three institutions. Each one has its own structure.</p></div><span class=\"fig\">Leadership</span><div class=\"leads\"><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T1\" role=\"img\" aria-label=\"Phirtia Silva\">PS</span><div class=\"lead-b\"><h3>Phirtia Silva</h3><p class=\"role\">Founder and CEO</p><p class=\"bio\">A data scientist who began as a social scientist, and that blend drives D3S. She has done ethnographic fieldwork in favelas and refugee communities, and built the machine learning and geospatial systems that turn such evidence into policy: an integrated analytics system covering five public services and over a million attendances a month for S\u00e3o Paulo's city government, and a published model of femicide risk across Brazilian municipalities. She built NeuroAnchor herself, is a BRICS Young Innovator and a Systers Pass It On awardee, and is completing an MPA at the London School of Economics.</p></div></article><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T2\" role=\"img\" aria-label=\"Thayna Mesquita\">TM</span><div class=\"lead-b\"><h3>Thayna Mesquita</h3><p class=\"role\">Partnerships Director</p><p class=\"bio\">Our bridge to the public sector. For more than six years she has worked inside S\u00e3o Paulo's public sector, today at the State Secretariat of Culture, monitoring indicators and the physical and financial execution of cultural programs, and before that on the financial accountability of a municipal tax-incentive law. She works daily inside the mechanism through which public funds are allocated, monitored and accounted for, and has sat on evaluation committees for public cultural funding calls. That gives us a direct line of sight into how public funders judge and fund civil-society work. A social scientist from USP, she leads partnerships, project design and fundraising at D3S.</p></div></article><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T3\" role=\"img\" aria-label=\"Amanda Raquel\">AR</span><div class=\"lead-b\"><h3>Amanda Raquel</h3><p class=\"role\">Director of Qualitative Research</p><p class=\"bio\">A social anthropologist with a PhD, a best-thesis award and more than ten years of ethnographic and applied research on race, gender, sexuality, health and aging. Her authority is earned in the field: six years as a community health worker in primary public healthcare, fieldwork with Indigenous and Quilombola communities, and long involvement in Black women's collectives and movements. She is a visiting researcher at INAH-UNAM in Mexico and a fellow of Harvard's ALARI. She is why our tools read lived experience the way a trained researcher does, not as text to be summarized.</p></div></article></div><span class=\"fig\" style=\"margin-top:56px\">How we are organized</span><div class=\"board\"><article class=\"org int\"><span class=\"kind\">Social enterprise</span><h3>D3S Intelligence</h3><p class=\"d\">Builds and sells the products, and reinvests its profit in the mission.</p><ul class=\"rail\"><li><b>CEO</b></li><li class=\"sub\"><b>Partnerships Director</b></li><li class=\"sub\"><b>Director of Qualitative Research</b></li><li class=\"sub\"><b>Director of Quantitative Research</b></li><li class=\"sub\"><b>Tech Lead</b></li></ul></article><article class=\"org ngo\"><span class=\"kind\">NGO</span><h3>D3S Consultoria</h3><p class=\"d\">Research, training and programs with civil society.</p><ul class=\"rail\"><li><b>President</b></li><li><b>Directors</b></li><li><b>Volunteers</b><small>About 20 collaborators across the board and the scientific-empowerment program.</small></li></ul></article><article class=\"org gsw\"><span class=\"kind\">International</span><h3>International</h3><p class=\"d\">Initiatives that take our approach across borders.</p><ul class=\"rail\"><li><b>GSW-STEM</b><small>Today's main initiative: women founders and members in seven countries.</small></li><li><b>Future initiatives</b><small>Built on the same platform, method and standards.</small></li></ul></article></div></div></section><section class=\"sec alt\" id=\"story\"><div class=\"wrap\"><div class=\"s-head\"><h2>Our story</h2></div><div class=\"htl\" id=\"htl\" tabindex=\"0\" aria-label=\"Timeline. Scroll sideways.\"><ol class=\"htl-track\"><li class=\"htl-item\"><small class=\"when\">2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>D3S Consultoria begins as a volunteer-led NGO</b><span class=\"dsc\">Qualified data for NGOs, and space for women, trans and non-binary people in data and technology.</span></li><li class=\"htl-item\"><small class=\"when\">2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>First consulting cycle</b><span class=\"dsc\">Five organizations selected, with more than 40 days of work to produce a complex analytical product.</span></li><li class=\"htl-item\"><small class=\"when\">August 2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>First analytical product delivered</b><span class=\"dsc\">Presented in person to Abra\u00e7o Campe\u00e3o, a youth organization in the Complexo do Alem\u00e3o, one of Rio de Janeiro's largest favela complexes.</span></li><li class=\"htl-item\"><small class=\"when\">August 2024</small><span class=\"itag ngo\">D3S Consultoria</span><b>Systers Pass It On Award</b><span class=\"dsc\">One of the winners, recognized by AnitaB.org, the global community for women in computing, for building community for women in STEM.</span></li><li class=\"htl-item\"><small class=\"when\">2025</small><span class=\"itag ngo\">D3S Consultoria</span><b>BRICS Young Innovators</b><span class=\"dsc\">The founder is named a BRICS Young Innovator.</span></li><li class=\"htl-item\"><span class=\"itag ngo\">D3S Consultoria</span><b>Training cycles and volunteer program</b><span class=\"dsc\">Four training cycles for NGO professionals, and a volunteer program with calls twice a year.</span></li><li class=\"htl-item\"><small class=\"when\">2026</small><span class=\"itag gsw\">GSW-STEM</span><b>GSW-STEM launched</b><span class=\"dsc\">A network of women in technology across Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia, launched by the founder of D3S Consultoria.</span></li><li class=\"htl-item\"><span class=\"itag gsw\">GSW-STEM</span><b>Building links in China</b><span class=\"dsc\">Delegation to build a network that fosters technology cooperation.</span></li><li class=\"htl-item\"><small class=\"when\">2026</small><span class=\"itag int\">D3S Intelligence</span><b>D3S Intelligence launches</b><span class=\"dsc\">A social enterprise and think tank. Its products build on the NGO's expertise, and its profit funds the mission.</span></li></ol></div><div class=\"htl-nav\"><button type=\"button\" data-htl=\"-1\" aria-label=\"Previous\"><svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" aria-hidden=\"true\"><path d=\"M14 6H2M7 1L2 6l5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button><button type=\"button\" data-htl=\"1\" aria-label=\"Next\"><svg width=\"16\" height=\"12\" viewBox=\"0 0 16 12\" aria-hidden=\"true\"><path d=\"M2 6h12M9 1l5 5-5 5\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>How it is funded</h2><p class=\"lede\">The social enterprise earns revenue. The mission spends it.</p></div><div class=\"flow\"><div class=\"blk\"><span class=\"fig\">What we sell</span><h3>Products and services</h3><ul class=\"plain\"><li>GroundCommons, data tools for grassroots organizations</li><li>NeuroAnchor, wellbeing technology</li><li>Analytical consulting</li></ul></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk key\"><span class=\"fig\">What we do with it</span><h3>Reinvest in the mission</h3><p>Profit goes back into research, training and the network.</p><p class=\"ph pledge draft\">Share reinvested and annual report: to be defined by D3S Intelligence.</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"40\" height=\"24\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"blk\"><span class=\"fig\">What it pays for</span><h3>Research, training and the network</h3><ul class=\"plain\"><li>Analytical support for NGOs, through D3S Consultoria</li><li>Training and a volunteer program in data and tech</li><li>International partnerships, through GSW-STEM</li></ul></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>What we are here to do</h2><p class=\"lede\">The statute of D3S Consultoria sets twelve objectives. These are the four themes they share.</p></div><div class=\"four mission\"><div><h3>Evidence</h3><ul class=\"plain\"><li>Analytical, impact and applied research for organizations aligned with social development</li><li>Models and indicators to prevent violence and protect rights</li></ul></div><div><h3>Programs and policy</h3><ul class=\"plain\"><li>Improve social development programs with Brazilian and international NGOs</li><li>Improve public policy that protects vulnerable people and minorities</li><li>Reduce inequality, protect children, advance gender and racial justice</li></ul></div><div><h3>Technology and inclusion</h3><ul class=\"plain\"><li>Wider access to knowledge and technology</li><li>Technology programs for socioeconomic development</li><li>Include more women in STEM</li></ul></div><div><h3>Talent, voice and funding</h3><ul class=\"plain\"><li>Train people working in social impact</li><li>Public debate and advocacy to include the third sector in technology</li><li>Raise funds to reinvest in social and technological development</li></ul></div></div></div></section></div><div class=\"view\" data-view=\"method\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Social technology, built from the inside.</h1><p class=\"lede\">We do not study social problems from a distance. Our team works with the people who live them, and builds the tools that advance their lives and strengthen the institutions that protect and develop them.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"M1\" role=\"img\" aria-label=\"Our team at work, in the field\"><span class=\"slot\">M1</span><figcaption>Our team at work, in the field</figcaption></figure></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>5</b><span>organizations in the first consulting cycle, with more than 40 days of work</span></div><div class=\"stat\"><b>40+</b><span>professionals trained in four cycles</span></div><div class=\"stat\"><b>35,000+</b><span>people reached through partner organizations</span></div><div class=\"stat\"><b>2 years</b><span>of work with civil society, since 2024</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>We live the problem, so we build for it.</h2></div><div><p class=\"lede\">Most tools for social problems are designed far from the people they are meant to serve. They look right on paper and fail in daily life.</p><p class=\"lede\" style=\"margin-top:16px\">We start where the problem lives. Our team has worked directly with communities, with people in situations of vulnerability and with the institutions meant to protect them. Every tool we build carries that experience.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Where our team has worked, from the inside</h2></div><div class=\"four places\"><div><h3>Favelas and urban peripheries</h3><p>Community diagnostics, territorial research and daily work with families, in Rio de Janeiro, Natal and S\u00e3o Paulo.</p></div><div><h3>Indigenous and Quilombola communities</h3><p>Fieldwork on territory and identity, and research on how public education reaches these communities.</p></div><div><h3>Rights and public protection</h3><p>Fieldwork in public services with victims of rights violations, a research paper on a predictive model to prevent violence against women, and research on the prison system.</p></div><div><h3>Migrants and refugees</h3><p>Ethnographic research on refugee arrivals, and activities with immigrants and refugees.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Two kinds of tools, one approach</h2><p class=\"lede\">Everything we build either advances people's lives directly, or strengthens the institutions that protect and develop them.</p></div><div class=\"board two2\"><article class=\"org ngo\"><span class=\"kind\">For people</span><h3>NeuroAnchor</h3><p class=\"d\">Built from lived experience. A companion that helps people live well with hyperfocus, anxiety and neurodivergence.</p><a class=\"inl\" href=\"#/neuroanchor\">See NeuroAnchor</a></article><article class=\"org int\"><span class=\"kind\">For institutions</span><h3>GroundCommons</h3><p class=\"d\">A free platform that helps grassroots organizations organize the data they already have, so their protection and development work can be seen and strengthened.</p><a class=\"inl\" href=\"#/groundcommons\">See GroundCommons</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>One method, built to repeat</h2></div><div class=\"four\"><div><span class=\"stepn\">Step 1</span><h3>Live it and listen</h3><p>Fieldwork, interviews and daily work alongside the people who face the problem.</p></div><div><span class=\"stepn\">Step 2</span><h3>Build with the people</h3><p>Tools are designed and tested with them, not delivered to them.</p></div><div><span class=\"stepn\">Step 3</span><h3>Strengthen the institutions</h3><p>Training, a volunteer program and partnerships, so protection and development institutions can carry the work.</p></div><div><span class=\"stepn\">Step 4</span><h3>Scale across borders</h3><p>Through international initiatives led by local partners, starting with GSW-STEM.</p></div></div><p style=\"margin-top:22px\"><a class=\"inl\" href=\"#/international\">See International</a></p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Programs that keep us on the ground</h2><p class=\"lede\">Programs of our NGO, D3S Consultoria. Each one is also where our tools learn.</p></div><div class=\"progs\"><article class=\"prog\"><div><span class=\"fig\">Program 1</span><h3>Community diagnostics with organizations</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F1\" role=\"img\" aria-label=\"Delivery to a youth organization in Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Delivery to a youth organization in Rio de Janeiro</figcaption></figure></div><div><p>We work with each organization to understand its community from the inside, and produce a diagnostic it can use with funders and partners.</p><ul class=\"facts\"><li><span>Diagnostics</span><b>Territorial and impact</b></li><li><span>Support</span><b>Data treatment, analysis, methods</b></li><li><span>First cycle</span><b>Five organizations</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Program 2</span><h3>Training for NGO professionals</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F6\" role=\"img\" aria-label=\"Training session for NGO professionals\"><span class=\"slot\">F6</span><figcaption>Training session for NGO professionals</figcaption></figure></div><div><p>Four training cycles with professionals from non-governmental organizations.</p><ul class=\"facts\"><li><span>Cycle topics</span><b>Territorial diagnosis tools</b></li><li><span></span><b>Quantitative and qualitative data to measure impact</b></li><li><span></span><b>Data for strategic decisions</b></li><li><span></span><b>Program monitoring and evaluation</b></li></ul></div></article><article class=\"prog\"><div><span class=\"fig\">Program 3</span><h3>Socioeducational volunteer program</h3><figure class=\"photo inprog\" style=\"--r:16/10\" data-slot=\"F3\" role=\"img\" aria-label=\"Volunteer project\"><span class=\"slot\">F3</span><figcaption>Volunteer project</figcaption></figure></div><div><p>Technical and scientific empowerment for women, trans and non-binary professionals in data and technology, through real project work.</p><ul class=\"facts\"><li><span>You get</span><b>Certificates, training, networking</b></li><li><span>Hands-on</span><b>Work on D3S Consultoria projects</b></li><li><span>Calls</span><b>Twice a year, next call coming soon</b></li></ul></div></article></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Some organizations we worked with</h2><p class=\"lede\">Descriptions are the organizations' own work, as shown on the D3S Consultoria site.</p></div><div class=\"partners\"><div><h3>Abra\u00e7o Campe\u00e3o</h3><p>A youth organization in the Complexo do Alem\u00e3o, a large favela complex in Rio de Janeiro. For nearly ten years it has worked with children and young people through martial arts, education and personal development. D3S Consultoria delivered profile, territorial and student-segmentation analysis.</p></div><div><h3>ELO Apoio Socioambiental</h3><p>More than ten years working with young people in vulnerable situations, in education and productive inclusion, in Curitiba in southern Brazil. It reports reaching over 20,000 people.</p></div><div><h3>Engajamundo</h3><p>A national organization with eleven years of work and 24 territories of action, including the Alto Xingu in the Amazon region. It raises awareness among young Brazilians on climate and socio-environmental justice.</p></div><div><h3>Reprograma</h3><p>A pioneer in STEM education in Brazil since 2016, closing the gender and race gap in technology by training women in vulnerable situations, especially Black and trans women.</p></div></div><p class=\"note-plain\">Also: Instituto Semeia and Abra\u00e7o Cultural.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>From the news</h2></div><ul class=\"init\"><li><h3>D3S Consultoria wins its first international award</h3><p>One of the winners of the Systers Pass It On Award 2024, by AnitaB.org, the global community for women in computing.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/a-d3s-consultoria-ganha-primeiro-pr%C3%AAmio-internacional\" rel=\"noopener\">15 Aug 2024</a></li><li><h3>D3S Consultoria takes its first report to Rio de Janeiro</h3><p>The first analytical product, delivered in person to a youth organization in the Complexo do Alem\u00e3o favela complex.</p><a class=\"where\" href=\"https://www.d3sconsultoria.com.br/post/d3s-consultoria-vai-at%C3%A9-o-complexo-do-alem%C3%A3o\" rel=\"noopener\">15 Aug 2024</a></li></ul></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Bring us a problem that needs a tool</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Consulting\">Talk to us</a><a class=\"btn btn-ghost\" href=\"#/neuroanchor\">See the products</a></div></div></section></div><div class=\"view\" data-view=\"neuroanchor\"><section class=\"ink hero hero-product\"><div class=\"wrap hero-split\"><div><label class=\"psel\">Product<select aria-label=\"Choose a product\"><option value=\"neuroanchor\" selected>NeuroAnchor</option><option value=\"teams\">NeuroAnchor for Teams</option><option value=\"groundcommons\">GroundCommons</option></select></label><div class=\"status\"><i></i>Free beta on Android and iOS. Premium in progress.</div><h1>NeuroAnchor</h1><p class=\"tagline\">To bring you back when hyperfocus takes over.</p><p class=\"lede\">Hyperfocus is a superpower until you look up and the day is gone: no lunch, no water, no one you spoke to. NeuroAnchor is the gentle interruption built for ADHD, autistic and anxious minds. It pulls you back to your body and the people around you, without shame and without breaking the focus that makes you good at what you do.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Device%20%28Android%20or%20iOS%29%3A%0AName%3A\">Download for free</a><a class=\"btn btn-ghost\" href=\"#/teams\">For companies</a></div><p class=\"fnote\">The free version is the simplest version of NeuroAnchor.</p></div><div><div class=\"phone\" data-slot=\"NA\" aria-label=\"NeuroAnchor screens, illustrative\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, now</small>It has been a while. Have you had some water?</div></div><div class=\"chk\">How are you doing?</div><div class=\"chk-grid\"><span>Had water</span><span>Ate</span><span>Stretched</span><span>Talked to someone</span></div><div class=\"chk-note\">No pressure. Not now is always fine.</div></div></div></div></section><section class=\"cobar\"><div class=\"wrap cobar-in\"><div><b>Bringing NeuroAnchor to a company?</b><span>Team subscriptions for companies of 10 to 100 people. Read the business case.</span></div><a class=\"btn btn-brand\" href=\"#/teams\">NeuroAnchor for Teams</a></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats s3\"><div class=\"stat\"><b>About 1 in 5</b><span>people is neurodivergent.</span></div><div class=\"stat\"><b>~50%</b><span>of employed neurodivergent adults report burnout (Willis Towers Watson, 2022).</span></div><div class=\"stat\"><b>0</b><span>ads, and no data sold, ever. The only business model is subscriptions.</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>From the inside, it does not look like a problem.</h2><p class=\"pullq\">It looks like missing dinner, again, without noticing the day had ended.</p></div><div><p class=\"lede\">Deep focus is a strength. For many neurodivergent and anxious people it also has a hidden cost: hours pass unnoticed, meals are skipped, messages go unanswered and the body's signals are ignored.</p><p class=\"lede\" style=\"margin-top:16px\">Over time that becomes burnout and strained relationships. About one in five people is neurodivergent, so this is an everyday reality for millions. Most tools ask you to remember to use them. This one remembers for you, gently.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>How it works</h2></div><span class=\"stag free\">Free today</span><div class=\"three\"><div><span class=\"stepn\">Step 1</span><h3>You set your windows</h3><p>Choose the times of day when NeuroAnchor may reach you. Outside them, it stays quiet.</p></div><div><span class=\"stepn\">Step 2</span><h3>A gentle nudge arrives</h3><p>At an unexpected moment, a friendly message appears: \"It has been a while. Have you had some water?\" No alarms, no guilt.</p></div><div><span class=\"stepn\">Step 3</span><h3>You check in and carry on</h3><p>Tap the notification to open a simple check-in: had water, ate, stretched, talked to someone, or not now. Then go back to what you were doing.</p></div></div><span class=\"stag prog\" style=\"margin-top:36px\">Premium, in progress</span><div class=\"three\"><div><span class=\"stepn\">Premium 1</span><h3>Tell it how you work</h3><p>A short Focus Profile sets your nudge timing, tone and priority habits, so NeuroAnchor fits you from day one.</p></div><div><span class=\"stepn\">Premium 2</span><h3>Habits that fit your life</h3><p>Unlimited custom habits, streaks, and a separate schedule for each habit.</p></div><div><span class=\"stepn\">Premium 3</span><h3>It learns what helps</h3><p>Start a focus session (\"check on me in an hour\") and answer a quick \"Did this help?\" NeuroAnchor tunes itself to you.</p></div></div><p class=\"who-note\" style=\"margin-top:20px\">Free stays genuinely useful. Paid plans add depth, they never remove what already works.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>Who it is for</h2></div><div class=\"three\"><div><h3>People who live with hyperfocus</h3><p>People managing ADHD, autism or anxiety day to day, who want a gentle, personal tool that they choose and control.</p></div><div><h3>Professionals and freelancers</h3><p>Knowledge workers who disappear into their work, and want the basics to keep up.</p></div><div><h3>Teams and companies</h3><p>Companies of 10 to 100 people that want their deepest workers to keep delivering.</p><a class=\"inl\" href=\"#/teams\">NeuroAnchor for Teams</a></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Built on trust</h2><p class=\"lede\">NeuroAnchor was built from lived experience, not from a market study.</p></div><div class=\"three\"><div><h3>No ads, no data sales</h3><p>The only way NeuroAnchor earns money is subscriptions. Your data is never the product.</p></div><div><h3>You are in control</h3><p>You choose when nudges can appear, and you can switch them off at any time.</p></div><div><h3>Gentle by design</h3><p>Nudges are friendly, never alarms. A soft first message, then a kinder follow-up if you miss it.</p></div></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Try it for free</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Tell us your device, Android or iOS, and we will send you the beta link.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Device%20%28Android%20or%20iOS%29%3A%0AName%3A\">Download for free</a><a class=\"btn btn-ghost\" href=\"#/teams\">For companies</a></div></div></section></div><div class=\"view\" data-view=\"teams\"><section class=\"ink hero hero-product\"><div class=\"wrap\"><label class=\"psel\">Product<select aria-label=\"Choose a product\"><option value=\"neuroanchor\">NeuroAnchor</option><option value=\"teams\" selected>NeuroAnchor for Teams</option><option value=\"groundcommons\">GroundCommons</option></select></label><div class=\"status\"><i></i>Team subscriptions for companies of 10 to 100 people</div><h1 style=\"max-width:16ch\">NeuroAnchor for Teams</h1><p class=\"tagline\" style=\"max-width:34ch\">Protect the attention your company runs on.</p><p class=\"lede\">Your deepest workers are the most exposed to crashes, missed handoffs and misread silences. NeuroAnchor keeps deep focus sustainable on each person's own phone, with nothing for you to administer.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20for%20Teams&amp;body=Company%3A%0ANumber%20of%20employees%3A%0AYour%20role%3A\">Talk to us about a team subscription</a></div><p class=\"fnote\">For companies of 10 to 100 people.</p></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats s3\"><div class=\"stat\"><b>About 1 in 5</b><span>people is neurodivergent, so most teams already include several.</span></div><div class=\"stat\"><b>~50%</b><span>of employed neurodivergent adults report burnout (Willis Towers Watson, 2022).</span></div><div class=\"stat\"><b>89%</b><span>of burnout's cost to employers is estimated to come from presenteeism: people at work, but not at their best (American Journal of Preventive Medicine, 2025).</span></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Your best people run on attention</h2></div><div><p class=\"lede\">Every deliverable, handoff and decision depends on one input: the focused attention of the person doing the work. The people who give you the deepest work are often the ones who disappear into it.</p><p class=\"lede\" style=\"margin-top:16px\">That is when the cost starts, and it rarely shows up as a line item. It shows up as a missed meeting, a late reply read as indifference, a handoff that slips, a conflict that never needed to happen and, months later, a resignation. By the time it is visible, it is expensive.</p><p class=\"lede lede-strong\" style=\"margin-top:16px\">NeuroAnchor catches the small lapses before they become those outcomes. It interrupts the tunnel gently, on each person's terms, so the same people keep delivering at depth, week after week, without the crash.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Where it pays back</h2></div><div class=\"four reasons\"><div><h3>Delivery that holds</h3><p>The people who produce your deepest work stay at it week after week. Fewer crash days, fewer missed handoffs, no quiet decline.</p></div><div><h3>Fewer misreads, fewer conflicts</h3><p>A skipped meeting or a late reply is easy to read as disengagement. Most of the time it is someone deep in a task. Fewer lapses mean fewer misunderstandings between colleagues, and with managers.</p></div><div><h3>People who stay</h3><p>Neurodivergent adults face unemployment about 40% higher than their peers, so this is a large talent pool that many companies fail to reach or keep. Discreet, practical support helps you hire them and keep them.</p></div><div><h3>Support with nothing to run</h3><p>No diagnosis, no paperwork, no case manager, no program to administer. It lives on each person's phone, and people opt in privately. Your cost is the subscription, not the overhead.</p></div></div><div class=\"pricebox\" style=\"margin-top:28px\"><span class=\"stag prog\">Coming</span><p>An anonymized team view, with a minimum group size, that shows when workload patterns are becoming unsustainable, before they turn into absence or resignations.</p></div></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>How a team subscription works</h2></div><div class=\"three\"><div><span class=\"stepn\">Step 1</span><h3>Choose your team size</h3><p>Subscriptions are for companies of 10 to 100 people, priced per employee per month.</p></div><div><span class=\"stepn\">Step 2</span><h3>Invite your people</h3><p>Each person installs NeuroAnchor and opts in on their own, privately.</p></div><div><span class=\"stepn\">Step 3</span><h3>Everyone gets the full product</h3><p>Every employee gets NeuroAnchor Premium as it launches, including the Focus Profile that tunes nudges to them.</p></div></div><div class=\"pricebox\"><h3>Priced to fit an existing budget</h3><p>Companies already spend about $1 to $5 per employee per month on employee assistance programs. A NeuroAnchor team subscription is designed to fit inside that same budget line, with volume pricing from 10 to 100 people.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>What your people keep</h2></div><div class=\"three\"><div><h3>No individual data for the company</h3><p>Companies only ever see aggregated, anonymized trends. Never one person's answers.</p></div><div><h3>Always by choice</h3><p>Nobody is enrolled by their employer. Each person chooses to join and can leave at any time.</p></div><div><h3>No ads, no data sales</h3><p>The only way NeuroAnchor earns money is subscriptions.</p></div></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Bring NeuroAnchor to your team</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Tell us your company size and we will come back with next steps.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20for%20Teams&amp;body=Company%3A%0ANumber%20of%20employees%3A%0AYour%20role%3A\">Talk to us about a team subscription</a></div></div></section></div><div class=\"view\" data-view=\"groundcommons\"><section class=\"ink hero hero-product\"><div class=\"wrap hero-split\"><div><label class=\"psel\">Product<select aria-label=\"Choose a product\"><option value=\"neuroanchor\">NeuroAnchor</option><option value=\"teams\">NeuroAnchor for Teams</option><option value=\"groundcommons\" selected>GroundCommons</option></select></label><div class=\"status pilot\"><i></i>Pilot: organizations wanted</div><h1>GroundCommons</h1><p class=\"tagline\">A free platform to organize the data your organization already has.</p><p class=\"lede\">We are building GroundCommons together with grassroots organizations. Join the pilot.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=GroundCommons%20pilot&amp;body=Organization%3A%0ACountry%3A%0AWhat%20data%20do%20you%20hold%20%28period%2C%20level%20of%20detail%29%3F%0AContact%20person%3A\">Apply to the pilot</a></div></div><figure class=\"gcfig\" data-slot=\"GC\" role=\"img\" aria-label=\"GroundCommons\"><svg viewBox=\"0 0 240 150\" width=\"100%\" height=\"150\" aria-hidden=\"true\" class=\"cmn\"><g stroke=\"#4A3E63\" stroke-width=\"1.5\"><line x1=\"120\" y1=\"75\" x2=\"40\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"14\"/><line x1=\"120\" y1=\"75\" x2=\"200\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"210\" y2=\"95\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"136\"/><line x1=\"120\" y1=\"75\" x2=\"30\" y2=\"100\"/></g><g fill=\"#261E33\" stroke=\"#C9A3E6\" stroke-width=\"2\"><circle cx=\"40\" cy=\"30\" r=\"9\"/><circle cx=\"120\" cy=\"14\" r=\"9\"/><circle cx=\"200\" cy=\"30\" r=\"9\"/><circle cx=\"210\" cy=\"95\" r=\"9\"/><circle cx=\"120\" cy=\"136\" r=\"9\"/><circle cx=\"30\" cy=\"100\" r=\"9\"/></g><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#C9A3E6\"/></svg></figure></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>What is GroundCommons?</h2></div><div><p class=\"lede\">Grassroots organizations collect valuable information about the communities they serve: forms, spreadsheets, registries, notes. Most of it stays scattered, which makes it hard to find answers, compare years or show results.</p><p class=\"lede\" style=\"margin-top:16px\">GroundCommons helps you organize that data in one place. As more organizations join, it also builds a common way of organizing grassroots data.</p></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>How the pilot works</h2></div><div class=\"three\"><div><span class=\"stepn\">Step 1</span><h3>You tell us about your data</h3><p>What you collect, and how it is broken down by groups, such as gender, race, age or territory.</p></div><div><span class=\"stepn\">Step 2</span><h3>We work on its structure together</h3><p>How your data is organized and defined. We use this to design the commons.</p></div><div><span class=\"stepn\">Step 3</span><h3>You use the platform for free</h3><p>In exchange for working with us, your organization gets free access to GroundCommons.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>Is it for you?</h2></div><div><ul class=\"checklist\"><li>You collect data about the people or communities you serve.</li><li>Your data is broken down by groups, such as gender, race, age or territory.</li><li>You want one place to organize it.</li><li>You can spend some time working with us.</li></ul><p class=\"who-note\" style=\"margin-top:24px\">We start with the structure of your data and aggregated numbers, not the personal information of the people you serve. Terms and data protection are agreed in writing before we start.</p></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Want to be part of the pilot?</h2><p class=\"lede\" style=\"color:var(--ink-muted);margin-top:16px;max-width:60ch\">Write to us with a short description of your organization and the data you hold.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=GroundCommons%20pilot&amp;body=Organization%3A%0ACountry%3A%0AWhat%20data%20do%20you%20hold%20%28period%2C%20level%20of%20detail%29%3F%0AContact%20person%3A\">Apply to the pilot</a></div></div></section></div><div class=\"view\" data-view=\"international\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Built to expand and scale.</h1><p class=\"lede\">D3S Intelligence works internationally through initiatives. Today GSW-STEM is the main one. More will follow, on the same platform, method and standards, led by local partners.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"N1\" role=\"img\" aria-label=\"GSW-STEM network meeting\"><span class=\"slot\">N1</span><figcaption>GSW-STEM network meeting</figcaption></figure></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>How we scale</h2></div><div class=\"three\"><div><h3>One platform</h3><p>Shared products, a shared method, and shared standards for ethics and data protection.</p></div><div><h3>Local leadership</h3><p>Each initiative is led by people who know the context: their language, their partners and their questions.</p></div><div><h3>Funded by the mission</h3><p>Reinvested profit from D3S Intelligence, not products sold abroad.</p></div></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Initiatives</h2><p class=\"lede\">Each initiative is its own community of people and organizations, built on the same foundation.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Initiative 1</span><div class=\"status\"><i></i>Today's main initiative</div><h3>GSW-STEM</h3><p class=\"one\">Global South Women in STEM</p><p class=\"desc\">A network of women in technology in seven countries: Brazil, Mexico, Uganda, Cameroon, South Africa, India and Ethiopia. Launched in 2026.</p><ul class=\"facts\"><li><span>For</span><b>Women in technology</b></li><li><span>Where</span><b>Seven countries</b></li><li><span>Join</span><b>Open to new members</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Join%20GSW-STEM\">Join GSW-STEM</a></div></article><article class=\"prod next\"><span class=\"fig\">Next</span><div class=\"status pilot\"><i></i>Open</div><h3>The next initiative</h3><p class=\"one\">In another field or region</p><p class=\"desc\">We are building the capacity to open more initiatives. If you want to build one with us, in another field or another part of the world, get in touch.</p><ul class=\"facts\"><li><span>For</span><b>Partners and founders</b></li><li><span>You bring</span><b>A local team and a shared mission</b></li><li><span>We bring</span><b>The platform, method and standards</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=International%20initiative\">Partner with us</a></div></article></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><span class=\"fig\">Initiative 1, launched in 2026</span><h2>Global South Women in STEM (GSW-STEM)</h2><p class=\"lede\" style=\"margin-top:16px\">A network of institutions and individuals working in and around technology: engineers, scientists, researchers, designers, entrepreneurs, educators and policymakers. It is a social enterprise network, where each member keeps her own organization and shares expertise, contacts and credibility.</p><div class=\"chips2\"><span class=\"chip2\">Brazil</span><span class=\"chip2\">Mexico</span><span class=\"chip2\">Uganda</span><span class=\"chip2\">Cameroon</span><span class=\"chip2\">South Africa</span><span class=\"chip2\">India</span><span class=\"chip2\">Ethiopia</span></div><div class=\"links\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=Join%20GSW-STEM\">Join GSW-STEM</a><a class=\"btn btn-line\" href=\"GSW-STEM-manifesto.pdf\" target=\"_blank\" rel=\"noopener\">Read the founding manifesto</a></div></div><div><span class=\"fig\">Fig 4.1. GSW-STEM today</span><svg class=\"net\" viewBox=\"0 0 440 340\" role=\"img\" aria-label=\"GSW-STEM network: Brazil at the center, linked to Mexico, Cameroon, Uganda, Ethiopia, South Africa and India, and a link being built to China\"><g><line x1=\"220\" y1=\"160\" x2=\"220\" y2=\"48\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"354\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"388\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"295\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"145\" y2=\"261\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"52\" y2=\"185\" stroke=\"var(--muted)\" stroke-width=\"1.5\"/><line x1=\"220\" y1=\"160\" x2=\"86\" y2=\"90\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"5 5\"/></g><g><circle cx=\"220\" cy=\"48\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"354\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"388\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"295\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"145\" cy=\"261\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"52\" cy=\"185\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--brand)\" stroke-width=\"2\"/><circle cx=\"86\" cy=\"90\" r=\"20\" fill=\"var(--surface)\" stroke=\"var(--muted)\" stroke-width=\"1.5\" stroke-dasharray=\"4 4\"/></g><circle cx=\"220\" cy=\"160\" r=\"44\" fill=\"var(--brand)\" opacity=\".16\"/><circle cx=\"220\" cy=\"160\" r=\"28\" fill=\"var(--brand)\"/><text x=\"220\" y=\"218\" text-anchor=\"middle\" class=\"t-strong\">Brazil</text><g text-anchor=\"middle\"><text x=\"220\" y=\"84\">Mexico</text><text x=\"354\" y=\"126\">Cameroon</text><text x=\"388\" y=\"221\">Uganda</text><text x=\"295\" y=\"297\">Ethiopia</text><text x=\"145\" y=\"297\">South Africa</text><text x=\"52\" y=\"221\">India</text><text x=\"86\" y=\"126\">China</text><text x=\"86\" y=\"140\" style=\"font-size:11px\">building</text></g></svg></div></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>What GSW-STEM believes</h2><p class=\"lede\">From the founding manifesto.</p></div><div class=\"svc\"><div><h3>Women as leaders</h3><p>Many women in the Global South are already trained and leading. We exist to put them where technological futures are decided.</p></div><div><h3>Shared problems</h3><p>A problem in Ethiopia may be the same one in Brazil or India. Connecting across borders, we build solutions and seek funding together.</p></div><div><h3>STEM beyond code</h3><p>Technology applied to agriculture, energy, health, biotechnology and business, not only programming and AI.</p></div><div><h3>Impact in real communities</h3><p>Every project names the community it serves and explains how it will reach them.</p></div><div><h3>Knowledge belongs to the Global South</h3><p>Projects leave public-domain knowledge that any organization can adapt and reuse.</p></div><div><h3>Sustainability and reciprocity</h3><p>The network earns, reinvests and grows, so it can pay its contributors and fund education for other women.</p></div></div></div></section><section class=\"sec\"><div class=\"wrap two\"><div><h2>How GSW-STEM starts</h2><p class=\"lede\" style=\"margin-top:16px\">We begin small and practical, and build through action.</p></div><ul class=\"check\" style=\"margin-top:0\"><li><b>Support funding applications.</b> We help members and trusted people outside the network prepare grant, startup and fellowship proposals.</li><li><b>Make our work visible.</b> We publish members' work, results and projects.</li><li><b>Run events.</b> Meetings and events that bring members and partners together.</li><li><b>Build partnerships</b> with universities, ministries and companies that offer funding, scholarships and training.</li></ul></div></section><section class=\"sec alt\"><div class=\"wrap\"><div class=\"s-head\"><h2>Events and delegations</h2><p class=\"lede\">Where the network meets, and where we build the next link.</p></div><div class=\"evts\"><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F4\" role=\"img\" aria-label=\"Network meeting\"><span class=\"slot\">F4</span><figcaption>Network meeting</figcaption></figure><div><h3>2nd meeting of the Global South Women in STEM Network</h3><p>A space for collaboration, leadership and collective action across regions.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delegation to China\"><span class=\"slot\">F5</span><figcaption>Delegation to China</figcaption></figure><div><h3>Building links in China</h3><p>Building a network to foster technology cooperation.</p></div></article><article class=\"evt\"><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E2\" role=\"img\" aria-label=\"BRICS Young Innovators\"><span class=\"slot\">E2</span><figcaption>BRICS Young Innovators</figcaption></figure><div><small class=\"when\">2025</small><h3>BRICS Young Innovators</h3><p>The founder of D3S Consultoria is a BRICS Young Innovator.</p></div></article></div></div></section><section class=\"ink contact\"><div class=\"wrap\"><h2>Build the next initiative with us</h2><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=International%20partnership\">Get in touch</a></div></div></section></div></main><footer><div class=\"wrap foot\"><div><div class=\"chip\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><span><b>D3S</b> Intelligence</span></div><div>Social technology, built from the field.</div></div><div><h4>D3S Intelligence</h4><ul><li><a href=\"#/neuroanchor\">NeuroAnchor</a></li><li><a href=\"#/teams\">NeuroAnchor for Teams</a></li><li><a href=\"#/groundcommons\">GroundCommons</a></li></ul></div><div><h4>Ecosystem</h4><ul><li><a href=\"#/method\">D3S Consultoria</a></li><li><a href=\"#/international\">International</a></li><li><a href=\"#/about\">About</a></li></ul></div><div><h4>Contact</h4><ul><li><a href=\"mailto:contato@d3sconsultoria.com.br\">contato@d3sconsultoria.com.br</a></li><li><a href=\"https://www.instagram.com/d3sconsultoria/\" rel=\"noopener\">Instagram</a></li><li>&copy; 2026 D3S</li></ul></div></div></footer>", "pt": "<header class=\"site-header\"><div class=\"wrap nav\"><a class=\"brand\" href=\"#/pt/\" aria-label=\"D3S Intelligence, in\u00edcio\"><img src=\"data:image/png;base64,@@LOGO@@\" alt=\"\"><div><b>D3S</b> <span>Intelligence</span></div></a><button class=\"menu-btn\" id=\"menuBtn\" aria-expanded=\"false\" aria-controls=\"navLinks\">Menu</button><nav class=\"nav-links\" id=\"navLinks\" aria-label=\"Principal\"><div class=\"dd\" id=\"dd\"><button type=\"button\" class=\"dd-btn\" id=\"ddBtn\" aria-haspopup=\"true\" aria-expanded=\"false\" data-route=\"neuroanchor teams groundcommons\">Produtos<svg width=\"10\" height=\"6\" viewBox=\"0 0 10 6\" aria-hidden=\"true\"><path d=\"M1 1l4 4 4-4\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/></svg></button><div class=\"dd-menu\" id=\"ddMenu\"><a href=\"#/pt/neuroanchor\" data-route=\"neuroanchor\">NeuroAnchor</a><a href=\"#/pt/teams\" data-route=\"teams\">NeuroAnchor para Equipes</a><a href=\"#/pt/groundcommons\" data-route=\"groundcommons\">GroundCommons</a></div></div><a href=\"#/pt/method\" data-route=\"method\">M\u00e9todo</a><a href=\"#/pt/international\" data-route=\"international\">Internacional</a><a href=\"#/pt/about\" data-route=\"about\">Sobre</a><a class=\"lang\" id=\"langSwitch\" href=\"#\" aria-label=\"English version\">EN</a><a href=\"#contact\" data-scroll=\"contact\" class=\"nav-cta\">Fa\u00e7a parceria conosco</a></nav></div></header><main><div class=\"view\" data-view=\"home\"><section class=\"ink hero hero-vision hero-with-photo\"><div class=\"wrap hero-split\"><div><h1>Construindo o futuro da tecnologia para o impacto social.</h1><p class=\"lede\">Um neg\u00f3cio social que constr\u00f3i tecnologia para o impacto social, do conhecimento de base \u00e0 alta expertise t\u00e9cnica.</p><div class=\"hero-actions\"><a class=\"btn btn-brand\" href=\"#/pt/neuroanchor\">Conhe\u00e7a nossos produtos</a><a href=\"#contact\" class=\"btn btn-ghost\" data-scroll=\"contact\">Fa\u00e7a parceria conosco</a></div></div><figure class=\"photo dark\" style=\"--r:4/3\" data-slot=\"HM\" role=\"img\" aria-label=\"Nossa equipe em campo\"><span class=\"slot\">HM</span><figcaption>Nossa equipe em campo</figcaption></figure></div></section><section class=\"sec\" id=\"vision\"><div class=\"wrap\"><div class=\"s-head\"><h2>Um ecossistema, da base ao mundo</h2><p class=\"lede\">A D3S Intelligence \u00e9 um neg\u00f3cio social que trabalha com a ONG D3S Consultoria e com a rede GSW-STEM. Juntas, formam um desenho institucional internacional de empreendedorismo de impacto social, capaz de construir tecnologia para o impacto social, do conhecimento de base \u00e0 alta expertise t\u00e9cnica.</p></div><span class=\"fig\">Fig 0.1. Como o ecossistema funciona</span><div class=\"flow4\" role=\"group\" aria-label=\"Como o ecossistema funciona\"><div class=\"fnode ground\"><span class=\"fig\">A base</span><h3>Iniciativas de base e problemas sociais</h3><p>Onde o trabalho come\u00e7a</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">A ponte</span><h3>D3S Consultoria</h3><p>ONG, desde 2024</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode key\"><span class=\"fig\">As solu\u00e7\u00f5es</span><h3>D3S Intelligence</h3><p>Neg\u00f3cio social</p></div><div class=\"conn\" aria-hidden=\"true\"><svg viewBox=\"0 0 40 24\" width=\"24\" height=\"16\"><path d=\"M2 12 H34 M26 4 L36 12 L26 20\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/></svg></div><div class=\"fnode\"><span class=\"fig\">A escala</span><h3>Internacional</h3><p>Come\u00e7ando pela GSW-STEM</p></div></div><div class=\"three explain\"><div><span class=\"fig\">A ponte</span><h3>D3S Consultoria, o elo com a base</h3><p>Uma ONG ativa desde 2024 que trabalha diretamente com as pessoas que vivem os problemas sociais no Brasil. O que ela aprende no territ\u00f3rio vira pesquisa, forma\u00e7\u00e3o e o ponto de partida de cada ferramenta que constru\u00edmos.</p><a class=\"inl\" href=\"#/pt/method\">Conhe\u00e7a o m\u00e9todo</a></div><div><span class=\"fig\">O neg\u00f3cio</span><h3>D3S Intelligence, solu\u00e7\u00f5es inteligentes</h3><p>Um neg\u00f3cio social que oferece solu\u00e7\u00f5es de tecnologia inteligente para esses problemas. Ele se apoia no que o campo e a rede ensinam e reinveste seu lucro na miss\u00e3o.</p><a class=\"inl\" href=\"#/pt/neuroanchor\">Conhe\u00e7a os produtos</a></div><div><span class=\"fig\">A escala</span><h3>Internacional, feito para escalar</h3><p>A D3S Intelligence atua al\u00e9m das fronteiras por meio de iniciativas. A primeira \u00e9 a GSW-STEM, uma rede de mulheres em tecnologia em sete pa\u00edses: Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia. Outras vir\u00e3o.</p><a class=\"inl\" href=\"#/pt/international\">Conhe\u00e7a a atua\u00e7\u00e3o internacional</a></div></div></div></section><section class=\"proof\"><div class=\"wrap\"><div class=\"stats\"><div class=\"stat\"><b>35.000+</b><span>pessoas alcan\u00e7adas por meio de organiza\u00e7\u00f5es parceiras</span></div><div class=\"stat\"><b>40+</b><span>profissionais formados em dados para impacto social</span></div><div class=\"stat\"><b>2</b><span>reconhecimentos internacionais: Systers Pass It On e BRICS Young Innovators</span></div><div class=\"stat\"><b>7</b><span>pa\u00edses na rede GSW-STEM</span></div></div><p class=\"names\"><b>Algumas organiza\u00e7\u00f5es com que atuamos, no Brasil:</b> Abra\u00e7o Campe\u00e3o (educa\u00e7\u00e3o de jovens, Rio de Janeiro), ELO (inclus\u00e3o de jovens, Curitiba), Engajamundo (justi\u00e7a clim\u00e1tica), Reprograma (mulheres em tecnologia) e outras.</p></div></section><section class=\"sec alt\" id=\"home-products\"><div class=\"wrap\"><div class=\"s-head\"><h2>Produtos constru\u00eddos a partir da experi\u00eancia de campo</h2><p class=\"lede\">Cada um nasce de um problema em que trabalhamos manualmente em campo, e transforma essa pr\u00e1tica em algo repet\u00edvel.</p></div><div class=\"prods\"><article class=\"prod\"><span class=\"fig\">Produto 1</span><div class=\"status\"><i></i>No ar em beta para Android e iOS</div><h3>NeuroAnchor</h3><p class=\"one\">Para trazer voc\u00ea de volta quando o hiperfoco assume.</p><p class=\"desc\">Para mentes que desaparecem dentro do que amam. Um lembrete gentil e inesperado para comer, beber \u00e1gua, se mexer e se reconectar, sem quebrar o seu foco. Gr\u00e1tis para come\u00e7ar, Premium em desenvolvimento.</p><div class=\"prod-viz\"><div class=\"phone\" data-slot=\"NA\" aria-label=\"Telas do NeuroAnchor, ilustrativas\"><div class=\"notch\"></div><div class=\"notif\"><div class=\"ico\">N</div><div><small>NeuroAnchor, agora</small>Faz um tempo. Voc\u00ea bebeu \u00e1gua?</div></div><div class=\"chk\">Como voc\u00ea est\u00e1?</div><div class=\"chk-grid\"><span>Bebi \u00e1gua</span><span>Comi</span><span>Me alonguei</span><span>Falei com algu\u00e9m</span></div><div class=\"chk-note\">Sem press\u00e3o. Agora n\u00e3o tamb\u00e9m vale.</div></div></div><ul class=\"facts\"><li><span>Para</span><b>Pessoas neurodivergentes e ansiosas</b></li><li><span>Privacidade</span><b>Sem an\u00fancios, sem venda de dados</b></li><li><span>Planos</span><b>Gr\u00e1tis agora, Premium em desenvolvimento</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"mailto:contato@d3sconsultoria.com.br?subject=NeuroAnchor%20beta&amp;body=Aparelho%20%28Android%20ou%20iOS%29%3A%0ANome%3A\">Baixe gr\u00e1tis</a><a class=\"btn btn-line\" href=\"#/pt/neuroanchor\">Saiba mais</a></div></article><article class=\"prod\"><span class=\"fig\">Produto 2</span><div class=\"status pilot\"><i></i>Piloto: buscamos organiza\u00e7\u00f5es</div><h3>GroundCommons</h3><p class=\"one\">Uma plataforma gratuita para organiza\u00e7\u00f5es de base organizarem os dados que j\u00e1 t\u00eam.</p><div class=\"prod-viz fill gcfig\" data-slot=\"GC\"><svg viewBox=\"0 0 240 150\" width=\"100%\" height=\"150\" aria-hidden=\"true\" class=\"cmn\"><g stroke=\"#DCD8E4\" stroke-width=\"1.5\"><line x1=\"120\" y1=\"75\" x2=\"40\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"14\"/><line x1=\"120\" y1=\"75\" x2=\"200\" y2=\"30\"/><line x1=\"120\" y1=\"75\" x2=\"210\" y2=\"95\"/><line x1=\"120\" y1=\"75\" x2=\"120\" y2=\"136\"/><line x1=\"120\" y1=\"75\" x2=\"30\" y2=\"100\"/></g><g fill=\"#FFFFFF\" stroke=\"#865CA3\" stroke-width=\"2\"><circle cx=\"40\" cy=\"30\" r=\"9\"/><circle cx=\"120\" cy=\"14\" r=\"9\"/><circle cx=\"200\" cy=\"30\" r=\"9\"/><circle cx=\"210\" cy=\"95\" r=\"9\"/><circle cx=\"120\" cy=\"136\" r=\"9\"/><circle cx=\"30\" cy=\"100\" r=\"9\"/></g><circle cx=\"120\" cy=\"75\" r=\"18\" fill=\"#865CA3\"/></svg></div><ul class=\"facts\"><li><span>Para</span><b>Organiza\u00e7\u00f5es de base com dados desagregados</b></li><li><span>Voc\u00ea recebe</span><b>Acesso gratuito \u00e0 plataforma</b></li><li><span>Piloto</span><b>Buscamos organiza\u00e7\u00f5es</b></li></ul><div class=\"acts\"><a class=\"btn btn-brand\" href=\"#/pt/groundcommons\">Participe do piloto</a></div></article></div><p class=\"note-draft\">Mais produtos est\u00e3o em desenvolvimento.</p></div></section><section class=\"sec\"><div class=\"wrap\"><div class=\"s-head\"><h2>O que sustenta os produtos</h2><p class=\"lede\">Expertise constru\u00edda em campo, reputa\u00e7\u00e3o reconhecida no exterior e uma rede que j\u00e1 cruza fronteiras.</p></div><div class=\"trio\"><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F1\" role=\"img\" aria-label=\"Trabalho de campo em uma favela do Rio de Janeiro\"><span class=\"slot\">F1</span><figcaption>Trabalho de campo em uma favela do Rio de Janeiro</figcaption></figure><span class=\"fig\">M\u00e9todo</span><h3>Constru\u00edda por dentro</h3><ul class=\"plain\"><li>Uma equipe que j\u00e1 atuou com comunidades de favela, ind\u00edgenas e quilombolas e com v\u00edtimas de viola\u00e7\u00f5es de direitos</li><li>Ferramentas constru\u00eddas com as pessoas que elas atendem</li><li>Experi\u00eancia dentro dos governos de S\u00e3o Paulo, a maior cidade e o maior estado do pa\u00eds</li></ul><a class=\"inl\" href=\"#/pt/method\">Conhe\u00e7a o m\u00e9todo</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Evento de premia\u00e7\u00e3o, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Evento de premia\u00e7\u00e3o, Systers Pass It On</figcaption></figure><span class=\"fig\">Reputa\u00e7\u00e3o</span><h3>Reconhecimento no exterior</h3><ul class=\"plain\"><li>Systers Pass It On Award 2024, da AnitaB.org, a comunidade global de mulheres na computa\u00e7\u00e3o</li><li>Reconhecimento BRICS Young Innovators</li><li>A fundadora integra o Grupo de Trabalho Interministerial de Indicadores de S\u00e3o Paulo, a maior cidade do Brasil</li></ul><a class=\"inl\" href=\"#/pt/about\">Conhe\u00e7a nossa hist\u00f3ria</a></article><article><figure class=\"photo \" style=\"--r:4/3\" data-slot=\"F5\" role=\"img\" aria-label=\"Delega\u00e7\u00e3o \u00e0 China\"><span class=\"slot\">F5</span><figcaption>Delega\u00e7\u00e3o \u00e0 China</figcaption></figure><span class=\"fig\">Alcance</span><h3>Internacional desde a origem</h3><ul class=\"plain\"><li>GSW-STEM, nossa primeira iniciativa: Brasil, M\u00e9xico, Uganda, Camar\u00f5es, \u00c1frica do Sul, \u00cdndia e Eti\u00f3pia</li><li>Encontros realizados entre regi\u00f5es</li><li>Agora construindo novos la\u00e7os na China</li></ul><a class=\"inl\" href=\"#/pt/international\">Conhe\u00e7a nossa atua\u00e7\u00e3o internacional</a></article></div></div></section><section class=\"sec alt\"><div class=\"wrap two\"><div><h2>O lucro volta para a miss\u00e3o</h2><p class=\"lede\" style=\"margin-top:16px\">A D3S Intelligence reinveste seu lucro na pesquisa e na forma\u00e7\u00e3o da D3S Consultoria e na rede GSW-STEM, para que a expertise por tr\u00e1s dos produtos continue crescendo.</p></div><div class=\"links\" style=\"margin-top:0\"><a class=\"btn btn-line\" href=\"#/pt/about\">Veja como \u00e9 financiado</a></div></div></section><section class=\"ink contact\" id=\"contact\"><div class=\"wrap\"><h2>Fa\u00e7a parceria conosco</h2><div class=\"paths\"><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Financiadores%20e%20funda%C3%A7%C3%B5es\"><b>Financiadores e funda\u00e7\u00f5es</b><span>Financie pesquisa ou patrocine o acesso \u00e0s nossas ferramentas para as organiza\u00e7\u00f5es que voc\u00ea apoia.</span><em>Inicie uma conversa</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Governos%20e%20prefeituras\"><b>Governos e prefeituras</b><span>Evid\u00eancias, indicadores e ferramentas de mapeamento de risco para pol\u00edticas p\u00fablicas.</span><em>Fale conosco</em></a><a href=\"#/pt/groundcommons\"><b>ONGs e institutos</b><span>Participe do piloto do GroundCommons com os dados da sua organiza\u00e7\u00e3o.</span><em>Inscreva-se no piloto</em></a><a href=\"mailto:contato@d3sconsultoria.com.br?subject=Empresas%20e%20parceiros\"><b>Empresas e parceiros</b><span>Mensura\u00e7\u00e3o de impacto, pesquisa e parcerias no Brasil e no Sul Global.</span><em>Fa\u00e7a parceria conosco</em></a></div></div></section></div><div class=\"view\" data-view=\"about\"><section class=\"ink page-hero\"><div class=\"wrap ph-split\"><div><h1>Dois anos de trabalho, e o que vem a seguir.</h1><p class=\"lede\">A D3S Consultoria nasceu em 2024 como uma ONG volunt\u00e1ria para ajudar organiza\u00e7\u00f5es a usar bem os dados. Hoje a D3S Intelligence, um neg\u00f3cio social e think tank, re\u00fane essa expertise com a rede GSW-STEM e um conjunto de produtos.</p></div><figure class=\"photo dark \" style=\"--r:4/3\" data-slot=\"E1\" role=\"img\" aria-label=\"Evento de premia\u00e7\u00e3o, Systers Pass It On\"><span class=\"slot\">E1</span><figcaption>Evento de premia\u00e7\u00e3o, Systers Pass It On</figcaption></figure></div></section><section class=\"sec\" id=\"people\"><div class=\"wrap\"><div class=\"s-head\"><h2>Nossa equipe</h2><p class=\"lede\">Uma lideran\u00e7a que atua em tr\u00eas institui\u00e7\u00f5es. Cada uma tem a sua pr\u00f3pria estrutura.</p></div><span class=\"fig\">Lideran\u00e7a</span><div class=\"leads\"><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T1\" role=\"img\" aria-label=\"Phirtia Silva\">PS</span><div class=\"lead-b\"><h3>Phirtia Silva</h3><p class=\"role\">Fundadora e CEO</p><p class=\"bio\">Cientista de dados que come\u00e7ou como cientista social, e \u00e9 essa combina\u00e7\u00e3o que move a D3S. Fez trabalho de campo etnogr\u00e1fico em favelas e comunidades de refugiados e construiu os sistemas de aprendizado de m\u00e1quina e geoespaciais que transformam essa evid\u00eancia em pol\u00edtica p\u00fablica: um sistema integrado de an\u00e1lise que cobre cinco servi\u00e7os p\u00fablicos e mais de um milh\u00e3o de atendimentos por m\u00eas para a prefeitura de S\u00e3o Paulo, e um modelo publicado do risco de feminic\u00eddio nos munic\u00edpios brasileiros. Construiu o NeuroAnchor, \u00e9 BRICS Young Innovator, foi premiada pelo Systers Pass It On e conclui um MPA na London School of Economics.</p></div></article><article class=\"lead\"><span class=\"av pic portrait\" data-slot=\"T2\" role=\"img\" aria-label=\"Thayna Mesquita\">TM</span><div class=\"lead-b\"><h3>Thayna Mesquita</h3><p class=\"role\">Diretora de Parcerias</p><p class=\"bio\">Nossa ponte com o setor p\u00fablico. H\u00e1 mais de seis anos atua dentro do setor p\u00fablico de S\u00e3o Paulo, hoje na Secretaria de Estado da Cultura, monitorando indicadores e a execu\u00e7\u00e3o f\u00edsica e financeira de programas culturais e, antes, a presta\u00e7\u00e3o de
